<svg viewBox="0 0 560 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="420" fill="#ffffff"/>
  <defs>
    <marker id="ao" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 z" fill="#f2a73b"/>
    </marker>
  </defs>

  <text x="20" y="30" font-family="sans-serif" font-size="19" fill="#1c2b36">図: 山を越えて下りる空気塊(凝結なし)</text>

  <!-- 凡例 -->
  <text x="20" y="53" font-family="sans-serif" font-size="14" fill="#5a6b78">※ 周囲の気温: 6℃/km で低下(0mで30℃)</text>
  <rect x="20" y="62" width="12" height="12" fill="#f2a73b"/>
  <text x="38" y="73" font-family="sans-serif" font-size="14" fill="#f2a73b">空気塊: 乾燥断熱 10℃/km</text>

  <!-- 高度軸 -->
  <line x1="76" y1="94" x2="76" y2="334" stroke="#5a6b78" stroke-width="1.5"/>
  <line x1="70" y1="330" x2="76" y2="330" stroke="#5a6b78" stroke-width="1.5"/>
  <line x1="70" y1="146" x2="76" y2="146" stroke="#5a6b78" stroke-width="1.5"/>
  <line x1="70" y1="100" x2="76" y2="100" stroke="#5a6b78" stroke-width="1.5"/>
  <text x="64" y="335" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="end">0m</text>
  <text x="64" y="151" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="end">1200m</text>
  <text x="64" y="105" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="end">1500m</text>

  <!-- 補助線 -->
  <line x1="76" y1="146" x2="116" y2="146" stroke="#5a6b78" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="76" y1="100" x2="308" y2="100" stroke="#5a6b78" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- 山と地面 -->
  <path d="M206 330 L316 100 L436 330 Z" fill="#eef2f4" stroke="#5a6b78" stroke-width="1.5"/>
  <line x1="76" y1="330" x2="540" y2="330" stroke="#1c2b36" stroke-width="2"/>

  <!-- 経路 -->
  <path d="M132 142 C196 126, 258 116, 306 104" fill="none" stroke="#f2a73b" stroke-width="3" marker-end="url(#ao)"/>
  <path d="M326 106 C378 170, 426 254, 470 317" fill="none" stroke="#f2a73b" stroke-width="3" marker-end="url(#ao)"/>

  <!-- 出発点 -->
  <circle cx="124" cy="146" r="8" fill="#f2a73b" stroke="#1c2b36" stroke-width="1.5"/>
  <text x="124" y="176" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1c2b36" text-anchor="middle">22.8℃</text>
  <text x="124" y="196" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="middle">周囲と同じ</text>

  <!-- 山頂 -->
  <circle cx="316" cy="100" r="7" fill="#f2a73b" stroke="#1c2b36" stroke-width="1.5"/>
  <text x="316" y="90" font-family="sans-serif" font-size="14" fill="#1c2b36" text-anchor="middle">山頂 19.8℃</text>

  <!-- 到着点 -->
  <circle cx="476" cy="322" r="8" fill="#f2a73b" stroke="#e0524d" stroke-width="2"/>
  <text x="500" y="296" font-family="sans-serif" font-size="17" font-weight="bold" fill="#e0524d" text-anchor="middle">34.8℃</text>
  <text x="156" y="322" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="middle">周囲 30℃</text>

  <!-- まとめ -->
  <rect x="20" y="350" width="520" height="48" rx="6" fill="#f7f9fa" stroke="#dce3e8" stroke-width="1"/>
  <text x="280" y="372" font-family="sans-serif" font-size="15" fill="#1c2b36" text-anchor="middle">22.8℃ ＋ 10℃/km × 1.2km ＝ 34.8℃</text>
  <text x="280" y="391" font-family="sans-serif" font-size="13" fill="#e0524d" text-anchor="middle">正味 1200m の下降。麓の周囲 30℃ より 4.8℃ 高い</text>
</svg>
