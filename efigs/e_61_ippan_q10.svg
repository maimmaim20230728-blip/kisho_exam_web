<svg viewBox="0 0 560 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="420" fill="#ffffff"/>
  <defs>
    <marker id="md" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c2b36"/>
    </marker>
  </defs>

  <text x="24" y="30" font-family="sans-serif" font-size="19" fill="#1c2b36">夏の極でおきる上下のねじれ</text>
  <text x="24" y="58" font-family="sans-serif" font-size="14" fill="#5a6b78">成層圏では最も暖かく、中間圏界面では −100℃以下まで下がる</text>
  <rect x="452" y="44" width="84" height="28" rx="6" fill="#2569a8" opacity="0.12"/>
  <rect x="452" y="44" width="84" height="28" rx="6" fill="none" stroke="#2569a8" stroke-width="1.2"/>
  <text x="494" y="64" font-family="sans-serif" font-size="15" fill="#2569a8" text-anchor="middle">北半球</text>

  <!-- 軸 -->
  <text transform="rotate(-90 26 232)" x="26" y="232" font-family="sans-serif" font-size="14" fill="#5a6b78" text-anchor="middle">高度(km)</text>
  <line x1="64" y1="370" x2="64" y2="84" stroke="#1c2b36" stroke-width="1.5" marker-end="url(#md)"/>
  <line x1="64" y1="370" x2="500" y2="370" stroke="#1c2b36" stroke-width="1.5" marker-end="url(#md)"/>
  <text x="56" y="375" font-family="sans-serif" font-size="13" fill="#1c2b36" text-anchor="end">0</text>
  <text x="56" y="344" font-family="sans-serif" font-size="13" fill="#1c2b36" text-anchor="end">10</text>
  <text x="56" y="219" font-family="sans-serif" font-size="13" fill="#1c2b36" text-anchor="end">50</text>
  <text x="56" y="126" font-family="sans-serif" font-size="13" fill="#1c2b36" text-anchor="end">80</text>

  <line x1="85" y1="370" x2="85" y2="376" stroke="#1c2b36" stroke-width="1.2"/>
  <line x1="187" y1="370" x2="187" y2="376" stroke="#1c2b36" stroke-width="1.2"/>
  <line x1="290" y1="370" x2="290" y2="376" stroke="#1c2b36" stroke-width="1.2"/>
  <line x1="393" y1="370" x2="393" y2="376" stroke="#1c2b36" stroke-width="1.2"/>
  <text x="85" y="392" font-family="sans-serif" font-size="13" fill="#1c2b36" text-anchor="middle">−120</text>
  <text x="187" y="392" font-family="sans-serif" font-size="13" fill="#1c2b36" text-anchor="middle">−80</text>
  <text x="290" y="392" font-family="sans-serif" font-size="13" fill="#1c2b36" text-anchor="middle">−40</text>
  <text x="393" y="392" font-family="sans-serif" font-size="13" fill="#1c2b36" text-anchor="middle">0</text>
  <text x="536" y="392" font-family="sans-serif" font-size="14" fill="#5a6b78" text-anchor="end">気温(℃)</text>

  <!-- 各界面 -->
  <line x1="64" y1="339" x2="470" y2="339" stroke="#5a6b78" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="64" y1="214" x2="470" y2="214" stroke="#5a6b78" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="64" y1="121" x2="470" y2="121" stroke="#5a6b78" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="474" y="344" font-family="sans-serif" font-size="14" fill="#5a6b78">対流圏界面</text>
  <text x="474" y="219" font-family="sans-serif" font-size="14" fill="#5a6b78">成層圏界面</text>
  <text x="474" y="126" font-family="sans-serif" font-size="14" fill="#5a6b78">中間圏界面</text>

  <!-- 冬の極 -->
  <path d="M303,370 L251,339 L239,308 L264,277 L303,246 L328,214 L316,183 L277,152 L251,121 L239,90" fill="none" stroke="#2569a8" stroke-width="2.5"/>
  <text x="226" y="320" font-family="sans-serif" font-size="15" fill="#2569a8" text-anchor="end">冬の極</text>

  <!-- 夏の極 -->
  <path d="M393,370 L277,339 L277,308 L328,277 L380,246 L406,214 L341,183 L239,152 L85,121 L111,90" fill="none" stroke="#e0524d" stroke-width="2.5"/>
  <text x="414" y="208" font-family="sans-serif" font-size="15" fill="#e0524d">夏の極</text>
  <circle cx="85" cy="121" r="5" fill="#e0524d"/>
  <text x="109" y="108" font-family="sans-serif" font-size="14" fill="#e0524d">地球上で最も低温</text>

  <text x="340" y="144" font-family="sans-serif" font-size="13" fill="#e0524d">夏の極は上昇し</text>
  <text x="340" y="164" font-family="sans-serif" font-size="13" fill="#e0524d">断熱膨張で冷える</text>

  <text x="118" y="256" font-family="sans-serif" font-size="14" fill="#1c2b36">成層圏では</text>
  <text x="118" y="278" font-family="sans-serif" font-size="14" fill="#1c2b36">夏の極が暖かい</text>
</svg>
