<svg viewBox="0 0 560 448" xmlns="http://www.w3.org/2000/svg">
<rect width="560" height="448" fill="#ffffff"/>
<defs>
<marker id="aO" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#f2a73b"/></marker>
<marker id="aRs" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#e0524d"/></marker>
<marker id="aRl" markerUnits="userSpaceOnUse" markerWidth="17" markerHeight="17" refX="16" refY="8.5" orient="auto"><path d="M0,0 L17,8.5 L0,17 Z" fill="#e0524d"/></marker>
</defs>

<text x="20" y="35" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1c2b36">短波(太陽放射)と長波(赤外放射)のちがい</text>

<rect x="20" y="46" width="248" height="342" rx="6" fill="none" stroke="#d7dee3" stroke-width="1.2"/>
<rect x="292" y="46" width="248" height="342" rx="6" fill="none" stroke="#d7dee3" stroke-width="1.2"/>

<!-- パネルA 短波 -->
<text x="144" y="70" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#1c2b36" text-anchor="middle">短波(太陽放射)</text>
<text x="36" y="90" font-family="sans-serif" font-size="11" fill="#5a6b78">大気上端</text>
<line x1="32" y1="96" x2="256" y2="96" stroke="#5a6b78" stroke-width="1.2" stroke-dasharray="5 4"/>

<line x1="64" y1="104" x2="64" y2="188" stroke="#f2a73b" stroke-width="3" marker-end="url(#aO)"/>
<line x1="144" y1="188" x2="144" y2="104" stroke="#f2a73b" stroke-width="3" marker-end="url(#aO)"/>
<line x1="222" y1="104" x2="222" y2="188" stroke="#f2a73b" stroke-width="3" marker-end="url(#aO)"/>

<text x="64" y="206" font-family="sans-serif" font-size="12" fill="#1c2b36" text-anchor="middle">入射</text>
<text x="64" y="225" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1c2b36" text-anchor="middle">100</text>
<text x="144" y="206" font-family="sans-serif" font-size="12" fill="#1c2b36" text-anchor="middle">宇宙へ戻る</text>
<text x="144" y="225" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f2a73b" text-anchor="middle">約30</text>
<text x="144" y="242" font-family="sans-serif" font-size="10.5" fill="#5a6b78" text-anchor="middle">惑星アルベド</text>
<text x="222" y="206" font-family="sans-serif" font-size="12" fill="#1c2b36" text-anchor="middle">地球へ</text>
<text x="222" y="225" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1c2b36" text-anchor="middle">約70</text>

<text x="32" y="278" font-family="sans-serif" font-size="12.5" fill="#1c2b36">雲・エーロゾル・大気による散乱</text>
<text x="32" y="296" font-family="sans-serif" font-size="12.5" fill="#1c2b36">と反射、それに地表面での反射で</text>
<text x="32" y="314" font-family="sans-serif" font-size="12.5" fill="#1c2b36">入射の約3割が宇宙へ戻ります</text>

<line x1="32" y1="326" x2="256" y2="326" stroke="#1c2b36" stroke-width="2.5"/>
<text x="32" y="344" font-family="sans-serif" font-size="12" fill="#5a6b78">地表</text>

<!-- パネルB 長波 -->
<text x="416" y="70" font-family="sans-serif" font-size="14.5" font-weight="bold" fill="#1c2b36" text-anchor="middle">長波(赤外放射)</text>
<line x1="416" y1="84" x2="416" y2="312" stroke="#eef2f5" stroke-width="1"/>

<text x="356" y="88" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1c2b36" text-anchor="middle">上層雲</text>
<circle cx="340" cy="117" r="14" fill="#e3ebf1"/>
<circle cx="368" cy="114" r="18" fill="#e3ebf1"/>
<ellipse cx="356" cy="126" rx="44" ry="13" fill="#e3ebf1"/>
<text x="356" y="131" font-family="sans-serif" font-size="11.5" fill="#1c2b36" text-anchor="middle">約-50℃</text>
<line x1="356" y1="146" x2="356" y2="310" stroke="#e0524d" stroke-width="1.5" marker-end="url(#aRs)"/>
<text x="370" y="206" font-family="sans-serif" font-size="12" fill="#e0524d">弱い</text>
<text x="370" y="224" font-family="sans-serif" font-size="12" fill="#e0524d">赤外線</text>

<text x="476" y="196" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1c2b36" text-anchor="middle">下層雲</text>
<circle cx="458" cy="225" r="14" fill="#c8d4dc"/>
<circle cx="488" cy="222" r="18" fill="#c8d4dc"/>
<ellipse cx="476" cy="234" rx="46" ry="13" fill="#c8d4dc"/>
<text x="476" y="239" font-family="sans-serif" font-size="11.5" fill="#1c2b36" text-anchor="middle">約+5℃</text>
<line x1="476" y1="254" x2="476" y2="308" stroke="#e0524d" stroke-width="5" marker-end="url(#aRl)"/>
<text x="494" y="272" font-family="sans-serif" font-size="12" fill="#e0524d">強い</text>
<text x="494" y="290" font-family="sans-serif" font-size="12" fill="#e0524d">赤外線</text>

<line x1="300" y1="326" x2="532" y2="326" stroke="#1c2b36" stroke-width="2.5"/>
<text x="300" y="344" font-family="sans-serif" font-size="12" fill="#5a6b78">地表</text>
<text x="300" y="364" font-family="sans-serif" font-size="11" fill="#5a6b78">矢印の太さ＝赤外線の強さ</text>
<text x="300" y="380" font-family="sans-serif" font-size="11" fill="#5a6b78">(長さのちがいは雲の高さのちがい)</text>

<line x1="20" y1="396" x2="20" y2="436" stroke="#e0524d" stroke-width="3"/>
<text x="32" y="412" font-family="sans-serif" font-size="12.5" fill="#1c2b36">雲は、雲底の温度が高いほど地表へ戻す赤外線が強い</text>
<text x="32" y="432" font-family="sans-serif" font-size="12.5" fill="#1c2b36">水蒸気は、気温の高度分布が同じなら量が多いほど下向きの赤外線が強い</text>
</svg>
