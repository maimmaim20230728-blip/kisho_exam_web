<svg viewBox="0 0 560 410" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<rect width="560" height="410" fill="#ffffff"/>
<defs>
<marker id="q11b" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2569a8"/></marker>
<marker id="q11c" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2569a8"/></marker>
</defs>

<text x="28" y="32" font-size="17" font-weight="bold" fill="#1c2b36">エルニーニョ: 東風が弱まり暖水と積乱雲が東へ移る</text>

<!-- ===== 平年 ===== -->
<text x="24" y="62" font-size="15" font-weight="bold" fill="#1c2b36">平年</text>
<text x="120" y="62" font-size="12" fill="#5a6b78" text-anchor="middle">積乱雲が盛ん</text>
<path d="M84,114 C68,112 66,96 82,94 C84,80 108,72 120,82 C136,70 160,80 158,94 C172,96 172,112 158,114 Z" fill="#eaeef1" stroke="#5a6b78" stroke-width="1.5"/>

<line x1="500" y1="132" x2="230" y2="132" stroke="#2569a8" stroke-width="4" marker-end="url(#q11b)"/>
<text x="365" y="120" font-size="12" fill="#2569a8" text-anchor="middle">東風(貿易風)が強い</text>

<rect x="56" y="146" width="468" height="56" fill="#eaf1f7" stroke="#5a6b78" stroke-width="1"/>
<line x1="56" y1="146" x2="524" y2="146" stroke="#1c2b36" stroke-width="2"/>
<rect x="58" y="147" width="222" height="10" fill="#e0524d"/>
<text x="66" y="176" font-size="12" fill="#1c2b36">海面水温が高い</text>
<text x="66" y="194" font-size="12" fill="#1c2b36">暖かい海水が西に寄る</text>
<text x="458" y="170" font-size="12" fill="#2569a8" text-anchor="middle">冷たい水の湧昇</text>
<line x1="458" y1="198" x2="458" y2="180" stroke="#2569a8" stroke-width="2" marker-end="url(#q11c)"/>

<line x1="20" y1="214" x2="540" y2="214" stroke="#dde4e9" stroke-width="1"/>

<!-- ===== エルニーニョ時 ===== -->
<text x="24" y="238" font-size="15" font-weight="bold" fill="#e0524d">エルニーニョ時</text>
<text x="293" y="238" font-size="12" fill="#5a6b78" text-anchor="middle">積乱雲が日付変更線付近へ東進</text>
<path d="M258,290 C242,288 240,272 256,270 C258,256 282,248 294,258 C310,246 334,256 332,270 C346,272 346,288 332,290 Z" fill="#eaeef1" stroke="#5a6b78" stroke-width="1.5"/>

<text x="66" y="256" font-size="12" fill="#1c2b36">ダーウィン</text>
<text x="66" y="274" font-size="12" fill="#1c2b36">海面気圧 高い</text>
<text x="450" y="256" font-size="12" fill="#1c2b36" text-anchor="end">タヒチ</text>
<text x="450" y="274" font-size="12" fill="#1c2b36" text-anchor="end">海面気圧 低い</text>

<line x1="420" y1="306" x2="330" y2="306" stroke="#2569a8" stroke-width="2.5" marker-end="url(#q11b)"/>
<text x="430" y="302" font-size="12" fill="#2569a8">東風が弱まる</text>

<rect x="56" y="312" width="468" height="56" fill="#eaf1f7" stroke="#5a6b78" stroke-width="1"/>
<line x1="56" y1="312" x2="524" y2="312" stroke="#1c2b36" stroke-width="2"/>
<rect x="190" y="313" width="310" height="10" fill="#e0524d"/>
<text x="62" y="342" font-size="12" fill="#5a6b78">水温は平年より低め</text>
<text x="196" y="342" font-size="12" fill="#1c2b36">海面水温の高い領域が東へ</text>
<text x="196" y="360" font-size="12" fill="#1c2b36">暖かい海水が東へ広がる</text>

<!-- 位置の目安 -->
<text x="58" y="390" font-size="12" fill="#5a6b78">インドネシア付近(西)</text>
<text x="290" y="390" font-size="12" fill="#5a6b78" text-anchor="middle">日付変更線付近</text>
<text x="522" y="390" font-size="12" fill="#5a6b78" text-anchor="end">南米沖(東)</text>
</svg>
