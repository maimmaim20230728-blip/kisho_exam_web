<svg viewBox="0 0 560 410" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="410" fill="#ffffff"/>
  <g font-family="sans-serif">
    <text x="24" y="30" font-size="18" fill="#1c2b36">高度15kmの気温は赤道付近でいちばん低い</text>
    <text x="68" y="52" font-size="14" fill="#5a6b78">高度(km)</text>

    <!-- 成層圏(圏界面より上) -->
    <path d="M62,60 L500,60 L500,224 L390,195 L300,175 L250,160 L205,108 L170,102 L62,100 Z" fill="#eceff2"/>
    <!-- 対流圏(圏界面より下) -->
    <path d="M62,100 L170,102 L205,108 L250,160 L300,175 L390,195 L500,224 L500,330 L62,330 Z" fill="#dfecf8"/>

    <!-- 高度15kmの線 -->
    <line x1="62" y1="128" x2="500" y2="128" stroke="#f2a73b" stroke-width="2.5" stroke-dasharray="7 5"/>

    <!-- 対流圏界面 -->
    <path d="M62,100 L170,102 L205,108 L250,160 L300,175 L390,195 L500,224" fill="none" stroke="#2569a8" stroke-width="3"/>

    <!-- 軸 -->
    <line x1="62" y1="60" x2="62" y2="330" stroke="#1c2b36" stroke-width="2"/>
    <line x1="62" y1="330" x2="500" y2="330" stroke="#1c2b36" stroke-width="2"/>
    <line x1="56" y1="60" x2="62" y2="60" stroke="#1c2b36" stroke-width="1.5"/>
    <line x1="56" y1="128" x2="62" y2="128" stroke="#1c2b36" stroke-width="1.5"/>
    <line x1="56" y1="195" x2="62" y2="195" stroke="#1c2b36" stroke-width="1.5"/>
    <line x1="56" y1="263" x2="62" y2="263" stroke="#1c2b36" stroke-width="1.5"/>

    <text x="52" y="65" font-size="14" fill="#1c2b36" text-anchor="end">20</text>
    <text x="52" y="133" font-size="14" fill="#1c2b36" text-anchor="end">15</text>
    <text x="52" y="200" font-size="14" fill="#1c2b36" text-anchor="end">10</text>
    <text x="52" y="268" font-size="14" fill="#1c2b36" text-anchor="end">5</text>
    <text x="52" y="335" font-size="14" fill="#1c2b36" text-anchor="end">0</text>

    <!-- 圏界面ラベル -->
    <line x1="275" y1="191" x2="275" y2="169" stroke="#2569a8" stroke-width="1.5"/>
    <text x="248" y="206" font-size="14" fill="#2569a8">対流圏界面</text>

    <text x="300" y="100" font-size="16" fill="#5a6b78">成層圏</text>
    <text x="95" y="300" font-size="16" fill="#5a6b78">対流圏</text>

    <!-- 赤道側の注記 -->
    <text x="72" y="156" font-size="14" fill="#1c2b36">高度15kmはまだ対流圏</text>
    <text x="72" y="178" font-size="14" fill="#1c2b36">約 −70℃ で最も低い</text>

    <!-- 高緯度側の注記 -->
    <text x="326" y="148" font-size="14" fill="#1c2b36">高度15kmはすでに成層圏</text>
    <text x="326" y="170" font-size="14" fill="#1c2b36">約 −50〜−60℃</text>

    <!-- 横軸 -->
    <text x="68" y="352" font-size="14" fill="#1c2b36">赤道</text>
    <text x="278" y="352" font-size="14" fill="#1c2b36" text-anchor="middle">中緯度</text>
    <text x="496" y="352" font-size="14" fill="#1c2b36" text-anchor="end">高緯度・極</text>

    <rect x="16" y="360" width="528" height="32" rx="6" fill="#f7f9fa"/>
    <text x="24" y="381" font-size="14" fill="#1c2b36">熱帯は対流圏界面が高いので、高度15kmはまだ対流圏の上部で非常に冷たい。</text>
  </g>
</svg>
