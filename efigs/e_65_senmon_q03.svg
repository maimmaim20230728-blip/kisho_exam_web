<svg viewBox="0 0 560 330" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="560" height="330" fill="#ffffff"/>
  <defs>
    <marker id="q03d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c2b36"/>
    </marker>
    <marker id="q03o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2a73b"/>
    </marker>
  </defs>

  <text x="24" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1c2b36">仰角一定のレーダーとブライトバンドの輪</text>

  <!-- 左: 鉛直断面 -->
  <text x="24" y="58" font-family="sans-serif" font-size="14" fill="#1c2b36">①鉛直断面(横から)</text>

  <rect x="30" y="161" width="262" height="29" fill="#dbe8f4"/>
  <text x="34" y="155" font-family="sans-serif" font-size="12" fill="#2569a8">融解層(0℃付近)</text>

  <line x1="44" y1="240" x2="292" y2="120" stroke="#2569a8" stroke-width="2.5"/>
  <line x1="147" y1="190" x2="207" y2="161" stroke="#f2a73b" stroke-width="6"/>
  <text x="130" y="112" font-family="sans-serif" font-size="12" fill="#2569a8">レーダービーム(仰角一定)</text>
  <line x1="194" y1="142" x2="182" y2="156" stroke="#f2a73b" stroke-width="1.5"/>
  <text x="196" y="136" font-family="sans-serif" font-size="12" fill="#f2a73b">強い反射</text>

  <line x1="30" y1="240" x2="292" y2="240" stroke="#1c2b36" stroke-width="2"/>
  <path d="M37,240 L51,240 L44,229 Z" fill="#1c2b36"/>
  <text x="24" y="254" font-family="sans-serif" font-size="12" fill="#1c2b36">レーダー</text>

  <line x1="147" y1="190" x2="147" y2="258" stroke="#5a6b78" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="207" y1="161" x2="207" y2="258" stroke="#5a6b78" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="44" y1="262" x2="292" y2="262" stroke="#1c2b36" stroke-width="1.5" marker-end="url(#q03d)"/>
  <line x1="147" y1="258" x2="147" y2="266" stroke="#1c2b36" stroke-width="1.5"/>
  <line x1="207" y1="258" x2="207" y2="266" stroke="#1c2b36" stroke-width="1.5"/>
  <text x="147" y="278" font-family="sans-serif" font-size="12" fill="#1c2b36" text-anchor="middle">約12km</text>
  <text x="207" y="278" font-family="sans-serif" font-size="12" fill="#1c2b36" text-anchor="middle">約19km</text>
  <text x="24" y="298" font-family="sans-serif" font-size="12" fill="#5a6b78">遠いほどビームの高度は高い</text>

  <!-- 右: レーダー画面 -->
  <text x="316" y="58" font-family="sans-serif" font-size="14" fill="#1c2b36">②レーダー画面(真上から)</text>

  <circle cx="430" cy="158" r="49" fill="none" stroke="#f2a73b" stroke-width="22"/>
  <circle cx="430" cy="158" r="28" fill="none" stroke="#f2a73b" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="424" y1="152" x2="436" y2="164" stroke="#1c2b36" stroke-width="2.5"/>
  <line x1="436" y1="152" x2="424" y2="164" stroke="#1c2b36" stroke-width="2.5"/>

  <line x1="472" y1="116" x2="502" y2="90" stroke="#5a6b78" stroke-width="1"/>
  <text x="544" y="84" font-family="sans-serif" font-size="11" fill="#1c2b36" text-anchor="end">約19km</text>
  <line x1="457" y1="185" x2="500" y2="214" stroke="#5a6b78" stroke-width="1"/>
  <text x="504" y="218" font-family="sans-serif" font-size="11" fill="#1c2b36">約12km</text>

  <text x="316" y="278" font-family="sans-serif" font-size="12" fill="#1c2b36">太い輪=ブライトバンド、×=レーダー</text>
  <text x="316" y="298" font-family="sans-serif" font-size="12" fill="#5a6b78">破線=融解層が下がったときの輪</text>
</svg>
