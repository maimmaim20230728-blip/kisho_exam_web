<svg viewBox="0 0 560 390" xmlns="http://www.w3.org/2000/svg">
<rect width="560" height="390" fill="#ffffff"/>
<defs>
<marker id="q8b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#2569a8"/></marker>
<marker id="q8bs" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7 Z" fill="#2569a8"/></marker>
<marker id="q8bse" markerWidth="8" markerHeight="7" refX="1" refY="3.5" orient="auto"><path d="M8 0 L0 3.5 L8 7 Z" fill="#2569a8"/></marker>
