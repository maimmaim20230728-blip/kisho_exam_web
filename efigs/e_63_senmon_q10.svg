<svg viewBox="0 0 560 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="560" height="420" fill="#ffffff"/>
  <defs>
    <marker id="aB" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2569a8"/>
    </marker>
    <marker id="aR" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#e0524d"/>
    </marker>
    <marker id="aG" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#5a6b78"/>
    </marker>
  </defs>

  <text x="24" y="38" font-size="19" fill="#1c2b36">台風の下層の吹き込みと壁雲</text>
  <text x="24" y="62" font-size="14" fill="#5a6b78">摩擦で中心へ吹き込む → 収束 → 上昇流 → 積乱雲が輪に並ぶ</text>
  <rect x="466" y="76" width="76" height="26" rx="6" fill="#eef3f7" stroke="#cfe0ec" stroke-width="1.5"/>
  <text x="480" y="94" font-size="14" fill="#1c2b36">北半球</text>

  <!-- 上層の吹き出し -->
  <text x="280" y="94" font-size="14" fill="#5a6b78" text-anchor="middle">上層は外へ吹き出す</text>
  <rect x="155" y="106" width="250" height="34" rx="11" fill="#2569a8" opacity="0.14"/>
  <line x1="230" y1="132" x2="152" y2="110" stroke="#5a6b78" stroke-width="2.5" marker-end="url(#aG)"/>
  <line x1="330" y1="132" x2="408" y2="110" stroke="#5a6b78" stroke-width="2.5" marker-end="url(#aG)"/>

  <!-- 壁雲(上ほど外へ開く) -->
  <path d="M228,286 L212,146 L248,138 L264,286 z" fill="#2569a8" opacity="0.25"/>
  <path d="M332,286 L348,146 L312,138 L296,286 z" fill="#2569a8" opacity="0.25"/>

  <!-- 眼の下降流 -->
  <line x1="280" y1="150" x2="280" y2="236" stroke="#5a6b78" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aG)"/>
  <text x="280" y="272" font-size="16" fill="#1c2b36" text-anchor="middle">眼</text>

  <!-- 上昇流 -->
  <line x1="244" y1="272" x2="244" y2="152" stroke="#e0524d" stroke-width="3" marker-end="url(#aR)"/>
  <line x1="316" y1="272" x2="316" y2="152" stroke="#e0524d" stroke-width="3" marker-end="url(#aR)"/>

  <!-- 海面と吹き込み -->
  <line x1="40" y1="286" x2="520" y2="286" stroke="#1c2b36" stroke-width="2"/>
  <rect x="40" y="286" width="480" height="14" fill="#2569a8" opacity="0.12"/>
  <line x1="112" y1="268" x2="218" y2="268" stroke="#2569a8" stroke-width="3" marker-end="url(#aB)"/>
  <line x1="448" y1="268" x2="342" y2="268" stroke="#2569a8" stroke-width="3" marker-end="url(#aB)"/>
  <text x="44" y="262" font-size="14" fill="#2569a8">摩擦で吹き込む</text>

  <!-- 平面インセット -->
  <text x="110" y="146" font-size="14" fill="#1c2b36" text-anchor="middle">上から見ると反時計回り</text>
  <circle cx="110" cy="194" r="42" fill="none" stroke="#dfe5ea" stroke-width="1.5"/>
  <circle cx="110" cy="194" r="7" fill="#ffffff" stroke="#5a6b78" stroke-width="1.5"/>
  <g fill="none" stroke="#2569a8" stroke-width="2">
    <path d="M158,214 C164,184 148,164 124,160" marker-end="url(#aB)"/>
    <path d="M60,174 C54,204 70,224 94,228" marker-end="url(#aB)"/>
  </g>

  <!-- 右の説明 -->
  <text x="364" y="170" font-size="14" fill="#1c2b36">摩擦で内向きに</text>
  <text x="364" y="196" font-size="14" fill="#1c2b36">吹き込んだ空気が</text>
  <text x="364" y="222" font-size="14" fill="#1c2b36">中心付近で収束し</text>
  <text x="364" y="248" font-size="14" fill="#e0524d">上昇して壁雲になる</text>

  <line x1="24" y1="310" x2="536" y2="310" stroke="#e6ebef" stroke-width="1.5"/>

  <!-- 海面水温の条件 -->
  <text x="24" y="330" font-size="16" fill="#1c2b36">高温なのが薄い層だけだと発達は抑えられる</text>
  <line x1="44" y1="352" x2="230" y2="352" stroke="#1c2b36" stroke-width="2"/>
  <rect x="44" y="352" width="186" height="9" fill="#e0524d" opacity="0.35"/>
  <rect x="44" y="361" width="186" height="20" fill="#2569a8" opacity="0.15"/>
  <line x1="137" y1="377" x2="137" y2="357" stroke="#2569a8" stroke-width="2.5" marker-end="url(#aB)"/>
  <text x="44" y="397" font-size="14" fill="#2569a8">かき混ぜと湧昇で冷える</text>
  <text x="250" y="354" font-size="14" fill="#e0524d">暖かいのは表面だけで</text>
  <text x="250" y="376" font-size="14" fill="#1c2b36">熱と水蒸気の供給が</text>
  <text x="250" y="398" font-size="14" fill="#1c2b36">細り発達が抑えられる</text>
</svg>
