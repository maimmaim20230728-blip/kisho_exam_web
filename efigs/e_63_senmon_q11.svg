<svg viewBox="0 0 560 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="560" height="420" fill="#ffffff"/>
  <defs>
    <marker id="aB" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2569a8"/>
    </marker>
    <marker id="aR" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#e0524d"/>
    </marker>
  </defs>

  <text x="24" y="38" font-size="19" fill="#1c2b36">ダウンバーストの成り立ちと広がり</text>
  <text x="24" y="62" font-size="14" fill="#5a6b78">乾いた層での蒸発が下降流を強め、地表で四方へ広がる</text>

  <text x="24" y="88" font-size="16" fill="#1c2b36">(1) 雲底の下が乾いているほど下降流は強い</text>

  <rect x="158" y="100" width="264" height="22" rx="9" fill="#2569a8" opacity="0.14"/>
  <rect x="182" y="110" width="216" height="66" rx="22" fill="#2569a8" opacity="0.24"/>
  <line x1="182" y1="176" x2="398" y2="176" stroke="#5a6b78" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="176" y="180" font-size="14" fill="#5a6b78" text-anchor="end">雲底</text>

  <rect x="152" y="178" width="276" height="62" fill="#f2a73b" opacity="0.10"/>
  <text x="162" y="200" font-size="14" fill="#f2a73b">乾いた層</text>
  <g fill="#2569a8">
    <circle cx="250" cy="186" r="3"/><circle cx="250" cy="197" r="2.4"/><circle cx="250" cy="208" r="1.7"/><circle cx="250" cy="218" r="1"/>
    <circle cx="330" cy="184" r="3"/><circle cx="330" cy="195" r="2.4"/><circle cx="330" cy="206" r="1.7"/><circle cx="330" cy="216" r="1"/>
  </g>
  <line x1="290" y1="182" x2="290" y2="248" stroke="#2569a8" stroke-width="5" marker-end="url(#aB)"/>
  <text x="344" y="196" font-size="14" fill="#1c2b36">蒸発で空気が冷え</text>
  <text x="344" y="220" font-size="14" fill="#1c2b36">重くなって落ちる</text>

  <line x1="40" y1="258" x2="520" y2="258" stroke="#1c2b36" stroke-width="2"/>
  <line x1="276" y1="252" x2="142" y2="252" stroke="#2569a8" stroke-width="3" marker-end="url(#aB)"/>
  <line x1="304" y1="252" x2="438" y2="252" stroke="#2569a8" stroke-width="3" marker-end="url(#aB)"/>
  <text x="44" y="246" font-size="14" fill="#2569a8">水平に吹き出す</text>

  <line x1="142" y1="272" x2="438" y2="272" stroke="#5a6b78" stroke-width="1.5"/>
  <line x1="142" y1="266" x2="142" y2="278" stroke="#5a6b78" stroke-width="1.5"/>
  <line x1="438" y1="266" x2="438" y2="278" stroke="#5a6b78" stroke-width="1.5"/>
  <text x="290" y="292" font-size="14" fill="#5a6b78" text-anchor="middle">数百m 〜 10km</text>

  <line x1="24" y1="308" x2="536" y2="308" stroke="#e6ebef" stroke-width="1.5"/>

  <text x="24" y="332" font-size="16" fill="#1c2b36">(2) 被害は円形や楕円形に面的に広がる</text>
  <ellipse cx="160" cy="372" rx="76" ry="24" fill="#e0524d" fill-opacity="0.10" stroke="#e0524d" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="160" cy="372" r="5" fill="#e0524d"/>
  <g stroke="#e0524d" stroke-width="2">
    <line x1="178" y1="372" x2="226" y2="372" marker-end="url(#aR)"/>
    <line x1="142" y1="372" x2="94" y2="372" marker-end="url(#aR)"/>
    <line x1="172" y1="363" x2="208" y2="354" marker-end="url(#aR)"/>
    <line x1="172" y1="381" x2="208" y2="390" marker-end="url(#aR)"/>
    <line x1="148" y1="363" x2="112" y2="354" marker-end="url(#aR)"/>
    <line x1="148" y1="381" x2="112" y2="390" marker-end="url(#aR)"/>
  </g>
  <text x="270" y="354" font-size="14" fill="#1c2b36">下降気流が地面にぶつかり</text>
  <text x="270" y="382" font-size="14" fill="#1c2b36">外向きに広がるため</text>
</svg>
