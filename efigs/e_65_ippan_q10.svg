<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg">
<rect width="560" height="380" fill="#ffffff"/>
<defs>
<marker id="s10blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2569a8"/></marker>
<marker id="s10red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e0524d"/></marker>
</defs>

<text x="20" y="28" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1c2b36">海風（日中）の断面</text>

<text x="160" y="82" font-family="sans-serif" font-size="14" fill="#1c2b36">上空の反流（陸→海）</text>
<text x="160" y="104" font-family="sans-serif" font-size="13" fill="#f2a73b">海風の層より厚く、風速は小さい</text>

<rect x="100" y="118" width="300" height="70" fill="#2569a8" opacity="0.10"/>
<line x1="360" y1="153" x2="196" y2="153" stroke="#2569a8" stroke-width="2" marker-end="url(#s10blue)"/>

<line x1="112" y1="196" x2="112" y2="244" stroke="#2569a8" stroke-width="3" marker-end="url(#s10blue)"/>
<text x="52" y="226" font-family="sans-serif" font-size="13" fill="#2569a8">下降</text>

<line x1="375" y1="246" x2="375" y2="192" stroke="#e0524d" stroke-width="3" marker-end="url(#s10red)"/>
<text x="386" y="222" font-family="sans-serif" font-size="13" fill="#e0524d">上昇</text>

<text x="150" y="240" font-family="sans-serif" font-size="15" fill="#2569a8">海風（海→陸）</text>
<rect x="60" y="250" width="290" height="40" fill="#2569a8" opacity="0.16"/>
<line x1="80" y1="270" x2="332" y2="270" stroke="#2569a8" stroke-width="3.5" marker-end="url(#s10blue)"/>

<rect x="20" y="300" width="230" height="34" fill="#2569a8" opacity="0.18"/>
<rect x="250" y="300" width="290" height="34" fill="#5a6b78" opacity="0.28"/>
<line x1="20" y1="300" x2="540" y2="300" stroke="#1c2b36" stroke-width="2"/>
<line x1="250" y1="292" x2="250" y2="308" stroke="#1c2b36" stroke-width="2"/>

<text x="30" y="322" font-family="sans-serif" font-size="13" fill="#1c2b36">海：冷たい／地上気圧 高</text>
<text x="268" y="322" font-family="sans-serif" font-size="13" fill="#1c2b36">陸：暖まる／地上気圧 低</text>

<text x="26" y="358" font-family="sans-serif" font-size="13" fill="#5a6b78">夜は逆向きの陸風</text>
<text x="228" y="358" font-family="sans-serif" font-size="13" fill="#5a6b78">海岸線</text>
<text x="318" y="358" font-family="sans-serif" font-size="13" fill="#1c2b36">海風は内陸100 kmに達することも</text>
</svg>
