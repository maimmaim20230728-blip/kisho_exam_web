<svg viewBox="0 0 560 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="420" fill="#ffffff"/>
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2569a8"/>
    </marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2a73b"/>
    </marker>
    <marker id="aDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c2b36"/>
    </marker>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6b78"/>
    </marker>
  </defs>

  <text x="28" y="30" font-family="sans-serif" font-size="20" fill="#1c2b36">地衡風のつり合いと緯度のちがい</text>
  <text x="532" y="30" text-anchor="end" font-family="sans-serif" font-size="13" fill="#5a6b78">北半球</text>

  <text x="28" y="70" font-family="sans-serif" font-size="16" fill="#1c2b36">力のつり合い</text>

  <line x1="62" y1="135" x2="62" y2="100" stroke="#1c2b36" stroke-width="2" marker-end="url(#aDark)"/>
  <text x="62" y="153" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1c2b36">北</text>

  <line x1="90" y1="100" x2="470" y2="100" stroke="#5a6b78" stroke-width="2"/>
  <line x1="90" y1="190" x2="470" y2="190" stroke="#5a6b78" stroke-width="2"/>
  <text x="478" y="92" font-family="sans-serif" font-size="12" fill="#5a6b78">996hPa</text>
  <text x="478" y="108" font-family="sans-serif" font-size="12" fill="#5a6b78">気圧 低</text>
  <text x="478" y="182" font-family="sans-serif" font-size="12" fill="#5a6b78">1000hPa</text>
  <text x="478" y="198" font-family="sans-serif" font-size="12" fill="#5a6b78">気圧 高</text>

  <line x1="150" y1="145" x2="300" y2="145" stroke="#2569a8" stroke-width="3" marker-end="url(#aBlue)"/>
  <text x="150" y="133" font-family="sans-serif" font-size="14" fill="#2569a8">地衡風 100m/s (東向き)</text>

  <line x1="250" y1="152" x2="250" y2="182" stroke="#1c2b36" stroke-width="2.5" marker-end="url(#aDark)"/>
  <text x="260" y="175" font-family="sans-serif" font-size="13" fill="#1c2b36">コリオリ力(南向き)</text>

  <line x1="390" y1="180" x2="390" y2="110" stroke="#f2a73b" stroke-width="2.5" marker-end="url(#aOrange)"/>
  <text x="400" y="148" font-family="sans-serif" font-size="13" fill="#f2a73b">気圧傾度力(北向き)</text>

  <text x="28" y="246" font-family="sans-serif" font-size="16" fill="#1c2b36">同じ4hPa差ができる南北距離 ΔY</text>
  <text x="28" y="266" font-family="sans-serif" font-size="13" fill="#5a6b78">ΔY は f = 2Ωsinφ に反比例するので ΔY₃₀ / ΔY₄₅ = sin45°/sin30° ≒ 1.4</text>

  <text x="145" y="284" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c2b36">北緯45° (f 大)</text>
  <line x1="60" y1="313" x2="230" y2="313" stroke="#5a6b78" stroke-width="2"/>
  <line x1="60" y1="383" x2="230" y2="383" stroke="#5a6b78" stroke-width="2"/>
  <text x="236" y="317" font-family="sans-serif" font-size="11" fill="#5a6b78">996hPa</text>
  <text x="236" y="387" font-family="sans-serif" font-size="11" fill="#5a6b78">1000hPa</text>
  <line x1="76" y1="348" x2="163" y2="348" stroke="#2569a8" stroke-width="3" marker-end="url(#aBlue)"/>
  <text x="78" y="336" font-family="sans-serif" font-size="11" fill="#2569a8">V=100m/s</text>
  <line x1="200" y1="313" x2="200" y2="383" stroke="#5a6b78" stroke-width="2" marker-start="url(#aGray)" marker-end="url(#aGray)"/>
  <text x="208" y="352" font-family="sans-serif" font-size="13" fill="#1c2b36">ΔY₄₅</text>

  <text x="385" y="284" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c2b36">北緯30° (f 小)</text>
  <line x1="300" y1="299" x2="470" y2="299" stroke="#5a6b78" stroke-width="2"/>
  <line x1="300" y1="397" x2="470" y2="397" stroke="#5a6b78" stroke-width="2"/>
  <text x="476" y="303" font-family="sans-serif" font-size="11" fill="#5a6b78">996hPa</text>
  <text x="476" y="401" font-family="sans-serif" font-size="11" fill="#5a6b78">1000hPa</text>
  <line x1="316" y1="348" x2="403" y2="348" stroke="#2569a8" stroke-width="3" marker-end="url(#aBlue)"/>
  <text x="318" y="336" font-family="sans-serif" font-size="11" fill="#2569a8">V=100m/s</text>
  <line x1="440" y1="299" x2="440" y2="397" stroke="#5a6b78" stroke-width="2" marker-start="url(#aGray)" marker-end="url(#aGray)"/>
  <text x="448" y="352" font-family="sans-serif" font-size="13" fill="#1c2b36">ΔY₃₀</text>
</svg>
