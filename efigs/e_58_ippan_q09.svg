<svg viewBox="0 0 560 420" xmlns="http://www.w3.org/2000/svg">
<rect width="560" height="420" fill="#ffffff"/>
<defs>
<marker id="aB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2569a8"/></marker>
<marker id="aBL" markerUnits="userSpaceOnUse" markerWidth="17" markerHeight="17" refX="16" refY="8.5" orient="auto"><path d="M0,0 L17,8.5 L0,17 Z" fill="#2569a8"/></marker>
<marker id="aR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#e0524d"/></marker>
</defs>

<text x="20" y="35" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1c2b36">晴れた日中の海風とその循環</text>

<rect x="20" y="46" width="520" height="236" rx="4" fill="#f9fbfc" stroke="#d7dee3" stroke-width="1.2"/>
<rect x="21" y="254" width="247" height="27" fill="#cfe3f0"/>
<rect x="268" y="254" width="271" height="27" fill="#e7ded1"/>
<line x1="268" y1="254" x2="268" y2="281" stroke="#5a6b78" stroke-width="1.5"/>
<line x1="21" y1="254" x2="539" y2="254" stroke="#1c2b36" stroke-width="2"/>
<text x="144" y="272" font-family="sans-serif" font-size="12.5" fill="#1c2b36" text-anchor="middle">海(暖まりにくい)</text>
<text x="404" y="272" font-family="sans-serif" font-size="12.5" fill="#1c2b36" text-anchor="middle">陸(日中は暖まりやすい)</text>

<!-- 循環 -->
<line x1="110" y1="104" x2="110" y2="220" stroke="#2569a8" stroke-width="3" marker-end="url(#aB)"/>
<line x1="122" y1="236" x2="416" y2="236" stroke="#2569a8" stroke-width="5" marker-end="url(#aBL)"/>
<line x1="428" y1="222" x2="428" y2="106" stroke="#e0524d" stroke-width="3" marker-end="url(#aR)"/>
<line x1="416" y1="92" x2="122" y2="92" stroke="#2569a8" stroke-width="2.5" marker-end="url(#aB)"/>

<text x="100" y="168" font-family="sans-serif" font-size="12.5" fill="#2569a8" text-anchor="end">下降流</text>
<text x="440" y="168" font-family="sans-serif" font-size="12.5" fill="#e0524d">上昇流</text>
<text x="269" y="224" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2569a8" text-anchor="middle">海風(強く・厚い)</text>
<text x="269" y="80" font-family="sans-serif" font-size="12.5" fill="#2569a8" text-anchor="middle">反流(上空・陸から海へ)</text>

<!-- 気圧 -->
<text x="60" y="126" font-family="sans-serif" font-size="11" fill="#5a6b78" text-anchor="middle">上空</text>
<text x="60" y="144" font-family="sans-serif" font-size="12" fill="#1c2b36" text-anchor="middle">気圧 低</text>
<text x="60" y="196" font-family="sans-serif" font-size="11" fill="#5a6b78" text-anchor="middle">地表付近</text>
<text x="60" y="214" font-family="sans-serif" font-size="12" fill="#1c2b36" text-anchor="middle">気圧 高</text>
<text x="496" y="126" font-family="sans-serif" font-size="11" fill="#5a6b78" text-anchor="middle">上空</text>
<text x="496" y="144" font-family="sans-serif" font-size="12" fill="#1c2b36" text-anchor="middle">気圧 高</text>
<text x="496" y="196" font-family="sans-serif" font-size="11" fill="#5a6b78" text-anchor="middle">地表付近</text>
<text x="496" y="214" font-family="sans-serif" font-size="12" fill="#1c2b36" text-anchor="middle">気圧 低</text>

<!-- 下部の比較 -->
<text x="20" y="310" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#2569a8">海風(日中)</text>
<text x="20" y="332" font-family="sans-serif" font-size="12.5" fill="#1c2b36">・海陸の温度差が大きく強い</text>
<text x="20" y="352" font-family="sans-serif" font-size="12.5" fill="#1c2b36">・厚さは数百m〜1km程度</text>
<text x="20" y="372" font-family="sans-serif" font-size="12.5" fill="#1c2b36">・上空に逆向きの反流を伴う</text>

<text x="292" y="310" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#5a6b78">陸風(夜間)</text>
<text x="292" y="332" font-family="sans-serif" font-size="12.5" fill="#1c2b36">・海風より弱い</text>
<text x="292" y="352" font-family="sans-serif" font-size="12.5" fill="#1c2b36">・厚さは数百m以下と薄い</text>
<text x="292" y="372" font-family="sans-serif" font-size="12.5" fill="#1c2b36">・夜の温度差は日中より小さい</text>

<line x1="20" y1="384" x2="540" y2="384" stroke="#eef2f5" stroke-width="1"/>
<text x="20" y="400" font-family="sans-serif" font-size="12" fill="#5a6b78">※陸面が湿っていると日射が蒸発(潜熱)に使われ、海風は弱くなります</text>
</svg>
