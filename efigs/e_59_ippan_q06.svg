<svg viewBox="0 0 560 410" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<rect width="560" height="410" fill="#ffffff"/>
<defs>
<marker id="q6b" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2569a8"/></marker>
<marker id="q6o" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#f2a73b"/></marker>
<marker id="q6n" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1c2b36"/></marker>
<marker id="q6g" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#5a6b78"/></marker>
</defs>

<text x="28" y="32" font-size="17" font-weight="bold" fill="#1c2b36">地上風の三つの力のつりあいとコリオリ力の向き</text>
<rect x="452" y="16" width="88" height="26" rx="13" fill="#eef3f7" stroke="#5a6b78" stroke-width="1"/>
<text x="496" y="34" font-size="14" fill="#1c2b36" text-anchor="middle">北半球</text>

<line x1="280" y1="56" x2="280" y2="340" stroke="#dde4e9" stroke-width="1"/>
<text x="60" y="68" font-size="13" fill="#5a6b78">等圧線と地上風(上が北)</text>
<text x="300" y="68" font-size="13" fill="#5a6b78">空気塊にはたらく力のつりあい</text>

<!-- 左: 等圧線 -->
<line x1="60" y1="92" x2="262" y2="92" stroke="#5a6b78" stroke-width="1.6"/>
<line x1="60" y1="122" x2="262" y2="122" stroke="#5a6b78" stroke-width="1.6"/>
<line x1="60" y1="156" x2="262" y2="156" stroke="#5a6b78" stroke-width="1.6"/>
<line x1="60" y1="194" x2="262" y2="194" stroke="#5a6b78" stroke-width="1.6"/>
<line x1="60" y1="236" x2="262" y2="236" stroke="#5a6b78" stroke-width="1.6"/>
<line x1="60" y1="282" x2="262" y2="282" stroke="#5a6b78" stroke-width="1.6"/>
<line x1="60" y1="332" x2="262" y2="332" stroke="#5a6b78" stroke-width="1.6"/>
<text x="160" y="113" font-size="12" fill="#1c2b36" text-anchor="middle">北ほど間隔が狭い</text>
<text x="232" y="144" font-size="12" fill="#e0524d" text-anchor="end">高圧側</text>
<text x="232" y="312" font-size="12" fill="#2569a8" text-anchor="end">低圧側</text>

<!-- 左: 地上風 -->
<line x1="172" y1="178" x2="102" y2="237" stroke="#2569a8" stroke-width="3" marker-end="url(#q6b)"/>
<text x="66" y="264" font-size="12" fill="#2569a8">地上風(等圧線を斜めに横切る)</text>

<!-- 右: 力のつりあい -->
<circle cx="420" cy="225" r="6" fill="#1c2b36"/>

<line x1="420" y1="225" x2="420" y2="310" stroke="#1c2b36" stroke-width="3" marker-end="url(#q6n)"/>
<text x="420" y="332" font-size="13" fill="#1c2b36" text-anchor="middle">気圧傾度力(高圧→低圧)</text>

<line x1="420" y1="225" x2="378" y2="175" stroke="#f2a73b" stroke-width="3.5" marker-end="url(#q6o)"/>
<text x="368" y="142" font-size="12" fill="#1c2b36" text-anchor="end">北西向き</text>
<text x="368" y="160" font-size="13" font-weight="bold" fill="#f2a73b" text-anchor="end">コリオリ力</text>

<line x1="420" y1="225" x2="462" y2="190" stroke="#5a6b78" stroke-width="3" stroke-dasharray="7 4" marker-end="url(#q6g)"/>
<text x="470" y="186" font-size="13" fill="#5a6b78">摩擦力</text>
<text x="470" y="204" font-size="12" fill="#5a6b78">風と逆向き</text>

<line x1="420" y1="225" x2="347" y2="286" stroke="#2569a8" stroke-width="3.5" marker-end="url(#q6b)"/>
<text x="338" y="300" font-size="13" fill="#2569a8" text-anchor="end">地上風</text>

<path d="M409,234 L400,223 L411,214" fill="none" stroke="#5a6b78" stroke-width="1.2"/>

<!-- 下部の要点 -->
<line x1="24" y1="346" x2="536" y2="346" stroke="#dde4e9" stroke-width="1"/>
<text x="24" y="366" font-size="14" fill="#1c2b36">コリオリ力は、北半球では風向に対して直角右向きにはたらく。</text>
<text x="24" y="386" font-size="14" fill="#1c2b36">地上では摩擦力が加わるため、風は等圧線を低圧側へ斜めに横切る。</text>
</svg>
