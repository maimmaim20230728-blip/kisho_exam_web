<svg viewBox="0 0 560 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="420" fill="#ffffff"/>
  <defs>
    <marker id="q9ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#2569a8"/>
    </marker>
  </defs>

  <text x="16" y="34" font-family="sans-serif" font-size="19" fill="#1c2b36">ジェット気流の高さと流れ方（北半球）</text>

  <!-- 上段左：加速と等高度線 -->
  <text x="16" y="58" font-family="sans-serif" font-size="16" fill="#1c2b36">加速する流れは等高度線を横切る</text>
  <line x1="44" y1="120" x2="290" y2="120" stroke="#5a6b78" stroke-width="2"/>
  <line x1="44" y1="170" x2="290" y2="170" stroke="#5a6b78" stroke-width="2"/>
  <line x1="44" y1="220" x2="290" y2="220" stroke="#5a6b78" stroke-width="2"/>
  <text x="16" y="125" font-family="sans-serif" font-size="14" fill="#5a6b78">低</text>
  <text x="16" y="225" font-family="sans-serif" font-size="14" fill="#5a6b78">高</text>
  <text x="152" y="108" font-family="sans-serif" font-size="14" fill="#5a6b78">等高度線（北ほど低い）</text>
  <path d="M50,240 C130,228 200,182 278,134" fill="none" stroke="#2569a8" stroke-width="3" marker-end="url(#q9ab)"/>
  <text x="52" y="150" font-family="sans-serif" font-size="14" fill="#2569a8">加速する流れ</text>
  <text x="16" y="262" font-family="sans-serif" font-size="14" fill="#1c2b36">高い側から低い側へ横切る</text>

  <!-- 上段右：切離低気圧 -->
  <text x="320" y="58" font-family="sans-serif" font-size="16" fill="#1c2b36">蛇行が大きいと切り離される</text>
  <path d="M324,96 C356,92 372,150 404,150 C436,150 452,100 480,92 C506,86 524,94 544,92" fill="none" stroke="#2569a8" stroke-width="3"/>
  <text x="326" y="82" font-family="sans-serif" font-size="14" fill="#5a6b78">偏西風の本流</text>
  <line x1="408" y1="152" x2="416" y2="174" stroke="#2569a8" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="418" cy="202" r="26" fill="none" stroke="#2569a8" stroke-width="3"/>
  <path d="M418,176 A26,26 0 0 0 392,202" fill="none" stroke="#2569a8" stroke-width="2" marker-end="url(#q9ab)"/>
  <path d="M418,228 A26,26 0 0 0 444,202" fill="none" stroke="#2569a8" stroke-width="2" marker-end="url(#q9ab)"/>
  <text x="326" y="252" font-family="sans-serif" font-size="14" fill="#1c2b36">切離低気圧（上層の寒冷低気圧）</text>
  <text x="316" y="174" font-family="sans-serif" font-size="14" fill="#5a6b78">南へ垂れた谷</text>

  <!-- 下段：2つのジェットの高度 -->
  <text x="16" y="284" font-family="sans-serif" font-size="16" fill="#1c2b36">2つのジェットの高度（緯度断面）</text>
  <line x1="72" y1="296" x2="72" y2="405" stroke="#1c2b36" stroke-width="2"/>
  <line x1="72" y1="405" x2="510" y2="405" stroke="#1c2b36" stroke-width="2"/>
  <line x1="72" y1="313" x2="342" y2="313" stroke="#5a6b78" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="72" y1="336" x2="146" y2="336" stroke="#5a6b78" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="66" y="318" font-family="sans-serif" text-anchor="end" font-size="14" fill="#5a6b78">12km</text>
  <text x="66" y="341" font-family="sans-serif" text-anchor="end" font-size="14" fill="#5a6b78">9km</text>
  <ellipse cx="180" cy="336" rx="30" ry="11" fill="#2569a8"/>
  <ellipse cx="372" cy="313" rx="30" ry="11" fill="#f2a73b"/>
  <text x="118" y="362" font-family="sans-serif" font-size="14" fill="#2569a8">寒帯前線ジェット</text>
  <text x="118" y="380" font-family="sans-serif" font-size="14" fill="#5a6b78">300hPa付近・冬に最強</text>
  <text x="330" y="290" font-family="sans-serif" font-size="14" fill="#f2a73b">亜熱帯ジェット</text>
  <text x="330" y="362" font-family="sans-serif" font-size="14" fill="#5a6b78">200hPa付近</text>
  <text x="84" y="400" font-family="sans-serif" font-size="14" fill="#5a6b78">高緯度</text>
  <text x="440" y="400" font-family="sans-serif" font-size="14" fill="#5a6b78">低緯度</text>
</svg>
