<svg viewBox="0 0 560 340" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="560" height="340" fill="#ffffff"/>
  <defs>
    <marker id="q13arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2569a8"/>
    </marker>
  </defs>

  <text x="24" y="32" font-size="19" font-weight="bold" fill="#1c2b36">表層なだれと全層なだれ</text>

  <!-- 左：表層なだれ -->
  <text x="24" y="60" font-size="16" font-weight="bold" fill="#2569a8">表層なだれ</text>
  <polygon points="44,240 232,122 222.4,106.8 34.4,224.8" fill="#d5dee5" stroke="#5a6b78" stroke-width="1.5"/>
  <polygon points="34.4,224.8 222.4,106.8 213.9,93.2 25.9,211.2" fill="#ffffff" stroke="#2569a8" stroke-width="2"/>
  <line x1="44" y1="240" x2="232" y2="122" stroke="#1c2b36" stroke-width="2.5"/>
  <line x1="171" y1="130" x2="96" y2="177" stroke="#2569a8" stroke-width="3" marker-end="url(#q13arB)"/>
  <text x="52" y="88" font-size="13" fill="#2569a8">上の新しい雪だけが滑る</text>
  <line x1="106" y1="192" x2="140" y2="242" stroke="#5a6b78" stroke-width="1.2"/>
  <text x="144" y="248" font-size="12" fill="#5a6b78">灰色＝古い雪</text>
  <text x="212" y="166" font-size="13" fill="#5a6b78">地面</text>

  <!-- 右：全層なだれ -->
  <text x="290" y="60" font-size="16" font-weight="bold" fill="#e0524d">全層なだれ</text>
  <polygon points="310,240 498,122 488.4,106.8 300.4,224.8" fill="#d5dee5" stroke="#5a6b78" stroke-width="1.5"/>
  <polygon points="300.4,224.8 488.4,106.8 479.9,93.2 291.9,211.2" fill="#ffffff" stroke="#2569a8" stroke-width="2"/>
  <line x1="310" y1="240" x2="498" y2="122" stroke="#1c2b36" stroke-width="2.5"/>
  <line x1="437" y1="130" x2="362" y2="177" stroke="#2569a8" stroke-width="3" marker-end="url(#q13arB)"/>
  <line x1="420" y1="157" x2="345" y2="204" stroke="#2569a8" stroke-width="3" marker-end="url(#q13arB)"/>
  <circle cx="392" cy="184" r="3.5" fill="#e0524d"/>
  <circle cx="416" cy="169" r="3.5" fill="#e0524d"/>
  <circle cx="440" cy="154" r="3.5" fill="#e0524d"/>
  <text x="318" y="88" font-size="13" fill="#2569a8">積もった雪が根こそぎ滑る</text>
  <text x="372" y="232" font-size="12" fill="#e0524d">赤い点＝融雪水（底がゆるむ）</text>
  <text x="478" y="166" font-size="13" fill="#5a6b78">地面</text>

  <!-- 説明 -->
  <text x="24" y="288" font-size="14" fill="#1c2b36">古い雪の上の新雪の層だけが滑る</text>
  <text x="24" y="312" font-size="14" font-weight="bold" fill="#1c2b36">1〜2月の厳冬期に多い</text>
  <text x="290" y="288" font-size="14" fill="#1c2b36">積雪全体が地面の上を滑る</text>
  <text x="290" y="312" font-size="14" font-weight="bold" fill="#1c2b36">春先（気温上昇・降雨）に多い</text>
</svg>
