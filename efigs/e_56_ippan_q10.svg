<svg viewBox="0 0 560 390" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="390" fill="#ffffff"/>
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2569a8"/>
    </marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2a73b"/>
    </marker>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6b78"/>
    </marker>
  </defs>

  <text x="28" y="30" font-family="sans-serif" font-size="20" fill="#1c2b36">オゾンは低緯度でつくられ高緯度にたまる</text>

  <line x1="50" y1="70" x2="50" y2="300" stroke="#5a6b78" stroke-width="1.5"/>
  <line x1="50" y1="300" x2="530" y2="300" stroke="#1c2b36" stroke-width="2.5"/>
  <text x="56" y="95" font-family="sans-serif" font-size="11" fill="#5a6b78">約50km</text>
  <text x="56" y="219" font-family="sans-serif" font-size="11" fill="#5a6b78">約20km</text>

  <polyline points="52,256 150,251 230,238 290,228 350,238 430,251 528,256" fill="none" stroke="#5a6b78" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="70" y="276" font-family="sans-serif" font-size="12" fill="#5a6b78">対流圏界面</text>

  <text x="60" y="320" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5a6b78">南極</text>
  <text x="290" y="320" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5a6b78">赤道</text>
  <text x="520" y="320" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5a6b78">北極</text>

  <text x="290" y="66" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#f2a73b">強い紫外線</text>
  <line x1="262" y1="76" x2="262" y2="104" stroke="#f2a73b" stroke-width="2" marker-end="url(#aOrange)"/>
  <line x1="290" y1="76" x2="290" y2="104" stroke="#f2a73b" stroke-width="2" marker-end="url(#aOrange)"/>
  <line x1="318" y1="76" x2="318" y2="104" stroke="#f2a73b" stroke-width="2" marker-end="url(#aOrange)"/>

  <text x="290" y="124" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c2b36">オゾン生成</text>
  <text x="290" y="142" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5a6b78">(低緯度の上部成層圏)</text>

  <line x1="290" y1="240" x2="290" y2="182" stroke="#2569a8" stroke-width="3" marker-end="url(#aBlue)"/>

  <text x="373" y="160" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#2569a8">極向きの流れ(冬に強い)</text>
  <line x1="302" y1="170" x2="445" y2="170" stroke="#2569a8" stroke-width="4" marker-end="url(#aBlue)"/>
  <line x1="278" y1="170" x2="185" y2="170" stroke="#5a6b78" stroke-width="2" marker-end="url(#aGray)"/>
  <text x="226" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5a6b78">(夏半球は弱い)</text>

  <line x1="470" y1="176" x2="470" y2="198" stroke="#2569a8" stroke-width="4" marker-end="url(#aBlue)"/>
  <line x1="168" y1="176" x2="168" y2="194" stroke="#5a6b78" stroke-width="2" marker-end="url(#aGray)"/>

  <ellipse cx="452" cy="218" rx="46" ry="14" fill="#2569a8" fill-opacity="0.22"/>
  <text x="452" y="223" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1c2b36">たまる</text>
  <ellipse cx="168" cy="212" rx="28" ry="12" fill="#2569a8" fill-opacity="0.12"/>

  <text x="28" y="346" font-family="sans-serif" font-size="13" fill="#5a6b78">生成は低緯度の上部成層圏。大きな流れが中高緯度へ運び、下降してたまる。</text>
  <text x="28" y="366" font-family="sans-serif" font-size="13" fill="#5a6b78">この流れは冬に強く、北半球中高緯度のオゾン全量は冬から春に最も多い。</text>
</svg>
