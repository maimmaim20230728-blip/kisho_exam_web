<svg viewBox="0 0 560 410" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="410" fill="#ffffff"/>
  <defs>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2569a8"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6b78"/>
    </marker>
  </defs>
  <g font-family="sans-serif">
    <text x="24" y="30" font-size="18" fill="#1c2b36">大気大循環の子午面断面</text>
    <text x="538" y="30" font-size="18" fill="#5a6b78" text-anchor="end">北半球</text>

    <text x="70" y="72" font-size="14" fill="#e0524d">暖かい(低緯度)</text>
    <line x1="190" y1="67" x2="400" y2="67" stroke="#5a6b78" stroke-width="2" marker-end="url(#arG)"/>
    <text x="500" y="72" font-size="14" fill="#2569a8" text-anchor="end">寒い(高緯度)</text>

    <!-- 緯度の目安 -->
    <line x1="70" y1="92" x2="70" y2="292" stroke="#5a6b78" stroke-width="1" stroke-dasharray="4 5"/>
    <line x1="213" y1="92" x2="213" y2="292" stroke="#5a6b78" stroke-width="1" stroke-dasharray="4 5"/>
    <line x1="357" y1="92" x2="357" y2="292" stroke="#5a6b78" stroke-width="1" stroke-dasharray="4 5"/>
    <line x1="500" y1="92" x2="500" y2="292" stroke="#5a6b78" stroke-width="1" stroke-dasharray="4 5"/>

    <!-- 対流圏界面 -->
    <path d="M70,95 L213,128 L357,158 L500,172" fill="none" stroke="#2569a8" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="386" y="142" font-size="14" fill="#2569a8">対流圏界面</text>

    <!-- 地表 -->
    <line x1="62" y1="290" x2="510" y2="290" stroke="#1c2b36" stroke-width="3"/>

    <!-- ハドレー循環(直接循環・時計回り) -->
    <ellipse cx="141" cy="205" rx="62" ry="85" fill="none" stroke="#2569a8" stroke-width="2"/>
    <line x1="79" y1="222" x2="79" y2="188" stroke="#2569a8" stroke-width="3" marker-end="url(#arB)"/>
    <line x1="121" y1="128" x2="161" y2="128" stroke="#2569a8" stroke-width="3" marker-end="url(#arB)"/>
    <line x1="203" y1="188" x2="203" y2="222" stroke="#2569a8" stroke-width="3" marker-end="url(#arB)"/>
    <line x1="161" y1="282" x2="121" y2="282" stroke="#2569a8" stroke-width="3" marker-end="url(#arB)"/>
    <text x="141" y="198" font-size="14" fill="#1c2b36" text-anchor="middle">ハドレー循環</text>
    <text x="141" y="222" font-size="14" fill="#5a6b78" text-anchor="middle">直接循環</text>

    <!-- フェレル循環(間接循環・反時計回り) -->
    <ellipse cx="285" cy="222" rx="60" ry="68" fill="none" stroke="#2569a8" stroke-width="2"/>
    <line x1="225" y1="205" x2="225" y2="239" stroke="#2569a8" stroke-width="3" marker-end="url(#arB)"/>
    <line x1="265" y1="282" x2="305" y2="282" stroke="#2569a8" stroke-width="3" marker-end="url(#arB)"/>
    <line x1="345" y1="239" x2="345" y2="205" stroke="#2569a8" stroke-width="3" marker-end="url(#arB)"/>
    <line x1="305" y1="162" x2="265" y2="162" stroke="#2569a8" stroke-width="3" marker-end="url(#arB)"/>
    <text x="285" y="216" font-size="14" fill="#1c2b36" text-anchor="middle">フェレル循環</text>
    <rect x="243" y="224" width="84" height="20" rx="4" fill="#fdf0da"/>
    <text x="285" y="239" font-size="14" fill="#1c2b36" text-anchor="middle">間接循環</text>

    <!-- 極循環(直接循環・時計回り) -->
    <ellipse cx="428" cy="240" rx="58" ry="50" fill="none" stroke="#2569a8" stroke-width="2"/>
    <line x1="370" y1="257" x2="370" y2="223" stroke="#2569a8" stroke-width="3" marker-end="url(#arB)"/>
    <line x1="408" y1="198" x2="448" y2="198" stroke="#2569a8" stroke-width="3" marker-end="url(#arB)"/>
    <line x1="486" y1="223" x2="486" y2="257" stroke="#2569a8" stroke-width="3" marker-end="url(#arB)"/>
    <line x1="448" y1="282" x2="408" y2="282" stroke="#2569a8" stroke-width="3" marker-end="url(#arB)"/>
    <text x="428" y="234" font-size="14" fill="#1c2b36" text-anchor="middle">極循環</text>
    <text x="428" y="258" font-size="14" fill="#5a6b78" text-anchor="middle">直接循環</text>

    <!-- 緯度ラベル -->
    <text x="70" y="310" font-size="14" fill="#1c2b36" text-anchor="middle">赤道(0°)</text>
    <text x="213" y="310" font-size="14" fill="#1c2b36" text-anchor="middle">緯度30°</text>
    <text x="357" y="310" font-size="14" fill="#1c2b36" text-anchor="middle">緯度60°</text>
    <text x="500" y="310" font-size="14" fill="#1c2b36" text-anchor="middle">極(90°)</text>

    <rect x="16" y="320" width="528" height="74" rx="6" fill="#f7f9fa"/>
    <text x="24" y="342" font-size="14" fill="#1c2b36">ハドレー循環の下降域は緯度20〜30°。降水が少なく亜熱帯の砂漠になる。</text>
    <text x="24" y="364" font-size="14" fill="#1c2b36">フェレル循環は高温側で下降し低温側で上昇する間接循環。</text>
    <text x="24" y="386" font-size="14" fill="#1c2b36">動かしているのは水平スケール数千kmの傾圧不安定波。</text>
  </g>
</svg>
