<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="560" height="360" fill="#ffffff"/>
  <defs>
    <marker id="q11d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c2b36"/>
    </marker>
    <marker id="q11b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2569a8"/>
    </marker>
    <marker id="q11g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6b78"/>
    </marker>
  </defs>

  <text x="24" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1c2b36">高潮が最大になるのは最接近時ではない</text>
  <text x="544" y="30" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="end">北半球</text>

  <!-- 図A: 最接近時 -->
  <text x="24" y="58" font-family="sans-serif" font-size="14" fill="#1c2b36">①台風の最接近時</text>
  <rect x="24" y="64" width="258" height="198" fill="#eef5fb" stroke="#cfdce8" stroke-width="1"/>
  <path d="M186,64 L282,64 L282,262 L186,262 L186,178 L244,178 L244,150 L186,150 Z" fill="#e8e4dc" stroke="#c2bcb0" stroke-width="1"/>
  <text x="215" y="171" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="middle">湾</text>

  <circle cx="136" cy="162" r="32" fill="none" stroke="#1c2b36" stroke-width="1.5" stroke-dasharray="5,5"/>
  <path d="M168,162 A32,32 0 0 0 136,130" fill="none" stroke="#1c2b36" stroke-width="2" marker-end="url(#q11d)"/>
  <path d="M104,162 A32,32 0 0 0 136,194" fill="none" stroke="#1c2b36" stroke-width="2" marker-end="url(#q11d)"/>
  <circle cx="136" cy="162" r="3.5" fill="#1c2b36"/>
  <text x="100" y="167" font-family="sans-serif" font-size="13" fill="#1c2b36" text-anchor="end">台風</text>

  <line x1="136" y1="252" x2="136" y2="202" stroke="#5a6b78" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#q11g)"/>
  <text x="126" y="232" font-family="sans-serif" font-size="11" fill="#5a6b78" text-anchor="end">北へ進む</text>

  <line x1="176" y1="224" x2="176" y2="112" stroke="#2569a8" stroke-width="3.5" marker-end="url(#q11b)"/>
  <text x="162" y="118" font-family="sans-serif" font-size="12" fill="#2569a8" text-anchor="end">南よりの風</text>

  <!-- 図B: 通過後 -->
  <text x="292" y="58" font-family="sans-serif" font-size="14" fill="#1c2b36">②台風が北へ抜けた後</text>
  <rect x="292" y="64" width="252" height="198" fill="#eef5fb" stroke="#cfdce8" stroke-width="1"/>
  <path d="M454,64 L544,64 L544,262 L454,262 L454,178 L512,178 L512,150 L454,150 Z" fill="#e8e4dc" stroke="#c2bcb0" stroke-width="1"/>
  <polygon points="490,178 512,178 512,150" fill="#f2a73b"/>
  <text x="500" y="144" font-family="sans-serif" font-size="12" fill="#8f5a00" text-anchor="middle">湾奥</text>

  <circle cx="404" cy="102" r="30" fill="none" stroke="#1c2b36" stroke-width="1.5" stroke-dasharray="5,5"/>
  <path d="M434,102 A30,30 0 0 0 404,72" fill="none" stroke="#1c2b36" stroke-width="2" marker-end="url(#q11d)"/>
  <path d="M374,102 A30,30 0 0 0 404,132" fill="none" stroke="#1c2b36" stroke-width="2" marker-end="url(#q11d)"/>
  <circle cx="404" cy="102" r="3.5" fill="#1c2b36"/>
  <text x="370" y="107" font-family="sans-serif" font-size="13" fill="#1c2b36" text-anchor="end">台風</text>

  <line x1="404" y1="200" x2="404" y2="148" stroke="#5a6b78" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#q11g)"/>
  <text x="396" y="180" font-family="sans-serif" font-size="11" fill="#5a6b78" text-anchor="end">北上</text>

  <line x1="414" y1="164" x2="498" y2="164" stroke="#2569a8" stroke-width="3.5" marker-end="url(#q11b)"/>
  <text x="392" y="152" font-family="sans-serif" font-size="12" fill="#2569a8" text-anchor="end">西よりの風</text>

  <text x="24" y="284" font-family="sans-serif" font-size="12" fill="#1c2b36">湾は台風の東側 → 南よりの風</text>
  <text x="24" y="302" font-family="sans-serif" font-size="12" fill="#5a6b78">風が湾を横切るため吹き寄せは弱い</text>
  <text x="292" y="284" font-family="sans-serif" font-size="12" fill="#1c2b36">湾は台風の南側 → 西よりの風</text>
  <text x="292" y="302" font-family="sans-serif" font-size="12" fill="#5a6b78">湾口から奥へ吹き込み潮位偏差が最大</text>

  <text x="24" y="332" font-family="sans-serif" font-size="13" fill="#1c2b36">北半球の台風は反時計回り。吹き込む風になるのは最接近の後</text>
</svg>
