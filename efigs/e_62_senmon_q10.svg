<svg viewBox="0 0 560 420" xmlns="http://www.w3.org/2000/svg">
<rect width="560" height="420" fill="#ffffff"/>
<defs>
<marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2569a8"/></marker>
<marker id="aO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f2a73b"/></marker>
</defs>

<text x="24" y="32" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1c2b36">冬の寒気吹き出しと筋状雲</text>
<text x="24" y="54" font-family="sans-serif" font-size="14" fill="#5a6b78">大陸から日本海へ吹き出す寒気の断面</text>

<rect x="28" y="68" width="504" height="262" fill="#f7fafb"/>
<path d="M 28 268 L 150 262 L 532 168 L 532 330 L 28 330 Z" fill="#2569a8" fill-opacity="0.16"/>

<line x1="150" y1="92" x2="532" y2="92" stroke="#5a6b78" stroke-width="1.5" stroke-dasharray="7,5"/>
<text x="532" y="80" font-family="sans-serif" font-size="14" fill="#5a6b78" text-anchor="end">対流圏界面(雲はここまで届かない)</text>

<text x="36" y="116" font-family="sans-serif" font-size="14" fill="#1c2b36">上層まで寒気ではない</text>
<text x="36" y="138" font-family="sans-serif" font-size="14" fill="#1c2b36">=背の低い高気圧</text>
<line x1="95" y1="150" x2="95" y2="265" stroke="#5a6b78" stroke-width="1" stroke-dasharray="4,4"/>

<polyline points="28,268 150,262 532,168" fill="none" stroke="#2569a8" stroke-width="2" stroke-dasharray="6,4"/>
<text x="300" y="140" font-family="sans-serif" font-size="14" fill="#2569a8" text-anchor="middle">逆転層(寒気の上端)</text>
<line x1="300" y1="148" x2="300" y2="225" stroke="#5a6b78" stroke-width="1" stroke-dasharray="4,4"/>

<circle cx="225" cy="256" r="8" fill="#ffffff" stroke="#5a6b78" stroke-width="1.5"/>
<circle cx="285" cy="249" r="15" fill="#ffffff" stroke="#5a6b78" stroke-width="1.5"/>
<circle cx="325" cy="252" r="13" fill="#ffffff" stroke="#5a6b78" stroke-width="1.5"/>
<circle cx="345" cy="242" r="22" fill="#ffffff" stroke="#5a6b78" stroke-width="1.5"/>
<circle cx="380" cy="248" r="17" fill="#ffffff" stroke="#5a6b78" stroke-width="1.5"/>
<circle cx="405" cy="234" r="29" fill="#ffffff" stroke="#5a6b78" stroke-width="1.5"/>
<circle cx="435" cy="246" r="20" fill="#ffffff" stroke="#5a6b78" stroke-width="1.5"/>
<circle cx="445" cy="228" r="32" fill="#ffffff" stroke="#5a6b78" stroke-width="1.5"/>

<line x1="60" y1="302" x2="160" y2="302" stroke="#2569a8" stroke-width="4" marker-end="url(#aB)"/>
<text x="72" y="288" font-family="sans-serif" font-size="14" fill="#2569a8">寒気の吹き出し</text>

<line x1="185" y1="326" x2="185" y2="300" stroke="#f2a73b" stroke-width="2" marker-end="url(#aO)"/>
<line x1="215" y1="326" x2="215" y2="300" stroke="#f2a73b" stroke-width="2" marker-end="url(#aO)"/>
<line x1="245" y1="326" x2="245" y2="300" stroke="#f2a73b" stroke-width="2" marker-end="url(#aO)"/>

<text x="300" y="292" font-family="sans-serif" font-size="14" fill="#1c2b36">筋状の対流雲</text>
<text x="300" y="316" font-family="sans-serif" font-size="14" fill="#f2a73b">海から熱と水蒸気をもらう</text>

<rect x="28" y="330" width="122" height="12" fill="#dfe6ea"/>
<rect x="150" y="330" width="310" height="12" fill="#cfe0ee"/>
<rect x="460" y="330" width="72" height="12" fill="#dfe6ea"/>
<line x1="28" y1="330" x2="532" y2="330" stroke="#1c2b36" stroke-width="2"/>

<text x="88" y="358" font-family="sans-serif" font-size="14" fill="#1c2b36" text-anchor="middle">大陸</text>
<text x="300" y="358" font-family="sans-serif" font-size="14" fill="#1c2b36" text-anchor="middle">日本海</text>
<text x="496" y="358" font-family="sans-serif" font-size="14" fill="#1c2b36" text-anchor="middle">日本</text>

<line x1="150" y1="342" x2="150" y2="372" stroke="#5a6b78" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="217" y1="344" x2="217" y2="372" stroke="#5a6b78" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="150" y1="378" x2="217" y2="378" stroke="#f2a73b" stroke-width="2"/>
<line x1="150" y1="372" x2="150" y2="384" stroke="#f2a73b" stroke-width="2"/>
<line x1="217" y1="372" x2="217" y2="384" stroke="#f2a73b" stroke-width="2"/>
<text x="183" y="398" font-family="sans-serif" font-size="14" fill="#f2a73b" text-anchor="middle">離岸距離</text>
<text x="250" y="398" font-family="sans-serif" font-size="14" fill="#1c2b36">下層の気温が低いほど短い</text>
</svg>
