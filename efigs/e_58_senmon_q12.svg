<svg viewBox="0 0 560 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="560" height="420" fill="#ffffff"/>
  <defs>
    <marker id="aB" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2569a8"/>
    </marker>
    <marker id="aO" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#f2a73b"/>
    </marker>
  </defs>

  <text x="20" y="34" font-size="19" fill="#1c2b36">最盛期の台風の断面</text>

  <!-- 風速の分布 -->
  <text x="44" y="72" font-size="13" fill="#5a6b78">風速の分布</text>
  <path d="M 40,128 C 110,124 160,116 200,96 C 225,84 238,80 250,80 C 262,80 270,112 280,136 C 290,112 298,80 310,80 C 322,80 335,84 360,96 C 400,116 450,124 520,128" fill="none" stroke="#2569a8" stroke-width="2.5"/>
  <line x1="40" y1="140" x2="520" y2="140" stroke="#5a6b78" stroke-width="1.5"/>
  <text x="26" y="144" font-size="11" fill="#5a6b78">0</text>
  <circle cx="250" cy="80" r="4" fill="#f2a73b"/>
  <circle cx="310" cy="80" r="4" fill="#f2a73b"/>
  <line x1="332" y1="70" x2="316" y2="76" stroke="#f2a73b" stroke-width="1"/>
  <text x="334" y="72" font-size="13" fill="#f2a73b">最大風速</text>
  <line x1="250" y1="86" x2="250" y2="168" stroke="#f2a73b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="310" y1="86" x2="310" y2="168" stroke="#f2a73b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- 断面 -->
  <text x="446" y="156" font-size="12" fill="#5a6b78">対流圏界面</text>
  <line x1="40" y1="162" x2="520" y2="162" stroke="#5a6b78" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="252" y="166" width="56" height="160" fill="#fbeae7"/>
  <g fill="#e9eef2">
    <rect x="70" y="226" width="120" height="60" rx="12"/>
    <circle cx="90" cy="236" r="22"/>
    <circle cx="140" cy="230" r="26"/>
    <rect x="376" y="226" width="124" height="60" rx="12"/>
    <circle cx="410" cy="230" r="26"/>
    <circle cx="462" cy="236" r="22"/>
  </g>
  <g fill="#d7e0e6">
    <rect x="206" y="168" width="46" height="158" rx="10"/>
    <circle cx="216" cy="182" r="18"/>
    <circle cx="240" cy="175" r="16"/>
    <rect x="308" y="168" width="46" height="158" rx="10"/>
    <circle cx="320" cy="175" r="16"/>
    <circle cx="344" cy="182" r="18"/>
  </g>
  <line x1="228" y1="318" x2="228" y2="182" stroke="#2569a8" stroke-width="3" marker-end="url(#aB)"/>
  <line x1="332" y1="318" x2="332" y2="182" stroke="#2569a8" stroke-width="3" marker-end="url(#aB)"/>
  <line x1="280" y1="196" x2="280" y2="300" stroke="#f2a73b" stroke-width="2.5" marker-end="url(#aO)"/>
  <text x="273" y="190" font-size="14" fill="#1c2b36">眼</text>
  <text x="259" y="318" font-size="13" fill="#e0524d">暖気核</text>
  <line x1="194" y1="192" x2="210" y2="186" stroke="#1c2b36" stroke-width="1"/>
  <text x="166" y="196" font-size="13" fill="#1c2b36">壁雲</text>
  <line x1="360" y1="192" x2="348" y2="186" stroke="#1c2b36" stroke-width="1"/>
  <text x="362" y="196" font-size="13" fill="#1c2b36">壁雲</text>
  <text x="50" y="307" font-size="13" fill="#2569a8">下層は中心へ吹き込む</text>
  <line x1="56" y1="314" x2="196" y2="314" stroke="#2569a8" stroke-width="2.5" marker-end="url(#aB)"/>
  <line x1="504" y1="314" x2="364" y2="314" stroke="#2569a8" stroke-width="2.5" marker-end="url(#aB)"/>
  <line x1="30" y1="326" x2="530" y2="326" stroke="#2569a8" stroke-width="2.5"/>
  <rect x="30" y="326" width="500" height="14" fill="#d9ecf7"/>

  <!-- まとめ -->
  <rect x="20" y="350" width="250" height="52" rx="8" fill="#f4f8fb" stroke="#cfe0ec" stroke-width="1.5"/>
  <text x="32" y="374" font-size="13" fill="#2569a8">壁雲では強い上昇流</text>
  <text x="32" y="394" font-size="13" fill="#1c2b36">風速が最大になる</text>
  <rect x="290" y="350" width="250" height="52" rx="8" fill="#f4f8fb" stroke="#cfe0ec" stroke-width="1.5"/>
  <text x="302" y="374" font-size="13" fill="#f2a73b">眼の中は弱い下降流</text>
  <text x="302" y="394" font-size="13" fill="#e0524d">地表〜圏界面まで暖気核</text>
</svg>
