<svg viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="560" height="400" fill="#ffffff"/>
  <defs>
    <marker id="aB" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2569a8"/>
    </marker>
    <marker id="aR" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#e0524d"/>
    </marker>
    <marker id="aG" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#5a6b78"/>
    </marker>
  </defs>

  <text x="20" y="34" font-size="19" fill="#1c2b36">積乱雲の成長期と成熟期</text>
  <line x1="215" y1="50" x2="215" y2="386" stroke="#e2e8ec" stroke-width="1.5"/>

  <!-- 左: 成長期 -->
  <text x="24" y="70" font-size="15" fill="#1c2b36">成長期</text>
  <g fill="#e9eef2">
    <rect x="62" y="160" width="88" height="130" rx="14"/>
    <circle cx="72" cy="168" r="30"/>
    <circle cx="110" cy="155" r="34"/>
    <circle cx="142" cy="175" r="26"/>
  </g>
  <line x1="86" y1="284" x2="86" y2="180" stroke="#e0524d" stroke-width="2.5" marker-end="url(#aR)"/>
  <line x1="110" y1="284" x2="110" y2="158" stroke="#e0524d" stroke-width="2.5" marker-end="url(#aR)"/>
  <line x1="134" y1="284" x2="134" y2="186" stroke="#e0524d" stroke-width="2.5" marker-end="url(#aR)"/>
  <line x1="20" y1="330" x2="200" y2="330" stroke="#1c2b36" stroke-width="2.5"/>
  <rect x="20" y="330" width="180" height="8" fill="#dfe5e9"/>
  <text x="24" y="356" font-size="13" fill="#e0524d">内部はほぼ上昇流</text>
  <text x="24" y="378" font-size="13" fill="#1c2b36">まわりより高温</text>

  <!-- 右: 成熟期 -->
  <text x="229" y="70" font-size="15" fill="#1c2b36">成熟期</text>
  <line x1="330" y1="96" x2="430" y2="96" stroke="#5a6b78" stroke-width="2" marker-end="url(#aG)"/>
  <text x="438" y="101" font-size="12" fill="#5a6b78">上空の風</text>
  <text x="229" y="112" font-size="12" fill="#5a6b78">対流圏界面</text>
  <line x1="229" y1="118" x2="538" y2="118" stroke="#5a6b78" stroke-width="1.5" stroke-dasharray="6,4"/>
  <g fill="#e9eef2">
    <ellipse cx="348" cy="144" rx="48" ry="22"/>
    <ellipse cx="400" cy="140" rx="85" ry="20"/>
    <ellipse cx="468" cy="142" rx="52" ry="14"/>
    <rect x="286" y="150" width="84" height="152" rx="12"/>
    <circle cx="302" cy="170" r="30"/>
    <circle cx="344" cy="165" r="28"/>
  </g>
  <text x="232" y="150" font-size="12" fill="#5a6b78">風上側</text>
  <line x1="274" y1="186" x2="296" y2="192" stroke="#e0524d" stroke-width="1"/>
  <text x="232" y="190" font-size="13" fill="#e0524d">上昇流</text>
  <line x1="300" y1="296" x2="304" y2="158" stroke="#e0524d" stroke-width="3" marker-end="url(#aR)"/>
  <line x1="352" y1="170" x2="348" y2="298" stroke="#2569a8" stroke-width="3" marker-end="url(#aB)"/>
  <text x="392" y="196" font-size="13" fill="#1c2b36">かなとこ雲</text>
  <text x="392" y="216" font-size="13" fill="#5a6b78">風下側へのびる</text>
  <line x1="388" y1="246" x2="355" y2="239" stroke="#2569a8" stroke-width="1"/>
  <text x="392" y="250" font-size="13" fill="#2569a8">下降流</text>

  <path d="M 272,330 L 272,322 Q 300,314 348,314 L 430,314 Q 486,316 500,330 Z" fill="#cfe3f2"/>
  <g stroke="#2569a8" stroke-width="1.5">
    <line x1="296" y1="304" x2="300" y2="326"/>
    <line x1="310" y1="304" x2="314" y2="326"/>
    <line x1="324" y1="304" x2="328" y2="326"/>
    <line x1="338" y1="304" x2="342" y2="326"/>
    <line x1="352" y1="304" x2="356" y2="326"/>
  </g>
  <line x1="286" y1="324" x2="244" y2="324" stroke="#2569a8" stroke-width="2.5" marker-end="url(#aB)"/>
  <line x1="424" y1="324" x2="496" y2="324" stroke="#2569a8" stroke-width="2.5" marker-end="url(#aB)"/>
  <circle cx="400" cy="316" r="13" fill="#ffffff" stroke="#2569a8" stroke-width="2"/>
  <text x="393" y="322" font-size="14" fill="#2569a8">高</text>
  <line x1="229" y1="330" x2="540" y2="330" stroke="#1c2b36" stroke-width="2.5"/>
  <rect x="229" y="330" width="311" height="8" fill="#dfe5e9"/>
  <text x="229" y="356" font-size="13" fill="#2569a8">冷気プールが広がる</text>
  <text x="229" y="378" font-size="13" fill="#1c2b36">地上は局所的な高気圧</text>
</svg>
