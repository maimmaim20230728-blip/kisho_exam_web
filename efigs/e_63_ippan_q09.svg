<svg viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 z" fill="#2569a8"/>
    </marker>
    <marker id="ar" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 z" fill="#e0524d"/>
    </marker>
    <marker id="ao" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 z" fill="#f2a73b"/>
    </marker>
    <marker id="ag" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 z" fill="#15a35a"/>
    </marker>
  </defs>

  <text x="20" y="28" font-family="sans-serif" font-size="19" fill="#1c2b36">図: 地衡風と傾度風の力のつり合い</text>
  <rect x="458" y="12" width="70" height="24" rx="4" fill="#eef4f9" stroke="#2569a8" stroke-width="1"/>
  <text x="493" y="29" font-family="sans-serif" font-size="14" fill="#2569a8" text-anchor="middle">北半球</text>
  <text x="20" y="48" font-family="sans-serif" font-size="13" fill="#5a6b78">気圧傾度力(橙)は左右で同じ長さ。風(青)の長さを比べる</text>

  <!-- 左: 地衡風 -->
  <rect x="20" y="56" width="252" height="324" rx="6" fill="#fbfcfd" stroke="#dce3e8" stroke-width="1"/>
  <text x="146" y="80" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1c2b36" text-anchor="middle">地衡風</text>
  <text x="146" y="100" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="middle">等圧線に平行</text>
  <line x1="36" y1="120" x2="256" y2="120" stroke="#5a6b78" stroke-width="1.2"/>
  <line x1="36" y1="236" x2="256" y2="236" stroke="#5a6b78" stroke-width="1.2"/>
  <text x="252" y="114" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="end">低圧</text>
  <text x="252" y="254" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="end">高圧</text>
  <line x1="146" y1="178" x2="146" y2="140" stroke="#f2a73b" stroke-width="3" marker-end="url(#ao)"/>
  <text x="136" y="146" font-family="sans-serif" font-size="13" fill="#f2a73b" text-anchor="end">気圧傾度力</text>
  <line x1="146" y1="178" x2="146" y2="216" stroke="#e0524d" stroke-width="3" marker-end="url(#ar)"/>
  <text x="136" y="214" font-family="sans-serif" font-size="13" fill="#e0524d" text-anchor="end">コリオリ力</text>
  <line x1="146" y1="178" x2="226" y2="178" stroke="#2569a8" stroke-width="3" marker-end="url(#ab)"/>
  <text x="194" y="166" font-family="sans-serif" font-size="14" fill="#2569a8" text-anchor="middle">風 V</text>
  <circle cx="146" cy="178" r="6" fill="#1c2b36"/>
  <rect x="32" y="290" width="228" height="84" rx="6" fill="#ffffff" stroke="#dce3e8" stroke-width="1"/>
  <text x="146" y="314" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="middle">力のつり合い</text>
  <text x="146" y="340" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1c2b36" text-anchor="middle">P ＝ C</text>
  <text x="146" y="364" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="middle">コリオリ力だけで支える</text>

  <!-- 右: 傾度風 -->
  <rect x="288" y="56" width="252" height="324" rx="6" fill="#fbfcfd" stroke="#dce3e8" stroke-width="1"/>
  <text x="414" y="80" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1c2b36" text-anchor="middle">傾度風(低気圧)</text>
  <text x="414" y="100" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="middle">反時計回りに吹く</text>
  <circle cx="414" cy="183" r="30" fill="none" stroke="#a9b6c0" stroke-width="1.2"/>
  <circle cx="414" cy="183" r="56" fill="none" stroke="#a9b6c0" stroke-width="1.2"/>
  <text x="414" y="189" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2569a8" text-anchor="middle">低</text>
  <line x1="414" y1="239" x2="414" y2="201" stroke="#f2a73b" stroke-width="3" marker-end="url(#ao)"/>
  <text x="402" y="217" font-family="sans-serif" font-size="13" fill="#f2a73b" text-anchor="end" stroke="#fbfcfd" stroke-width="3" paint-order="stroke">気圧傾度力</text>
  <line x1="414" y1="239" x2="414" y2="261" stroke="#e0524d" stroke-width="3" marker-end="url(#ar)"/>
  <text x="402" y="258" font-family="sans-serif" font-size="13" fill="#e0524d" text-anchor="end">コリオリ力</text>
  <line x1="414" y1="264" x2="414" y2="280" stroke="#15a35a" stroke-width="3" marker-end="url(#ag)"/>
  <text x="402" y="280" font-family="sans-serif" font-size="13" fill="#15a35a" text-anchor="end">遠心力</text>
  <line x1="414" y1="239" x2="460" y2="239" stroke="#2569a8" stroke-width="3" marker-end="url(#ab)"/>
  <text x="468" y="235" font-family="sans-serif" font-size="14" fill="#2569a8">風 V</text>
  <circle cx="414" cy="239" r="6" fill="#1c2b36"/>
  <rect x="300" y="290" width="228" height="84" rx="6" fill="#ffffff" stroke="#dce3e8" stroke-width="1"/>
  <text x="414" y="314" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="middle">力のつり合い</text>
  <text x="414" y="340" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1c2b36" text-anchor="middle">P ＝ C ＋ 遠心力</text>
  <text x="414" y="364" font-family="sans-serif" font-size="13" fill="#e0524d" text-anchor="middle">コリオリ力が小さい＝風は弱い</text>
</svg>
