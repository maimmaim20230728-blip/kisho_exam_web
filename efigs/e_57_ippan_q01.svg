<svg viewBox="0 0 560 420" xmlns="http://www.w3.org/2000/svg">
<rect width="560" height="420" fill="#ffffff"/>
<defs>
<marker id="aO" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9.5" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 Z" fill="#f2a73b"/></marker>
<marker id="sO" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="1.5" refY="4.5" orient="auto"><path d="M11,0 L0,4.5 L11,9 Z" fill="#f2a73b"/></marker>
</defs>

<text x="20" y="35" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1c2b36">1月の中層大気　気温とオゾンの高さ</text>

<!-- 軸 -->
<line x1="100" y1="60" x2="100" y2="345" stroke="#1c2b36" stroke-width="1.5"/>
<line x1="100" y1="345" x2="258" y2="345" stroke="#1c2b36" stroke-width="1.5"/>
<text x="100" y="54" font-family="sans-serif" font-size="12" fill="#5a6b78">高度 km</text>

<!-- 高度目盛 -->
<line x1="95" y1="345" x2="100" y2="345" stroke="#1c2b36" stroke-width="1.5"/>
<line x1="95" y1="284" x2="100" y2="284" stroke="#1c2b36" stroke-width="1.5"/>
<line x1="95" y1="189" x2="100" y2="189" stroke="#1c2b36" stroke-width="1.5"/>
<line x1="95" y1="65" x2="100" y2="65" stroke="#1c2b36" stroke-width="1.5"/>
<text x="91" y="349" font-family="sans-serif" font-size="12" fill="#1c2b36" text-anchor="end">0</text>
<text x="91" y="288" font-family="sans-serif" font-size="12" fill="#1c2b36" text-anchor="end">20</text>
<text x="91" y="193" font-family="sans-serif" font-size="12" fill="#1c2b36" text-anchor="end">50</text>
<text x="91" y="69" font-family="sans-serif" font-size="12" fill="#1c2b36" text-anchor="end">90</text>

<!-- オゾン数密度が大きい層 -->
<rect x="100" y="267" width="155" height="17" fill="#f2a73b" opacity="0.32"/>
<text x="154" y="279" font-family="sans-serif" font-size="11" fill="#1c2b36">オゾンが多い層</text>

<!-- 対流圏界面 -->
<line x1="100" y1="292" x2="255" y2="292" stroke="#5a6b78" stroke-width="1" stroke-dasharray="4 3"/>
<text x="180" y="307" font-family="sans-serif" font-size="12" fill="#5a6b78">対流圏界面</text>

<!-- 気温プロファイル -->
<polyline points="244,345 203,329 163,314 125,292 135,277 156,252 188,221 221,189 194,158 156,127 125,96 109,65" fill="none" stroke="#2569a8" stroke-width="3" stroke-linejoin="round"/>
<circle cx="221" cy="189" r="4.5" fill="#f2a73b" stroke="#1c2b36" stroke-width="1"/>

<!-- ピークのずれを示す -->
<line x1="225" y1="189" x2="266" y2="189" stroke="#5a6b78" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="255" y1="275" x2="266" y2="275" stroke="#5a6b78" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="266" y1="194" x2="266" y2="270" stroke="#f2a73b" stroke-width="2.5" marker-start="url(#sO)" marker-end="url(#aO)"/>

<text x="278" y="186" font-family="sans-serif" font-size="13" fill="#1c2b36">気温が最大</text>
<text x="278" y="203" font-family="sans-serif" font-size="13" fill="#5a6b78">（約50km）</text>
<text x="278" y="272" font-family="sans-serif" font-size="13" fill="#1c2b36">オゾン数密度が最大</text>
<text x="278" y="289" font-family="sans-serif" font-size="13" fill="#5a6b78">（20〜25km）</text>

<!-- 横軸 -->
<text x="178" y="363" font-family="sans-serif" font-size="12" fill="#5a6b78" text-anchor="middle">低い　←　気温　→　高い</text>

<!-- 中間圏界面の南北 -->
<rect x="290" y="60" width="254" height="112" fill="none" stroke="#5a6b78" stroke-width="1"/>
<text x="300" y="80" font-family="sans-serif" font-size="13" fill="#1c2b36">1月の中間圏界面（70〜90km）</text>
<rect x="305" y="96" width="224" height="27" fill="#eef2f5" stroke="#5a6b78" stroke-width="1"/>
<text x="325" y="114" font-family="sans-serif" font-size="14" fill="#e0524d" text-anchor="middle" font-weight="bold">暖</text>
<text x="417" y="114" font-family="sans-serif" font-size="12" fill="#5a6b78" text-anchor="middle">地表とは逆</text>
<text x="509" y="114" font-family="sans-serif" font-size="14" fill="#2569a8" text-anchor="middle" font-weight="bold">寒</text>
<text x="305" y="140" font-family="sans-serif" font-size="12" fill="#e0524d">北極（冬）</text>
<text x="305" y="157" font-family="sans-serif" font-size="12" fill="#5a6b78">気温が高い</text>
<text x="529" y="140" font-family="sans-serif" font-size="12" fill="#2569a8" text-anchor="end">南極（夏）</text>
<text x="529" y="157" font-family="sans-serif" font-size="12" fill="#5a6b78" text-anchor="end">最も低い</text>

<!-- ポイント -->
<text x="20" y="380" font-family="sans-serif" font-size="14" fill="#1c2b36">■ 気温の最大は約50km、オゾン数密度の最大は20〜25km。</text>
<text x="20" y="400" font-family="sans-serif" font-size="14" fill="#1c2b36">■ 中間圏界面は北極（冬）が高温、南極（夏）が最も低温。</text>
</svg>
