<svg viewBox="0 0 560 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="420" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 z" fill="#2569a8"/>
    </marker>
  </defs>

  <text x="20" y="30" font-family="sans-serif" font-size="19" fill="#1c2b36">図: 温度風の関係(極側の温度と上空の風)</text>
  <text x="20" y="50" font-family="sans-serif" font-size="13" fill="#5a6b78">南北どちらの半球でも同じ規則</text>

  <!-- ケース1 -->
  <text x="20" y="80" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1c2b36">① 極側ほど暖かい → 上ほど東風が強まる</text>
  <rect x="30" y="92" width="87" height="98" fill="#dbe8f3"/>
  <rect x="117" y="92" width="87" height="98" fill="#eef0ef"/>
  <rect x="204" y="92" width="86" height="98" fill="#f7dedc"/>
  <line x1="117" y1="92" x2="117" y2="190" stroke="#5a6b78" stroke-width="1.2"/>
  <line x1="204" y1="92" x2="204" y2="190" stroke="#5a6b78" stroke-width="1.2"/>
  <rect x="30" y="92" width="260" height="98" fill="none" stroke="#5a6b78" stroke-width="1.2"/>
  <text x="160" y="112" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="middle">南北の温度</text>
  <text x="73" y="148" font-family="sans-serif" font-size="14" fill="#2569a8" text-anchor="middle">寒い</text>
  <text x="247" y="148" font-family="sans-serif" font-size="14" fill="#e0524d" text-anchor="middle">暖かい</text>
  <text x="30" y="206" font-family="sans-serif" font-size="13" fill="#5a6b78">低緯度側</text>
  <text x="290" y="206" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="end">極側</text>

  <rect x="326" y="92" width="200" height="98" rx="4" fill="#fbfcfd" stroke="#dce3e8" stroke-width="1"/>
  <line x1="426" y1="92" x2="426" y2="190" stroke="#b8c4cc" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="426" y1="114" x2="356" y2="114" stroke="#2569a8" stroke-width="3.5" marker-end="url(#ab)"/>
  <line x1="426" y1="141" x2="386" y2="141" stroke="#2569a8" stroke-width="3" marker-end="url(#ab)"/>
  <line x1="426" y1="168" x2="406" y2="168" stroke="#2569a8" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="516" y="118" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="end">上空</text>
  <text x="516" y="172" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="end">地表</text>
  <text x="426" y="206" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="middle">← 東風 ／ 西風 →</text>

  <line x1="20" y1="224" x2="540" y2="224" stroke="#dce3e8" stroke-width="1"/>

  <!-- ケース2 -->
  <text x="20" y="244" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1c2b36">② 極側ほど寒い → 上ほど西風が強まる</text>
  <rect x="30" y="256" width="87" height="98" fill="#f7dedc"/>
  <rect x="117" y="256" width="87" height="98" fill="#eef0ef"/>
  <rect x="204" y="256" width="86" height="98" fill="#dbe8f3"/>
  <line x1="117" y1="256" x2="117" y2="354" stroke="#5a6b78" stroke-width="1.2"/>
  <line x1="204" y1="256" x2="204" y2="354" stroke="#5a6b78" stroke-width="1.2"/>
  <rect x="30" y="256" width="260" height="98" fill="none" stroke="#5a6b78" stroke-width="1.2"/>
  <text x="160" y="276" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="middle">南北の温度</text>
  <text x="73" y="312" font-family="sans-serif" font-size="14" fill="#e0524d" text-anchor="middle">暖かい</text>
  <text x="247" y="312" font-family="sans-serif" font-size="14" fill="#2569a8" text-anchor="middle">寒い</text>
  <text x="30" y="370" font-family="sans-serif" font-size="13" fill="#5a6b78">低緯度側</text>
  <text x="290" y="370" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="end">極側</text>

  <rect x="326" y="256" width="200" height="98" rx="4" fill="#fbfcfd" stroke="#dce3e8" stroke-width="1"/>
  <line x1="426" y1="256" x2="426" y2="354" stroke="#b8c4cc" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="426" y1="278" x2="496" y2="278" stroke="#2569a8" stroke-width="3.5" marker-end="url(#ab)"/>
  <line x1="426" y1="305" x2="466" y2="305" stroke="#2569a8" stroke-width="3" marker-end="url(#ab)"/>
  <line x1="426" y1="332" x2="446" y2="332" stroke="#2569a8" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="336" y="282" font-family="sans-serif" font-size="13" fill="#5a6b78">上空</text>
  <text x="336" y="336" font-family="sans-serif" font-size="13" fill="#5a6b78">地表</text>
  <text x="426" y="370" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="middle">← 東風 ／ 西風 →</text>

  <line x1="20" y1="382" x2="540" y2="382" stroke="#dce3e8" stroke-width="1"/>
  <text x="20" y="401" font-family="sans-serif" font-size="13.5" fill="#1c2b36">1月の夏半球の成層圏は極側が暖かい → 上ほど東風が強まる</text>
</svg>
