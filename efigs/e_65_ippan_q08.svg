<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg">
<rect width="560" height="380" fill="#ffffff"/>
<defs>
<marker id="c8red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e0524d"/></marker>
<marker id="c8blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2569a8"/></marker>
</defs>

<text x="20" y="28" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1c2b36">発達中の温帯低気圧の東西鉛直断面（北半球）</text>

<text x="111" y="64" font-family="sans-serif" font-size="13" fill="#2569a8">低温（寒気）</text>
<text x="211" y="64" font-family="sans-serif" font-size="13" fill="#1c2b36">気圧の谷の軸</text>
<text x="391" y="64" font-family="sans-serif" font-size="13" fill="#e0524d">高温（暖気）</text>

<ellipse cx="372" cy="200" rx="48" ry="88" fill="#5a6b78" opacity="0.15"/>

<line x1="150" y1="74" x2="150" y2="320" stroke="#2569a8" stroke-width="2.5" stroke-dasharray="9 6"/>
<line x1="430" y1="74" x2="430" y2="320" stroke="#e0524d" stroke-width="2.5" stroke-dasharray="9 6"/>
<line x1="250" y1="74" x2="330" y2="320" stroke="#1c2b36" stroke-width="3"/>

<line x1="372" y1="278" x2="372" y2="132" stroke="#e0524d" stroke-width="2.5" marker-end="url(#c8red)"/>
<line x1="205" y1="150" x2="205" y2="270" stroke="#2569a8" stroke-width="2.5" marker-end="url(#c8blue)"/>

<text x="442" y="196" font-family="sans-serif" font-size="13" fill="#1c2b36">上昇流域</text>
<text x="442" y="216" font-family="sans-serif" font-size="13" fill="#5a6b78">（暖気が上昇）</text>
<text x="170" y="296" font-family="sans-serif" font-size="13" fill="#2569a8">下降流</text>
<text x="280" y="104" font-family="sans-serif" font-size="13" fill="#5a6b78">上ほど西へ傾く</text>

<text x="22" y="84" font-family="sans-serif" font-size="13" fill="#5a6b78">上空</text>
<text x="22" y="314" font-family="sans-serif" font-size="13" fill="#5a6b78">地上</text>

<line x1="55" y1="320" x2="528" y2="320" stroke="#1c2b36" stroke-width="2"/>
<circle cx="330" cy="320" r="5" fill="#1c2b36"/>

<text x="62" y="346" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1c2b36">西</text>
<text x="296" y="346" font-family="sans-serif" font-size="13" fill="#1c2b36">L：地上低気圧</text>
<text x="500" y="346" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1c2b36">東</text>
</svg>
