<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="560" height="360" fill="#ffffff"/>

  <text x="280" y="30" font-size="18" fill="#1c2b36" text-anchor="middle">MEが良くなってもRMSEが良くなるとは限らない</text>

  <!-- 段A: 変更前 -->
  <text x="24" y="58" font-size="16" fill="#1c2b36">① 変更前</text>
  <text x="536" y="58" font-size="14" fill="#5a6b78" text-anchor="end">高めに偏っている</text>
  <text x="300" y="72" font-size="14" fill="#1c2b36" text-anchor="middle">RMSE 2.1(誤差の大きさ)</text>
  <rect x="217" y="78" width="126" height="62" fill="#f2a73b" opacity="0.20"/>
  <line x1="100" y1="140" x2="460" y2="140" stroke="#1c2b36" stroke-width="2"/>
  <circle cx="310" cy="109" r="7" fill="#2569a8"/>
  <circle cx="340" cy="97" r="7" fill="#2569a8"/>
  <circle cx="340" cy="121" r="7" fill="#2569a8"/>
  <circle cx="370" cy="109" r="7" fill="#2569a8"/>
  <polygon points="340,143 332,157 348,157" fill="#f2a73b" stroke="#1c2b36" stroke-width="1"/>
  <text x="460" y="158" font-size="14" fill="#5a6b78" text-anchor="end">単位 ℃</text>
  <text x="340" y="176" font-size="14" fill="#1c2b36" text-anchor="middle">ME ＋2.0</text>

  <!-- 段B: 変更後 -->
  <text x="24" y="204" font-size="16" fill="#1c2b36">② 変更後</text>
  <text x="536" y="204" font-size="14" fill="#5a6b78" text-anchor="end">偏りは解消</text>
  <text x="300" y="202" font-size="14" fill="#1c2b36" text-anchor="middle">RMSE 3.5(誤差の大きさ)</text>
  <rect x="175" y="208" width="210" height="62" fill="#f2a73b" opacity="0.20"/>
  <line x1="100" y1="270" x2="460" y2="270" stroke="#1c2b36" stroke-width="2"/>
  <circle cx="160" cy="239" r="7" fill="#2569a8"/>
  <circle cx="190" cy="239" r="7" fill="#2569a8"/>
  <circle cx="370" cy="239" r="7" fill="#2569a8"/>
  <circle cx="400" cy="239" r="7" fill="#2569a8"/>
  <polygon points="280,273 272,287 288,287" fill="#f2a73b" stroke="#1c2b36" stroke-width="1"/>
  <text x="280" y="306" font-size="14" fill="#1c2b36" text-anchor="middle">ME 0.0</text>

  <!-- 誤差ゼロの基準線 -->
  <line x1="280" y1="78" x2="280" y2="140" stroke="#5a6b78" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="280" y1="208" x2="280" y2="270" stroke="#5a6b78" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="284" y="90" font-size="11" fill="#5a6b78">誤差0</text>

  <text x="100" y="292" font-size="14" fill="#5a6b78">← 予報が低い</text>
  <text x="460" y="292" font-size="14" fill="#5a6b78" text-anchor="end">予報が高い →</text>

  <text x="280" y="336" font-size="16" fill="#1c2b36" text-anchor="middle">偏り(ME)が消えても、ばらつきが増えればRMSEは悪化する</text>
</svg>
