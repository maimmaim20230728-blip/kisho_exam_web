<svg viewBox="0 0 560 384" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="384" fill="#ffffff"/>
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2569a8"/>
    </marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2a73b"/>
    </marker>
  </defs>

  <text x="24" y="32" font-family="sans-serif" font-size="19" fill="#1c2b36">オゾンは低緯度でつくられ 高緯度にたまる</text>
  <text x="544" y="56" text-anchor="end" font-family="sans-serif" font-size="13" fill="#5a6b78">北半球</text>

  <line x1="100" y1="54" x2="100" y2="86" stroke="#f2a73b" stroke-width="2.5" marker-end="url(#aOrange)"/>
  <line x1="130" y1="54" x2="130" y2="86" stroke="#f2a73b" stroke-width="2.5" marker-end="url(#aOrange)"/>
  <line x1="160" y1="54" x2="160" y2="86" stroke="#f2a73b" stroke-width="2.5" marker-end="url(#aOrange)"/>
  <text x="176" y="72" font-family="sans-serif" font-size="14" fill="#f2a73b">太陽紫外線</text>

  <path d="M76,204 L190,205 L385,218 L520,224 L520,90 L76,90 Z" fill="#eef4f9"/>
  <rect x="76" y="90" width="444" height="160" fill="none" stroke="#1c2b36" stroke-width="1.5"/>
  <line x1="76" y1="250" x2="520" y2="250" stroke="#1c2b36" stroke-width="3"/>

  <text x="70" y="108" text-anchor="end" font-family="sans-serif" font-size="12" fill="#5a6b78">50</text>
  <text x="70" y="167" text-anchor="end" font-family="sans-serif" font-size="12" fill="#5a6b78">30</text>
  <text x="70" y="225" text-anchor="end" font-family="sans-serif" font-size="12" fill="#5a6b78">10</text>
  <text x="70" y="254" text-anchor="end" font-family="sans-serif" font-size="12" fill="#5a6b78">0</text>
  <text x="70" y="86" text-anchor="end" font-family="sans-serif" font-size="12" fill="#5a6b78">km</text>

  <path d="M76,204 L190,205 L385,218 L520,224" fill="none" stroke="#5a6b78" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="250" y="238" font-family="sans-serif" font-size="14" fill="#5a6b78">対流圏界面</text>
  <text x="512" y="106" text-anchor="end" font-family="sans-serif" font-size="14" fill="#5a6b78">成層圏</text>

  <ellipse cx="165" cy="151" rx="55" ry="18" fill="#fdf0da" stroke="#f2a73b" stroke-width="2"/>
  <text x="228" y="156" font-family="sans-serif" font-size="14" fill="#1c2b36">オゾン生成が盛ん</text>

  <line x1="94" y1="200" x2="94" y2="122" stroke="#2569a8" stroke-width="3" marker-end="url(#aBlue)"/>
  <line x1="100" y1="116" x2="440" y2="128" stroke="#2569a8" stroke-width="3" marker-end="url(#aBlue)"/>
  <text x="160" y="108" font-family="sans-serif" font-size="14" fill="#2569a8">成層圏をゆっくり極へ運ぶ流れ</text>
  <line x1="452" y1="130" x2="452" y2="166" stroke="#2569a8" stroke-width="3" marker-end="url(#aBlue)"/>

  <ellipse cx="460" cy="192" rx="52" ry="20" fill="#dceaf5" stroke="#2569a8" stroke-width="2"/>
  <text x="460" y="187" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1c2b36">オゾンが</text>
  <text x="460" y="205" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1c2b36">たまる</text>

  <text x="76" y="268" font-family="sans-serif" font-size="14" fill="#1c2b36">赤道</text>
  <text x="298" y="268" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1c2b36">中緯度</text>
  <text x="520" y="268" text-anchor="end" font-family="sans-serif" font-size="14" fill="#1c2b36">北極</text>

  <text x="24" y="296" font-family="sans-serif" font-size="14" fill="#1c2b36">オゾン全量（頭上にある総量）</text>
  <line x1="76" y1="352" x2="520" y2="352" stroke="#1c2b36" stroke-width="1.5"/>
  <polyline points="76,345 170,341 270,332 370,318 460,308 520,305" fill="none" stroke="#2569a8" stroke-width="3"/>
  <text x="76" y="370" font-family="sans-serif" font-size="12" fill="#5a6b78">少ない</text>
  <text x="520" y="370" text-anchor="end" font-family="sans-serif" font-size="12" fill="#5a6b78">多い（春に最大）</text>
</svg>
