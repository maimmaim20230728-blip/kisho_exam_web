<svg viewBox="0 0 560 340" xmlns="http://www.w3.org/2000/svg">
<rect width="560" height="340" fill="#ffffff"/>
<defs>
<marker id="aB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="10.5" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#2569a8"/></marker>
<marker id="aO" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#f2a73b"/></marker>
<marker id="sO" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="1.5" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 Z" fill="#f2a73b"/></marker>
</defs>

<text x="20" y="35" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1c2b36">冬至の南中時　太陽高度角と日射の強さ</text>
<text x="542" y="35" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="end">北半球</text>

<!-- 左パネル -->
<text x="145" y="64" font-family="sans-serif" font-size="14" fill="#1c2b36" text-anchor="middle" font-weight="bold">北緯6.5°　α＝60°</text>
<line x1="40" y1="250" x2="270" y2="250" stroke="#1c2b36" stroke-width="2.5"/>
<line x1="195" y1="137" x2="130" y2="250" stroke="#2569a8" stroke-width="2.5" marker-end="url(#aB)"/>
<line x1="236" y1="137" x2="172" y2="250" stroke="#2569a8" stroke-width="2.5" marker-end="url(#aB)"/>
<line x1="130" y1="250" x2="130" y2="266" stroke="#f2a73b" stroke-width="1.5"/>
<line x1="172" y1="250" x2="172" y2="266" stroke="#f2a73b" stroke-width="1.5"/>
<line x1="130" y1="258" x2="172" y2="258" stroke="#f2a73b" stroke-width="5"/>
<line x1="160" y1="198" x2="191" y2="216" stroke="#f2a73b" stroke-width="2" marker-start="url(#sO)" marker-end="url(#aO)"/>
<line x1="133" y1="184" x2="163" y2="199" stroke="#5a6b78" stroke-width="1"/>
<text x="60" y="180" font-family="sans-serif" font-size="12" fill="#5a6b78">同じ幅の光束</text>
<path d="M158,250 A28,28 0 0 0 144,226" fill="none" stroke="#5a6b78" stroke-width="1.5"/>
<text x="74" y="232" font-family="sans-serif" font-size="12" fill="#1c2b36">α＝60°</text>
<text x="151" y="282" font-family="sans-serif" font-size="13" fill="#f2a73b" text-anchor="middle" font-weight="bold">せまい</text>

<!-- 右パネル -->
<text x="410" y="64" font-family="sans-serif" font-size="14" fill="#1c2b36" text-anchor="middle" font-weight="bold">北緯36.5°　α＝30°</text>
<line x1="290" y1="250" x2="530" y2="250" stroke="#1c2b36" stroke-width="2.5"/>
<line x1="442" y1="185" x2="330" y2="250" stroke="#2569a8" stroke-width="2.5" marker-end="url(#aB)"/>
<line x1="514" y1="185" x2="402" y2="250" stroke="#2569a8" stroke-width="2.5" marker-end="url(#aB)"/>
<line x1="330" y1="250" x2="330" y2="266" stroke="#f2a73b" stroke-width="1.5"/>
<line x1="402" y1="250" x2="402" y2="266" stroke="#f2a73b" stroke-width="1.5"/>
<line x1="330" y1="258" x2="402" y2="258" stroke="#f2a73b" stroke-width="5"/>
<line x1="425" y1="195" x2="443" y2="226" stroke="#f2a73b" stroke-width="2" marker-start="url(#sO)" marker-end="url(#aO)"/>
<line x1="410" y1="184" x2="428" y2="192" stroke="#5a6b78" stroke-width="1"/>
<text x="355" y="180" font-family="sans-serif" font-size="12" fill="#5a6b78">同じ幅</text>
<path d="M358,250 A28,28 0 0 0 354,236" fill="none" stroke="#5a6b78" stroke-width="1.5"/>
<text x="374" y="228" font-family="sans-serif" font-size="12" fill="#1c2b36">α＝30°</text>
<text x="366" y="282" font-family="sans-serif" font-size="13" fill="#f2a73b" text-anchor="middle" font-weight="bold">広い（約1.7倍）</text>

<!-- ポイント -->
<text x="20" y="300" font-family="sans-serif" font-size="14" fill="#1c2b36">■ 1m²あたりの日射量は sinα に比例する。</text>
<text x="20" y="320" font-family="sans-serif" font-size="14" fill="#1c2b36">■ sin60°÷sin30°＝0.87÷0.5＝1.74倍 → 74%大きい。</text>
</svg>
