<svg viewBox="0 0 560 410" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="410" fill="#ffffff"/>
  <defs>
    <marker id="aDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c2b36"/>
    </marker>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2569a8"/>
    </marker>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6b78"/>
    </marker>
  </defs>

  <text x="28" y="30" font-family="sans-serif" font-size="20" fill="#1c2b36">エルニーニョで積乱雲の位置が東へ動く</text>

  <text x="28" y="62" font-family="sans-serif" font-size="16" fill="#1c2b36">平常時</text>
  <text x="100" y="62" font-family="sans-serif" font-size="13" fill="#5a6b78">西に暖水と積乱雲・貿易風が強い</text>
  <rect x="50" y="70" width="470" height="132" fill="none" stroke="#dfe4e8" stroke-width="1.5"/>

  <g fill="#c8d7e3">
    <ellipse cx="112" cy="116" rx="28" ry="22"/>
    <ellipse cx="152" cy="102" rx="36" ry="28"/>
    <ellipse cx="192" cy="118" rx="26" ry="20"/>
    <rect x="84" y="112" width="134" height="28"/>
  </g>
  <text x="151" y="132" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1c2b36">雨が多い</text>
  <line x1="105" y1="142" x2="105" y2="150" stroke="#2569a8" stroke-width="1.5"/>
  <line x1="128" y1="142" x2="128" y2="150" stroke="#2569a8" stroke-width="1.5"/>
  <line x1="151" y1="142" x2="151" y2="150" stroke="#2569a8" stroke-width="1.5"/>
  <line x1="174" y1="142" x2="174" y2="150" stroke="#2569a8" stroke-width="1.5"/>
  <line x1="197" y1="142" x2="197" y2="150" stroke="#2569a8" stroke-width="1.5"/>

  <text x="345" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1c2b36">貿易風(東風)が強い</text>
  <line x1="460" y1="142" x2="240" y2="142" stroke="#1c2b36" stroke-width="4" marker-end="url(#aDark)"/>

  <rect x="52" y="150" width="466" height="50" fill="#eaf1f7"/>
  <line x1="52" y1="150" x2="518" y2="150" stroke="#1c2b36" stroke-width="2"/>
  <polygon points="54,151 280,151 300,170 54,186" fill="#f0b9b6"/>
  <text x="140" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1c2b36">暖水</text>
  <line x1="455" y1="194" x2="455" y2="160" stroke="#2569a8" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <text x="445" y="180" text-anchor="end" font-family="sans-serif" font-size="12" fill="#2569a8">冷水の湧昇</text>

  <text x="28" y="232" font-family="sans-serif" font-size="16" fill="#1c2b36">エルニーニョ時</text>
  <text x="156" y="232" font-family="sans-serif" font-size="13" fill="#5a6b78">暖水と積乱雲が東へ・貿易風が弱い</text>
  <rect x="50" y="240" width="470" height="132" fill="none" stroke="#dfe4e8" stroke-width="1.5"/>

  <g fill="#c8d7e3">
    <ellipse cx="300" cy="286" rx="28" ry="22"/>
    <ellipse cx="340" cy="272" rx="36" ry="28"/>
    <ellipse cx="380" cy="288" rx="26" ry="20"/>
    <rect x="272" y="282" width="134" height="26"/>
  </g>
  <line x1="293" y1="310" x2="293" y2="320" stroke="#2569a8" stroke-width="1.5"/>
  <line x1="316" y1="310" x2="316" y2="320" stroke="#2569a8" stroke-width="1.5"/>
  <line x1="339" y1="310" x2="339" y2="320" stroke="#2569a8" stroke-width="1.5"/>
  <line x1="362" y1="310" x2="362" y2="320" stroke="#2569a8" stroke-width="1.5"/>
  <line x1="385" y1="310" x2="385" y2="320" stroke="#2569a8" stroke-width="1.5"/>

  <text x="440" y="258" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e0524d">南米北部は高温</text>
  <line x1="150" y1="256" x2="150" y2="296" stroke="#5a6b78" stroke-width="2" marker-end="url(#aGray)"/>
  <text x="164" y="272" font-family="sans-serif" font-size="13" fill="#5a6b78">下降流</text>
  <text x="164" y="290" font-family="sans-serif" font-size="13" fill="#5a6b78">雨が少ない</text>

  <text x="470" y="302" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1c2b36">貿易風 弱い</text>
  <line x1="500" y1="314" x2="440" y2="314" stroke="#1c2b36" stroke-width="2" marker-end="url(#aDark)"/>

  <rect x="52" y="320" width="466" height="50" fill="#eaf1f7"/>
  <line x1="52" y1="320" x2="518" y2="320" stroke="#1c2b36" stroke-width="2"/>
  <polygon points="54,321 516,321 516,346 54,349" fill="#f0b9b6"/>
  <text x="400" y="344" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1c2b36">暖水が東へ広がる</text>

  <text x="50" y="388" font-family="sans-serif" font-size="13" fill="#5a6b78">西: インドネシア・豪州北部</text>
  <text x="518" y="388" text-anchor="end" font-family="sans-serif" font-size="13" fill="#5a6b78">東: 南米沖</text>
</svg>
