<svg viewBox="0 0 560 410" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="560" height="410" fill="#ffffff"/>
  <defs>
    <marker id="q09arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e0524d"/>
    </marker>
    <marker id="q09arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2569a8"/>
    </marker>
    <marker id="q09arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6b78"/>
    </marker>
    <marker id="q09arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c2b36"/>
    </marker>
    <marker id="q09arOe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2a73b"/>
    </marker>
    <marker id="q09arOs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#f2a73b"/>
    </marker>
  </defs>

  <text x="280" y="30" font-size="19" font-weight="bold" fill="#1c2b36" text-anchor="middle">温帯低気圧の東側は暖気・西側は寒気(北半球)</text>

  <!-- (1) 平面図 -->
  <text x="26" y="56" font-size="14" font-weight="bold" fill="#1c2b36">(1) 地上の風 北半球の低気圧は反時計回りに吹き込む</text>

  <line x1="505" y1="110" x2="505" y2="84" stroke="#1c2b36" stroke-width="2" marker-end="url(#q09arD)"/>
  <text x="505" y="76" font-size="12" fill="#1c2b36" text-anchor="middle">北</text>

  <circle cx="280" cy="132" r="52" fill="none" stroke="#5a6b78" stroke-width="1.2"/>
  <circle cx="280" cy="132" r="30" fill="none" stroke="#5a6b78" stroke-width="1.2"/>
  <text x="280" y="143" font-size="26" font-weight="bold" fill="#1c2b36" text-anchor="middle">低</text>

  <path d="M400,190 C420,154 408,110 350,96" fill="none" stroke="#e0524d" stroke-width="3" marker-end="url(#q09arR)"/>
  <path d="M160,80 C144,118 154,158 204,172" fill="none" stroke="#2569a8" stroke-width="3" marker-end="url(#q09arB)"/>
  <path d="M350,70 C314,56 254,56 232,82" fill="none" stroke="#5a6b78" stroke-width="2" marker-end="url(#q09arG)"/>
  <path d="M214,192 C246,208 310,206 336,182" fill="none" stroke="#5a6b78" stroke-width="2" marker-end="url(#q09arG)"/>

  <text x="428" y="120" font-size="14" fill="#e0524d">南寄りの風</text>
  <text x="428" y="140" font-size="14" fill="#e0524d">暖気が入る</text>
  <text x="136" y="120" font-size="14" fill="#2569a8" text-anchor="end">北寄りの風</text>
  <text x="136" y="140" font-size="14" fill="#2569a8" text-anchor="end">寒気が入る</text>

  <!-- (2) 鉛直断面 -->
  <text x="26" y="232" font-size="14" font-weight="bold" fill="#1c2b36">(2) 鉛直断面(左=西 右=東) 等圧面の間隔=層厚</text>

  <path d="M55,312 C130,308 205,302 280,293 L280,367 C205,368 130,367 55,364 Z" fill="#2569a8" fill-opacity="0.12"/>
  <path d="M280,293 C355,284 430,277 505,270 L505,362 C430,364 355,366 280,367 Z" fill="#e0524d" fill-opacity="0.12"/>

  <path d="M55,312 C130,308 205,302 280,293 C355,284 430,277 505,270" fill="none" stroke="#1c2b36" stroke-width="2"/>
  <path d="M55,364 C130,367 205,368 280,367 C355,366 430,364 505,362" fill="none" stroke="#1c2b36" stroke-width="2"/>

  <text x="290" y="258" font-size="12" fill="#5a6b78" text-anchor="middle">上の等圧面(例 500hPa)</text>
  <text x="280" y="390" font-size="12" fill="#5a6b78" text-anchor="middle">下の等圧面(例 1000hPa)</text>

  <text x="160" y="341" font-size="13" font-weight="bold" fill="#2569a8" text-anchor="middle">寒気(気温 低い)</text>
  <text x="395" y="333" font-size="13" font-weight="bold" fill="#e0524d" text-anchor="middle">暖気(気温 高い)</text>

  <line x1="72" y1="313" x2="72" y2="363" stroke="#f2a73b" stroke-width="2" marker-start="url(#q09arOs)" marker-end="url(#q09arOe)"/>
  <text x="72" y="302" font-size="13" font-weight="bold" fill="#1c2b36" text-anchor="middle">層厚 小</text>
  <line x1="488" y1="271" x2="488" y2="361" stroke="#f2a73b" stroke-width="2" marker-start="url(#q09arOs)" marker-end="url(#q09arOe)"/>
  <text x="488" y="262" font-size="13" font-weight="bold" fill="#1c2b36" text-anchor="middle">層厚 大</text>
</svg>
