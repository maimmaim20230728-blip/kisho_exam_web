<svg viewBox="0 0 560 412" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="412" fill="#ffffff"/>
  <defs>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2569a8"/>
    </marker>
    <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2a73b"/>
    </marker>
    <marker id="md" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c2b36"/>
    </marker>
  </defs>

  <text x="24" y="34" font-family="sans-serif" font-size="19" fill="#1c2b36">オゾンは「つくられる場所」と「たまる場所」が違う</text>

  <text x="24" y="68" font-family="sans-serif" font-size="16" fill="#1c2b36">高度による分布</text>
  <text x="306" y="68" font-family="sans-serif" font-size="16" fill="#1c2b36">つくられる場所と たまる場所</text>

  <!-- 左パネル:鉛直分布 -->
  <text transform="rotate(-90 32 232)" x="32" y="232" font-family="sans-serif" font-size="14" fill="#5a6b78" text-anchor="middle">高度(km)</text>
  <line x1="76" y1="352" x2="76" y2="106" stroke="#1c2b36" stroke-width="1.5" marker-end="url(#md)"/>
  <line x1="70" y1="350" x2="76" y2="350" stroke="#1c2b36" stroke-width="1.5"/>
  <line x1="70" y1="230" x2="76" y2="230" stroke="#1c2b36" stroke-width="1.5"/>
  <line x1="70" y1="182" x2="76" y2="182" stroke="#1c2b36" stroke-width="1.5"/>
  <line x1="70" y1="110" x2="76" y2="110" stroke="#1c2b36" stroke-width="1.5"/>
  <text x="64" y="355" font-family="sans-serif" font-size="14" fill="#1c2b36" text-anchor="end">0</text>
  <text x="64" y="235" font-family="sans-serif" font-size="14" fill="#1c2b36" text-anchor="end">25</text>
  <text x="64" y="187" font-family="sans-serif" font-size="14" fill="#1c2b36" text-anchor="end">35</text>
  <text x="64" y="115" font-family="sans-serif" font-size="14" fill="#1c2b36" text-anchor="end">50</text>

  <rect x="78" y="230" width="80" height="24" fill="#f2a73b" opacity="0.22"/>
  <line x1="78" y1="206" x2="168" y2="206" stroke="#5a6b78" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="78" y1="182" x2="168" y2="182" stroke="#5a6b78" stroke-width="1.2" stroke-dasharray="4 3"/>

  <path d="M78,350 Q104,314 132,276 Q152,258 152,244 Q150,214 124,190 Q98,154 80,112" fill="none" stroke="#2569a8" stroke-width="2.5"/>

  <text x="176" y="190" font-family="sans-serif" font-size="14" fill="#5a6b78">混合比が最大</text>
  <text x="176" y="210" font-family="sans-serif" font-size="14" fill="#5a6b78">30〜35km</text>
  <text x="176" y="238" font-family="sans-serif" font-size="14" fill="#2569a8">数密度が最大</text>
  <text x="176" y="258" font-family="sans-serif" font-size="14" fill="#2569a8">20〜25km</text>

  <line x1="78" y1="110" x2="262" y2="110" stroke="#5a6b78" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="78" y="102" font-family="sans-serif" font-size="14" fill="#5a6b78">成層圏界面 約50km</text>
  <text x="104" y="136" font-family="sans-serif" font-size="14" fill="#e0524d">× ここが最大ではない</text>

  <text x="78" y="376" font-family="sans-serif" font-size="14" fill="#5a6b78">オゾンの数密度 →</text>

  <!-- 右パネル:生成と輸送 -->
  <rect x="306" y="130" width="232" height="220" fill="none" stroke="#5a6b78" stroke-width="1"/>
  <rect x="307" y="150" width="230" height="156" fill="#2569a8" opacity="0.07"/>
  <line x1="306" y1="350" x2="538" y2="350" stroke="#1c2b36" stroke-width="2"/>
  <text transform="rotate(-90 326 228)" x="326" y="228" font-family="sans-serif" font-size="14" fill="#5a6b78" text-anchor="middle">成層圏</text>

  <line x1="366" y1="134" x2="366" y2="162" stroke="#f2a73b" stroke-width="2.5" marker-end="url(#mo)"/>
  <line x1="384" y1="134" x2="384" y2="162" stroke="#f2a73b" stroke-width="2.5" marker-end="url(#mo)"/>
  <text x="396" y="152" font-family="sans-serif" font-size="14" fill="#f2a73b">紫外線</text>

  <path d="M350,300 L350,192 C390,158 465,162 500,192 L500,258" fill="none" stroke="#2569a8" stroke-width="3" marker-end="url(#mb)"/>
  <text x="360" y="236" font-family="sans-serif" font-size="14" fill="#2569a8">オゾンがつくられる</text>
  <text x="470" y="280" font-family="sans-serif" font-size="14" fill="#1c2b36" text-anchor="middle">高緯度にたまる</text>
  <text x="470" y="302" font-family="sans-serif" font-size="14" fill="#1c2b36" text-anchor="middle">オゾン全量が多い</text>

  <text x="322" y="376" font-family="sans-serif" font-size="14" fill="#5a6b78">赤道</text>
  <text x="520" y="376" font-family="sans-serif" font-size="14" fill="#5a6b78" text-anchor="middle">極</text>

  <text x="24" y="400" font-family="sans-serif" font-size="14" fill="#5a6b78">分布は 光化学反応 と 大気の輸送 の両方で決まる</text>
</svg>
