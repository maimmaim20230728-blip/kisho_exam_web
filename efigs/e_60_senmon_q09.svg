<svg viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="560" height="400" fill="#ffffff"/>
  <defs>
    <marker id="q09arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2569a8"/>
    </marker>
    <marker id="q09arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c2b36"/>
    </marker>
  </defs>

  <text x="24" y="32" font-size="19" font-weight="bold" fill="#1c2b36">JPCZ（日本海寒帯気団収束帯）のできかた</text>

  <!-- 海と陸 -->
  <rect x="24" y="46" width="512" height="278" fill="#eef6fb"/>
  <polygon points="24,46 210,46 228,118 200,186 146,232 24,258" fill="#eef1f3" stroke="#b9c4cc" stroke-width="1.5"/>
  <polygon points="300,324 430,262 536,232 536,324" fill="#eef1f3" stroke="#b9c4cc" stroke-width="1.5"/>

  <!-- 山地 -->
  <polygon points="118,146 146,146 132,118" fill="#5a6b78"/>
  <polygon points="140,124 172,124 156,92" fill="#5a6b78"/>
  <polygon points="166,142 200,142 183,108" fill="#5a6b78"/>
  <text x="60" y="180" font-size="13" fill="#1c2b36">朝鮮半島の北の山地</text>

  <!-- 方位 -->
  <line x1="512" y1="88" x2="512" y2="62" stroke="#1c2b36" stroke-width="2" marker-end="url(#q09arD)"/>
  <text x="512" y="104" font-size="13" fill="#1c2b36" text-anchor="middle">北</text>

  <!-- 季節風 -->
  <line x1="42" y1="60" x2="112" y2="104" stroke="#2569a8" stroke-width="3" marker-end="url(#q09arB)"/>
  <line x1="34" y1="106" x2="104" y2="150" stroke="#2569a8" stroke-width="3" marker-end="url(#q09arB)"/>
  <text x="36" y="216" font-size="13" fill="#2569a8">季節風（寒気の吹き出し）</text>

  <!-- 山で二手に分かれ、風下で合流 -->
  <text x="215" y="72" font-size="13" fill="#1c2b36">山地で二手に分かれる</text>
  <path d="M 200,94 C 244,86 290,102 320,130" fill="none" stroke="#2569a8" stroke-width="3" marker-end="url(#q09arB)"/>
  <path d="M 200,162 C 244,182 290,178 320,152" fill="none" stroke="#2569a8" stroke-width="3" marker-end="url(#q09arB)"/>

  <!-- 収束帯 -->
  <line x1="332" y1="146" x2="484" y2="254" stroke="#f2a73b" stroke-width="18" opacity="0.5" stroke-linecap="round"/>
  <circle cx="352" cy="160" r="11" fill="#ffffff" stroke="#2569a8" stroke-width="2"/>
  <circle cx="382" cy="182" r="11" fill="#ffffff" stroke="#2569a8" stroke-width="2"/>
  <circle cx="412" cy="203" r="11" fill="#ffffff" stroke="#2569a8" stroke-width="2"/>
  <circle cx="442" cy="224" r="11" fill="#ffffff" stroke="#2569a8" stroke-width="2"/>
  <circle cx="472" cy="246" r="11" fill="#ffffff" stroke="#2569a8" stroke-width="2"/>
  <text x="344" y="122" font-size="15" font-weight="bold" fill="#f2a73b">収束帯（JPCZ）</text>

  <text x="472" y="292" font-size="16" font-weight="bold" fill="#1c2b36" text-anchor="middle">大雪</text>
  <text x="252" y="292" font-size="16" fill="#2569a8" text-anchor="middle">日本海</text>

  <!-- 説明 -->
  <text x="24" y="354" font-size="14" fill="#1c2b36">・季節風が山地で二手に分かれ、風下の日本海上で再び合流して収束帯ができる。</text>
  <text x="24" y="378" font-size="14" fill="#1c2b36">・長さは約1000km。大雪の場所は日によって変わり、近畿以西でも起こる。</text>
</svg>
