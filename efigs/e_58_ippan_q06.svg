<svg viewBox="0 0 560 394" xmlns="http://www.w3.org/2000/svg">
<rect width="560" height="394" fill="#ffffff"/>
<defs>
<marker id="aB" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#2569a8"/></marker>
<marker id="aO" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#f2a73b"/></marker>
</defs>

<text x="20" y="35" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1c2b36">温度風の読み方</text>
<text x="20" y="53" font-family="sans-serif" font-size="12" fill="#5a6b78">図はすべて上が北・右が東</text>

<rect x="16" y="60" width="168" height="240" rx="6" fill="none" stroke="#d7dee3" stroke-width="1.2"/>
<rect x="196" y="60" width="168" height="240" rx="6" fill="none" stroke="#d7dee3" stroke-width="1.2"/>
<rect x="376" y="60" width="168" height="240" rx="6" fill="none" stroke="#d7dee3" stroke-width="1.2"/>

<!-- パネルA -->
<text x="100" y="84" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1c2b36" text-anchor="middle">ベクトルの引き算</text>
<circle cx="56" cy="200" r="3.5" fill="#1c2b36"/>
<line x1="56" y1="200" x2="96" y2="220" stroke="#2569a8" stroke-width="2.5" marker-end="url(#aB)"/>
<line x1="56" y1="200" x2="96" y2="160" stroke="#2569a8" stroke-width="2.5" marker-end="url(#aB)"/>
<line x1="96" y1="220" x2="104" y2="220" stroke="#f2a73b" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="96" y1="160" x2="104" y2="160" stroke="#f2a73b" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="104" y1="220" x2="104" y2="160" stroke="#f2a73b" stroke-width="3" marker-end="url(#aO)"/>
<text x="52" y="148" font-family="sans-serif" font-size="11" fill="#2569a8">700hPa</text>
<text x="52" y="240" font-family="sans-serif" font-size="11" fill="#2569a8">850hPa</text>
<text x="112" y="186" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#f2a73b">温度風</text>
<text x="112" y="204" font-family="sans-serif" font-size="11" fill="#5a6b78">700−850</text>
<text x="100" y="270" font-family="sans-serif" font-size="11.5" fill="#1c2b36" text-anchor="middle">先端どうしを結ぶ</text>
<text x="100" y="288" font-family="sans-serif" font-size="11.5" fill="#1c2b36" text-anchor="middle">ベクトルが温度風</text>

<!-- パネルB 北半球 -->
<text x="280" y="84" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1c2b36" text-anchor="middle">北半球</text>
<line x1="240" y1="142" x2="240" y2="250" stroke="#5a6b78" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="320" y1="142" x2="320" y2="250" stroke="#5a6b78" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="236" y="132" font-family="sans-serif" font-size="10.5" fill="#5a6b78" text-anchor="middle">等温線</text>
<line x1="280" y1="242" x2="280" y2="150" stroke="#f2a73b" stroke-width="3" marker-end="url(#aO)"/>
<text x="280" y="138" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#f2a73b" text-anchor="middle">温度風</text>
<text x="214" y="204" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2569a8" text-anchor="middle">寒気</text>
<text x="346" y="204" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e0524d" text-anchor="middle">暖気</text>
<text x="280" y="270" font-family="sans-serif" font-size="11.5" fill="#1c2b36" text-anchor="middle">寒気は温度風の</text>
<text x="280" y="288" font-family="sans-serif" font-size="11.5" fill="#1c2b36" text-anchor="middle">左手側にある</text>

<!-- パネルC 南半球 -->
<text x="460" y="84" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1c2b36" text-anchor="middle">南半球</text>
<line x1="420" y1="142" x2="420" y2="250" stroke="#5a6b78" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="500" y1="142" x2="500" y2="250" stroke="#5a6b78" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="416" y="132" font-family="sans-serif" font-size="10.5" fill="#5a6b78" text-anchor="middle">等温線</text>
<line x1="460" y1="242" x2="460" y2="150" stroke="#f2a73b" stroke-width="3" marker-end="url(#aO)"/>
<text x="460" y="138" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#f2a73b" text-anchor="middle">温度風</text>
<text x="394" y="204" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e0524d" text-anchor="middle">暖気</text>
<text x="526" y="204" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2569a8" text-anchor="middle">寒気</text>
<text x="460" y="270" font-family="sans-serif" font-size="11.5" fill="#1c2b36" text-anchor="middle">寒気は温度風の</text>
<text x="460" y="288" font-family="sans-serif" font-size="11.5" fill="#1c2b36" text-anchor="middle">右手側にある</text>

<text x="20" y="326" font-family="sans-serif" font-size="13" fill="#1c2b36">温度風が長いほど、その層の水平温度勾配は大きい</text>
<text x="20" y="348" font-family="sans-serif" font-size="13" fill="#1c2b36">北半球で高さとともに風が反時計回り(反転)なら寒気移流</text>
<text x="20" y="370" font-family="sans-serif" font-size="13" fill="#1c2b36">南半球では逆で、時計回り(順転)なら寒気移流</text>
</svg>
