<svg viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="560" height="400" fill="#ffffff"/>

  <text x="24" y="38" font-size="19" fill="#1c2b36">アンサンブル平均と最大の性格の違い</text>
  <text x="24" y="62" font-size="14" fill="#5a6b78">メンバーごとに強雨の位置がずれる。平均すると山がならされる</text>

  <!-- 軸 -->
  <line x1="60" y1="90" x2="60" y2="270" stroke="#1c2b36" stroke-width="1.5"/>
  <line x1="60" y1="270" x2="510" y2="270" stroke="#1c2b36" stroke-width="1.5"/>
  <text x="68" y="86" font-size="14" fill="#5a6b78">降水量</text>
  <text x="510" y="292" font-size="14" fill="#5a6b78" text-anchor="end">場所</text>

  <!-- 各メンバー -->
  <g fill="none" stroke="#5a6b78" stroke-width="1.5" opacity="0.55">
    <path d="M125,270 C155,270 157,115 180,115 C203,115 205,270 235,270"/>
    <path d="M180,270 C210,270 212,115 235,115 C258,115 260,270 290,270"/>
    <path d="M235,270 C265,270 267,115 290,115 C313,115 315,270 345,270"/>
    <path d="M290,270 C320,270 322,115 345,115 C368,115 370,270 400,270"/>
    <path d="M345,270 C375,270 377,115 400,115 C423,115 425,270 455,270"/>
  </g>

  <!-- アンサンブル最大 -->
  <path d="M125,270 C150,264 158,120 180,116 C193,116 196,190 207,190 C219,190 223,116 235,116 C248,116 251,190 262,190 C274,190 278,116 290,116 C303,116 306,190 317,190 C329,190 333,116 345,116 C358,116 361,190 372,190 C384,190 388,116 400,116 C423,120 428,264 455,270" fill="none" stroke="#f2a73b" stroke-width="3"/>

  <!-- アンサンブル平均 -->
  <path d="M115,270 C195,268 200,236 290,236 C380,236 385,268 465,270" fill="none" stroke="#2569a8" stroke-width="3"/>

  <!-- 凡例 -->
  <line x1="70" y1="318" x2="96" y2="318" stroke="#5a6b78" stroke-width="1.5" opacity="0.55"/>
  <text x="104" y="323" font-size="14" fill="#1c2b36">各メンバー</text>
  <line x1="210" y1="318" x2="236" y2="318" stroke="#2569a8" stroke-width="3"/>
  <text x="244" y="323" font-size="14" fill="#1c2b36">アンサンブル平均</text>
  <line x1="380" y1="318" x2="406" y2="318" stroke="#f2a73b" stroke-width="3"/>
  <text x="414" y="323" font-size="14" fill="#1c2b36">アンサンブル最大</text>

  <text x="24" y="352" font-size="14" fill="#2569a8">平均は、強雨の分布や最大降水量を捉えるのに向かない</text>
  <text x="24" y="376" font-size="14" fill="#f2a73b">最大は、空振りは増えるが顕著現象の捕捉率が高い</text>
</svg>
