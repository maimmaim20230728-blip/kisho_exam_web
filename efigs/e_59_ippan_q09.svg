<!-- 到達距離 -->
<line x1="110" y1="340" x2="356" y2="340" stroke="#5a6b78" stroke-width="2" marker-start="url(#q9gs)" marker-end="url(#q9ge)"/>
<text x="233" y="360" font-size="12" fill="#5a6b78" text-anchor="middle">積乱雲の真下から数十km先まで届く</text>

<line x1="24" y1="374" x2="536" y2="374" stroke="#dde4e9" stroke-width="1"/>
<text x="280" y="396" font-size="14" fill="#1c2b36" text-anchor="middle">通過時は <tspan font-weight="bold" fill="#f2a73b">気圧上昇</tspan>・気温下降・風向急変・突風</text>
</svg>
