<svg viewBox="0 0 560 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<rect width="560" height="420" fill="#ffffff"/>
<defs>
<marker id="q9b" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2569a8"/></marker>
<marker id="q9ge" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5a6b78"/></marker>
<marker id="q9gs" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto"><path d="M10,0 L0,5 L10,10 Z" fill="#5a6b78"/></marker>
</defs>

<text x="28" y="32" font-size="17" font-weight="bold" fill="#1c2b36">ガストフロント: 冷たい外出流の先端で気圧が上がる</text>

<!-- 積乱雲 -->
<path d="M256,190 C234,190 230,166 250,158 C242,132 270,112 296,122 C304,92 348,80 372,100 C404,84 440,104 436,132 C464,138 468,176 446,190 Z" fill="#eaeef1" stroke="#5a6b78" stroke-width="1.5"/>
<text x="356" y="58" font-size="13" fill="#1c2b36" text-anchor="middle">発達した積乱雲</text>

<!-- 降水 -->
<line x1="280" y1="192" x2="280" y2="306" stroke="#2569a8" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="300" y1="192" x2="300" y2="306" stroke="#2569a8" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="320" y1="192" x2="320" y2="306" stroke="#2569a8" stroke-width="1.5" stroke-dasharray="6 5"/>
<line x1="340" y1="192" x2="340" y2="306" stroke="#2569a8" stroke-width="1.5" stroke-dasharray="6 5"/>

<!-- 下降流 -->
<line x1="370" y1="140" x2="370" y2="246" stroke="#2569a8" stroke-width="4" marker-end="url(#q9b)"/>
<text x="386" y="216" font-size="12" fill="#2569a8">降水を伴う下降流</text>

<!-- 冷気の外出流 -->
<path d="M505,255 L200,248 L145,235 L108,310 L505,310 Z" fill="#cfe0ef"/>
<path d="M505,255 L200,248 L145,235 L108,310" fill="none" stroke="#2569a8" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="145" y1="235" x2="108" y2="310" stroke="#f2a73b" stroke-width="4.5"/>
<line x1="400" y1="290" x2="185" y2="290" stroke="#2569a8" stroke-width="3.5" marker-end="url(#q9b)"/>
<text x="300" y="278" font-size="12" fill="#1c2b36" text-anchor="middle">冷たい外出流</text>
<text x="24" y="258" font-size="13" font-weight="bold" fill="#f2a73b">ガストフロント</text>

<!-- アーク雲 -->
<path d="M136,216 C124,214 126,198 140,198 C144,186 168,182 178,192 C196,184 214,196 208,208 C218,210 216,218 206,216 Z" fill="#eaeef1" stroke="#5a6b78" stroke-width="1.5"/>
<text x="170" y="172" font-size="12" fill="#5a6b78" text-anchor="middle">アーク雲</text>

