<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg">
<rect width="560" height="360" fill="#ffffff"/>
<defs>
<marker id="o1blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2569a8"/></marker>
</defs>

<text x="20" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1c2b36">オゾンの生成と輸送（北半球の断面）</text>

<text x="24" y="50" font-family="sans-serif" font-size="11" fill="#5a6b78">高度 km</text>
<line x1="80" y1="58" x2="80" y2="280" stroke="#1c2b36" stroke-width="1.5"/>
<line x1="80" y1="280" x2="525" y2="280" stroke="#1c2b36" stroke-width="2"/>
<line x1="74" y1="280" x2="80" y2="280" stroke="#5a6b78" stroke-width="1.5"/>
<line x1="74" y1="192" x2="80" y2="192" stroke="#5a6b78" stroke-width="1.5"/>
<line x1="74" y1="104" x2="80" y2="104" stroke="#5a6b78" stroke-width="1.5"/>
<text x="70" y="284" font-family="sans-serif" font-size="11" fill="#5a6b78" text-anchor="end">0</text>
<text x="70" y="196" font-family="sans-serif" font-size="11" fill="#5a6b78" text-anchor="end">20</text>
<text x="70" y="108" font-family="sans-serif" font-size="11" fill="#5a6b78" text-anchor="end">40</text>

<ellipse cx="170" cy="120" rx="62" ry="30" fill="#f2a73b" opacity="0.20"/>
<ellipse cx="450" cy="196" rx="48" ry="28" fill="#f2a73b" opacity="0.20"/>

<line x1="82" y1="205" x2="520" y2="240" stroke="#5a6b78" stroke-width="1.5" stroke-dasharray="7 5"/>

<path d="M 115 245 C 115 160, 135 105, 225 100 C 330 94, 440 118, 450 186" fill="none" stroke="#2569a8" stroke-width="3" marker-end="url(#o1blue)"/>

<text x="95" y="80" font-family="sans-serif" font-size="13" fill="#f2a73b">低緯度の上層：紫外線でオゾンが生成</text>
<text x="238" y="130" font-family="sans-serif" font-size="13" fill="#2569a8">循環が高緯度へ運ぶ</text>
<text x="280" y="196" font-family="sans-serif" font-size="13" fill="#1c2b36">下部成層圏にたまる →</text>
<text x="145" y="168" font-family="sans-serif" font-size="13" fill="#5a6b78">成層圏</text>
<text x="145" y="262" font-family="sans-serif" font-size="13" fill="#5a6b78">対流圏</text>

<text x="85" y="300" font-family="sans-serif" font-size="13" fill="#5a6b78">赤道（低緯度）</text>
<text x="415" y="300" font-family="sans-serif" font-size="13" fill="#5a6b78">北極（高緯度）</text>

<text x="95" y="334" font-family="sans-serif" font-size="13" fill="#f2a73b">オゾン全量の最大は春（3〜4月）。日射が最強の夏ではない</text>
</svg>
