<svg viewBox="0 0 560 410" xmlns="http://www.w3.org/2000/svg">
<rect width="560" height="410" fill="#ffffff"/>
<defs>
<marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2569a8"/></marker>
<marker id="aO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f2a73b"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6b78"/></marker>
</defs>

<text x="20" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1c2b36">ウィンドプロファイラ 風の求め方</text>
<text x="20" y="52" font-family="sans-serif" font-size="14" fill="#5a6b78">斜めビームは水平風の一部だけを測る</text>

<rect x="18" y="64" width="254" height="328" rx="8" fill="none" stroke="#dfe6ea" stroke-width="1.5"/>
<rect x="288" y="64" width="254" height="328" rx="8" fill="none" stroke="#dfe6ea" stroke-width="1.5"/>

<text x="32" y="90" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1c2b36">① ビームが測る成分</text>

<line x1="60" y1="140" x2="238" y2="140" stroke="#2569a8" stroke-width="3" marker-end="url(#aB)"/>
<text x="149" y="126" font-family="sans-serif" font-size="14" fill="#2569a8" text-anchor="middle">水平風 V</text>

<line x1="148" y1="320" x2="148" y2="178" stroke="#5a6b78" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#aG)"/>
<line x1="148" y1="320" x2="173" y2="180" stroke="#5a6b78" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#aG)"/>
<line x1="148" y1="320" x2="123" y2="180" stroke="#5a6b78" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#aG)"/>
<text x="148" y="168" font-family="sans-serif" font-size="14" fill="#5a6b78" text-anchor="middle">真上</text>
<text x="181" y="178" font-family="sans-serif" font-size="14" fill="#5a6b78">北</text>
<text x="115" y="178" font-family="sans-serif" font-size="14" fill="#5a6b78" text-anchor="end">南</text>

<path d="M 148 264 A 56 56 0 0 1 158 265" fill="none" stroke="#5a6b78" stroke-width="1.5"/>
<line x1="190" y1="246" x2="166" y2="258" stroke="#5a6b78" stroke-width="1"/>
<text x="192" y="250" font-family="sans-serif" font-size="14" fill="#5a6b78">10°</text>

<line x1="30" y1="320" x2="262" y2="320" stroke="#1c2b36" stroke-width="2.5"/>
<polygon points="140,320 156,320 148,306" fill="#1c2b36"/>
<text x="148" y="340" font-family="sans-serif" font-size="14" fill="#1c2b36" text-anchor="middle">観測点</text>

<text x="32" y="360" font-family="sans-serif" font-size="14" fill="#1c2b36">真上の値=0 → 鉛直流なし</text>
<text x="32" y="382" font-family="sans-serif" font-size="14" fill="#1c2b36">斜めの値 = V × sin10°</text>

<text x="302" y="90" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1c2b36">② 時刻Aの風(上から)</text>

<line x1="415" y1="160" x2="415" y2="320" stroke="#dfe6ea" stroke-width="1.5"/>
<line x1="335" y1="240" x2="495" y2="240" stroke="#dfe6ea" stroke-width="1.5"/>
<text x="415" y="150" font-family="sans-serif" font-size="14" fill="#5a6b78" text-anchor="middle">北</text>
<text x="415" y="336" font-family="sans-serif" font-size="14" fill="#5a6b78" text-anchor="middle">南</text>
<text x="505" y="245" font-family="sans-serif" font-size="14" fill="#5a6b78">東</text>
<text x="325" y="245" font-family="sans-serif" font-size="14" fill="#5a6b78" text-anchor="end">西</text>

<line x1="415" y1="240" x2="415" y2="190" stroke="#2569a8" stroke-width="2.5" marker-end="url(#aB)"/>
<line x1="415" y1="240" x2="365" y2="240" stroke="#2569a8" stroke-width="2.5" marker-end="url(#aB)"/>
<text x="424" y="204" font-family="sans-serif" font-size="14" fill="#2569a8">北へ23.5</text>
<text x="360" y="262" font-family="sans-serif" font-size="14" fill="#2569a8" text-anchor="end">西へ23.5</text>

<line x1="415" y1="240" x2="365" y2="190" stroke="#f2a73b" stroke-width="3.5" marker-end="url(#aO)"/>
<text x="296" y="168" font-family="sans-serif" font-size="14" fill="#f2a73b">北西へ吹く</text>

<line x1="472" y1="297" x2="434" y2="259" stroke="#5a6b78" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#aG)"/>
<text x="478" y="308" font-family="sans-serif" font-size="14" fill="#5a6b78">南東から</text>

<text x="302" y="360" font-family="sans-serif" font-size="14" fill="#1c2b36">風向=吹いてくる方角 → 南東</text>
<text x="302" y="384" font-family="sans-serif" font-size="14" fill="#1c2b36">VA = 23.5×√2 ≒ 33m/s</text>
</svg>
