<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="380" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e0524d"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2569a8"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c2b36"/>
    </marker>
  </defs>

  <text x="20" y="32" font-family="sans-serif" font-size="18" fill="#1c2b36">前線の通過と風の層の広がり方</text>
  <text x="20" y="54" font-family="sans-serif" font-size="14" fill="#5a6b78">暖気は上から下へ、寒気は下から上へ</text>
  <text x="540" y="32" text-anchor="end" font-family="sans-serif" font-size="14" fill="#5a6b78">北半球</text>

  <rect x="20" y="66" width="250" height="244" fill="none" stroke="#5a6b78" stroke-width="1.5"/>
  <polygon points="22,100 268,100 268,206 120,282 22,282" fill="#e0524d" fill-opacity="0.12"/>
  <polygon points="120,282 268,206 268,282" fill="#2569a8" fill-opacity="0.18"/>
  <line x1="120" y1="282" x2="268" y2="206" stroke="#1c2b36" stroke-width="2.5"/>
  <line x1="22" y1="282" x2="268" y2="282" stroke="#1c2b36" stroke-width="3"/>
  <text x="145" y="90" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#e0524d">温暖前線</text>
  <text x="60" y="150" font-family="sans-serif" font-size="15" fill="#e0524d">暖気</text>
  <text x="170" y="278" font-family="sans-serif" font-size="15" fill="#2569a8">寒気</text>
  <text x="150" y="190" font-family="sans-serif" font-size="14" fill="#1c2b36">前線面</text>
  <line x1="200" y1="194" x2="218" y2="227" stroke="#5a6b78" stroke-width="1.5"/>
  <line x1="240" y1="112" x2="240" y2="282" stroke="#5a6b78" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="240" y="106" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5a6b78">観測点</text>
  <line x1="240" y1="158" x2="240" y2="214" stroke="#e0524d" stroke-width="3" marker-end="url(#ar)"/>
  <text x="30" y="300" font-family="sans-serif" font-size="14" fill="#5a6b78">地表</text>
  <text x="150" y="303" font-family="sans-serif" font-size="14" fill="#1c2b36">進行方向</text>
  <line x1="212" y1="298" x2="252" y2="298" stroke="#1c2b36" stroke-width="2" marker-end="url(#ad)"/>

  <rect x="290" y="66" width="250" height="244" fill="none" stroke="#5a6b78" stroke-width="1.5"/>
  <polygon points="292,100 538,100 538,282 400,282 292,157" fill="#e0524d" fill-opacity="0.12"/>
  <polygon points="400,282 292,157 292,282" fill="#2569a8" fill-opacity="0.18"/>
  <line x1="400" y1="282" x2="292" y2="157" stroke="#1c2b36" stroke-width="2.5"/>
  <line x1="292" y1="282" x2="538" y2="282" stroke="#1c2b36" stroke-width="3"/>
  <text x="415" y="90" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#2569a8">寒冷前線</text>
  <text x="310" y="250" font-family="sans-serif" font-size="15" fill="#2569a8">寒気</text>
  <text x="430" y="236" font-family="sans-serif" font-size="15" fill="#e0524d">暖気</text>
  <text x="350" y="140" font-family="sans-serif" font-size="14" fill="#1c2b36">前線面</text>
  <line x1="358" y1="146" x2="348" y2="212" stroke="#5a6b78" stroke-width="1.5"/>
  <line x1="490" y1="112" x2="490" y2="282" stroke="#5a6b78" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="490" y="106" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5a6b78">観測点</text>
  <line x1="490" y1="266" x2="490" y2="190" stroke="#2569a8" stroke-width="3" marker-end="url(#ab)"/>
  <text x="420" y="303" font-family="sans-serif" font-size="14" fill="#1c2b36">進行方向</text>
  <line x1="482" y1="298" x2="522" y2="298" stroke="#1c2b36" stroke-width="2" marker-end="url(#ad)"/>

  <text x="20" y="336" font-family="sans-serif" font-size="14" fill="#1c2b36">暖気(南より)は上空から下へ</text>
  <text x="290" y="336" font-family="sans-serif" font-size="14" fill="#1c2b36">寒気(北・西より)は地表から上へ</text>
  <text x="20" y="362" font-family="sans-serif" font-size="14" fill="#5a6b78">地表から南よりの風が入り上へ厚くなる見え方は温暖前線では起きない</text>
</svg>
