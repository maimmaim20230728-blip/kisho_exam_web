<svg viewBox="0 0 560 420" xmlns="http://www.w3.org/2000/svg">
<rect width="560" height="420" fill="#ffffff"/>
<defs>
<marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2569a8"/></marker>
<marker id="aO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f2a73b"/></marker>
<marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6b78"/></marker>
</defs>

<text x="24" y="32" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1c2b36">気象レーダーは何から何を知るか</text>

<rect x="18" y="52" width="172" height="210" rx="8" fill="none" stroke="#dfe6ea" stroke-width="1.5"/>
<rect x="194" y="52" width="172" height="210" rx="8" fill="none" stroke="#dfe6ea" stroke-width="1.5"/>
<rect x="370" y="52" width="172" height="210" rx="8" fill="none" stroke="#dfe6ea" stroke-width="1.5"/>

<text x="104" y="78" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1c2b36" text-anchor="middle">反射の強さ</text>
<line x1="48" y1="196" x2="48" y2="174" stroke="#1c2b36" stroke-width="2.5"/>
<path d="M 38 174 A 10 10 0 0 1 58 174" fill="#1c2b36"/>
<line x1="38" y1="196" x2="58" y2="196" stroke="#1c2b36" stroke-width="2.5"/>
<ellipse cx="128" cy="140" rx="6" ry="8" fill="#2569a8"/>
<ellipse cx="148" cy="160" rx="7" ry="9" fill="#2569a8"/>
<ellipse cx="124" cy="174" rx="5" ry="7" fill="#2569a8"/>
<line x1="62" y1="166" x2="110" y2="146" stroke="#5a6b78" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#aG)"/>
<line x1="112" y1="180" x2="64" y2="192" stroke="#2569a8" stroke-width="3.5" marker-end="url(#aB)"/>
<text x="104" y="226" font-family="sans-serif" font-size="14" fill="#1c2b36" text-anchor="middle">強く返る=雨が強い</text>
<text x="104" y="248" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2569a8" text-anchor="middle">→ 降水強度</text>

<text x="280" y="78" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1c2b36" text-anchor="middle">周波数のずれ</text>
<path d="M 212 140 q 9 -14 18 0 t 18 0 t 18 0 t 18 0" fill="none" stroke="#5a6b78" stroke-width="2"/>
<path d="M 212 180 q 6 -14 12 0 t 12 0 t 12 0 t 12 0 t 12 0 t 12 0" fill="none" stroke="#2569a8" stroke-width="2"/>
<ellipse cx="318" cy="152" rx="8" ry="10" fill="#2569a8"/>
<line x1="318" y1="196" x2="318" y2="172" stroke="#f2a73b" stroke-width="2.5" marker-end="url(#aO)"/>
<text x="280" y="226" font-family="sans-serif" font-size="14" fill="#1c2b36" text-anchor="middle">近づく・遠ざかる速さ</text>
<text x="280" y="248" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2569a8" text-anchor="middle">→ 風がわかる</text>

<text x="456" y="78" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1c2b36" text-anchor="middle">偏波の反射の比</text>
<ellipse cx="456" cy="160" rx="34" ry="18" fill="#2569a8" fill-opacity="0.25" stroke="#2569a8" stroke-width="2"/>
<line x1="456" y1="160" x2="504" y2="160" stroke="#f2a73b" stroke-width="2.5" marker-end="url(#aO)"/>
<line x1="456" y1="160" x2="408" y2="160" stroke="#f2a73b" stroke-width="2.5" marker-end="url(#aO)"/>
<line x1="456" y1="160" x2="456" y2="132" stroke="#5a6b78" stroke-width="2.5" marker-end="url(#aG)"/>
<line x1="456" y1="160" x2="456" y2="188" stroke="#5a6b78" stroke-width="2.5" marker-end="url(#aG)"/>
<text x="456" y="124" font-family="sans-serif" font-size="14" fill="#5a6b78" text-anchor="middle">垂直</text>
<text x="510" y="166" font-family="sans-serif" font-size="14" fill="#f2a73b">水平</text>
<text x="456" y="206" font-family="sans-serif" font-size="14" fill="#1c2b36" text-anchor="middle">つぶれた雨粒</text>
<text x="456" y="230" font-family="sans-serif" font-size="14" fill="#1c2b36" text-anchor="middle">粒の形がわかる</text>
<text x="456" y="252" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2569a8" text-anchor="middle">→ 雨か雪かひょうか</text>

<rect x="18" y="274" width="524" height="126" rx="8" fill="none" stroke="#dfe6ea" stroke-width="1.5"/>
<text x="32" y="298" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1c2b36">手前に強い雨があると奥は弱く見える(減衰)</text>
<line x1="56" y1="380" x2="56" y2="358" stroke="#1c2b36" stroke-width="2.5"/>
<path d="M 46 358 A 10 10 0 0 1 66 358" fill="#1c2b36"/>
<line x1="46" y1="380" x2="66" y2="380" stroke="#1c2b36" stroke-width="2.5"/>
<line x1="74" y1="368" x2="160" y2="368" stroke="#2569a8" stroke-width="4" marker-end="url(#aB)"/>
<text x="116" y="354" font-family="sans-serif" font-size="14" fill="#2569a8" text-anchor="middle">強い電波</text>
<rect x="168" y="326" width="70" height="66" fill="#2569a8" fill-opacity="0.35" stroke="#2569a8" stroke-width="1.5"/>
<text x="203" y="318" font-family="sans-serif" font-size="14" fill="#2569a8" text-anchor="middle">強い降水</text>
<line x1="244" y1="368" x2="310" y2="368" stroke="#2569a8" stroke-width="1.5" marker-end="url(#aB)"/>
<text x="277" y="354" font-family="sans-serif" font-size="14" fill="#5a6b78" text-anchor="middle">弱まる</text>
<rect x="318" y="340" width="56" height="52" fill="#2569a8" fill-opacity="0.18" stroke="#2569a8" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="346" y="332" font-family="sans-serif" font-size="14" fill="#5a6b78" text-anchor="middle">奥の降水</text>
<text x="392" y="362" font-family="sans-serif" font-size="14" fill="#1c2b36">エコーは実際より</text>
<text x="392" y="384" font-family="sans-serif" font-size="14" fill="#1c2b36">弱く観測される</text>
</svg>
