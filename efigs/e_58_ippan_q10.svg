<svg viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg">
<rect width="560" height="400" fill="#ffffff"/>
<defs>
<marker id="aB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2569a8"/></marker>
<marker id="aRL" markerUnits="userSpaceOnUse" markerWidth="17" markerHeight="17" refX="16" refY="8.5" orient="auto"><path d="M0,0 L17,8.5 L0,17 Z" fill="#e0524d"/></marker>
</defs>

<text x="20" y="35" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1c2b36">成層圏突然昇温のしくみ</text>

<rect x="20" y="46" width="312" height="326" rx="4" fill="#fbfcfd" stroke="#d7dee3" stroke-width="1.2"/>

<!-- 高度軸 -->
<text x="42" y="70" font-family="sans-serif" font-size="10.5" fill="#5a6b78" text-anchor="end">km</text>
<line x1="46" y1="76" x2="46" y2="344" stroke="#5a6b78" stroke-width="1.2"/>
<line x1="40" y1="344" x2="46" y2="344" stroke="#5a6b78" stroke-width="1"/>
<line x1="40" y1="238" x2="46" y2="238" stroke="#5a6b78" stroke-width="1"/>
<line x1="40" y1="133" x2="46" y2="133" stroke="#5a6b78" stroke-width="1"/>
<text x="36" y="348" font-family="sans-serif" font-size="10.5" fill="#5a6b78" text-anchor="end">0</text>
<text x="36" y="242" font-family="sans-serif" font-size="10.5" fill="#5a6b78" text-anchor="end">20</text>
<text x="36" y="137" font-family="sans-serif" font-size="10.5" fill="#5a6b78" text-anchor="end">40</text>

<!-- 地表と山 -->
<line x1="46" y1="344" x2="320" y2="344" stroke="#1c2b36" stroke-width="2"/>
<path d="M62,344 L92,304 L122,344 Z" fill="#d9d2c6"/>
<path d="M132,344 L154,320 L176,344 Z" fill="#d9d2c6"/>
<line x1="46" y1="286" x2="320" y2="286" stroke="#5a6b78" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="318" y="280" font-family="sans-serif" font-size="10.5" fill="#5a6b78" text-anchor="end">対流圏界面</text>
<text x="200" y="332" font-family="sans-serif" font-size="11.5" fill="#5a6b78">対流圏</text>
<text x="52" y="68" font-family="sans-serif" font-size="11.5" fill="#5a6b78">冬の北半球</text>
<text x="52" y="200" font-family="sans-serif" font-size="11.5" fill="#5a6b78">成層圏</text>
<text x="80" y="364" font-family="sans-serif" font-size="11.5" fill="#5a6b78" text-anchor="middle">中緯度</text>
<text x="306" y="364" font-family="sans-serif" font-size="11.5" fill="#5a6b78" text-anchor="middle">極</text>

<!-- プラネタリー波 -->
<path d="M94,302 C120,286 124,264 110,248 C96,232 112,214 146,208 C182,202 200,190 210,172" fill="none" stroke="#2569a8" stroke-width="2.5" marker-end="url(#aB)"/>

<!-- 極夜ジェット -->
<rect x="176" y="132" width="118" height="30" rx="15" fill="#e8f0f7" stroke="#2569a8" stroke-width="1.5"/>
<text x="235" y="152" font-family="sans-serif" font-size="11" fill="#1c2b36" text-anchor="middle">西風(極夜ジェット)</text>
<text x="235" y="124" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e0524d" text-anchor="middle">減速</text>

<!-- 下降流 -->
<line x1="286" y1="176" x2="286" y2="258" stroke="#e0524d" stroke-width="5" marker-end="url(#aRL)"/>
<text x="278" y="196" font-family="sans-serif" font-size="11.5" fill="#e0524d" text-anchor="end">極域で下降流</text>
<text x="278" y="230" font-family="sans-serif" font-size="11.5" fill="#e0524d" text-anchor="end">断熱圧縮で</text>
<text x="278" y="248" font-family="sans-serif" font-size="11.5" fill="#e0524d" text-anchor="end">気温が上がる</text>

<!-- 番号バッジ -->
<circle cx="72" cy="300" r="10" fill="#2569a8"/>
<text x="72" y="304" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<circle cx="152" cy="178" r="10" fill="#2569a8"/>
<text x="152" y="182" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<circle cx="314" cy="180" r="10" fill="#2569a8"/>
<text x="314" y="184" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<circle cx="314" cy="256" r="10" fill="#2569a8"/>
<text x="314" y="260" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>

<!-- 右パネル 手順 -->
<text x="348" y="64" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1c2b36">起こる順番</text>
<line x1="357" y1="97" x2="357" y2="129" stroke="#d7dee3" stroke-width="1.5"/>
<line x1="357" y1="151" x2="357" y2="183" stroke="#d7dee3" stroke-width="1.5"/>
<line x1="357" y1="205" x2="357" y2="217" stroke="#d7dee3" stroke-width="1.5"/>

<circle cx="357" cy="84" r="9" fill="#2569a8"/>
<text x="357" y="88" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="372" y="88" font-family="sans-serif" font-size="12" fill="#1c2b36">対流圏の山や海陸分布が</text>
<text x="372" y="106" font-family="sans-serif" font-size="12" fill="#1c2b36">つくる波が上へ伝わる</text>

<circle cx="357" cy="138" r="9" fill="#2569a8"/>
<text x="357" y="142" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="372" y="142" font-family="sans-serif" font-size="12" fill="#1c2b36">成層圏まで届いた波が砕け</text>
<text x="372" y="160" font-family="sans-serif" font-size="12" fill="#1c2b36">西風(極夜ジェット)を減速</text>

<circle cx="357" cy="192" r="9" fill="#2569a8"/>
<text x="357" y="196" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="372" y="196" font-family="sans-serif" font-size="12" fill="#1c2b36">極域に下降流が生じる</text>

<circle cx="357" cy="226" r="9" fill="#2569a8"/>
<text x="357" y="230" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="372" y="230" font-family="sans-serif" font-size="12" fill="#1c2b36">断熱圧縮で気温が上がる</text>
<text x="372" y="248" font-family="sans-serif" font-size="12" fill="#1c2b36">(数日で数十℃)</text>

<rect x="348" y="272" width="192" height="76" rx="4" fill="#fdf6ea" stroke="#f2a73b" stroke-width="1.2"/>
<text x="358" y="294" font-family="sans-serif" font-size="12" fill="#1c2b36">※ 減速も昇温も上層から</text>
<text x="358" y="312" font-family="sans-serif" font-size="12" fill="#1c2b36">始まり、日がたつにつれて</text>
<text x="358" y="330" font-family="sans-serif" font-size="12" fill="#1c2b36">下の高度へ降りてくる</text>
</svg>
