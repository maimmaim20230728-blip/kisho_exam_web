<svg viewBox="0 0 560 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="420" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 z" fill="#2569a8"/>
    </marker>
    <marker id="ao" viewBox="0 0 12 10" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 z" fill="#f2a73b"/>
    </marker>
  </defs>

  <text x="20" y="30" font-family="sans-serif" font-size="19" fill="#1c2b36">図: ウォーカー循環 平常時とエルニーニョ時</text>

  <!-- 上段: 平常時 -->
  <text x="20" y="62" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1c2b36">① 平常時</text>
  <path d="M152 162 L152 116 C152 86 212 78 234 96 C244 104 246 110 244 122 L244 162 Z" fill="#e3e9ec" stroke="#5a6b78" stroke-width="1.5"/>
  <text x="180" y="136" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="middle">積乱雲</text>
  <line x1="218" y1="158" x2="218" y2="92" stroke="#2569a8" stroke-width="3" marker-end="url(#ab)"/>
  <line x1="230" y1="84" x2="396" y2="84" stroke="#2569a8" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="312" y="100" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="middle">上空は東へ</text>
  <line x1="410" y1="92" x2="410" y2="148" stroke="#2569a8" stroke-width="3" marker-end="url(#ab)"/>
  <text x="438" y="122" font-family="sans-serif" font-size="13" fill="#5a6b78">下降</text>
  <line x1="396" y1="156" x2="254" y2="156" stroke="#f2a73b" stroke-width="3.5" marker-end="url(#ao)"/>
  <text x="325" y="146" font-family="sans-serif" font-size="13" fill="#f2a73b" text-anchor="middle">東風が強い</text>
  <text x="46" y="158" font-family="sans-serif" font-size="13" fill="#5a6b78">西部太平洋</text>
  <text x="514" y="158" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="end">東部太平洋</text>
  <rect x="40" y="166" width="480" height="26" fill="#d7e6f2"/>
  <path d="M40 166 L40 190 C150 188 280 176 520 170 L520 166 Z" fill="#f2b4b0"/>
  <line x1="40" y1="166" x2="520" y2="166" stroke="#1c2b36" stroke-width="2"/>
  <text x="100" y="184" font-family="sans-serif" font-size="13" fill="#b03b36" text-anchor="middle">暖かい海水</text>
  <text x="110" y="210" font-family="sans-serif" font-size="14" text-anchor="middle"><tspan fill="#1c2b36">ダーウィン </tspan><tspan fill="#2569a8">気圧 低</tspan></text>
  <text x="430" y="210" font-family="sans-serif" font-size="14" text-anchor="middle"><tspan fill="#1c2b36">タヒチ </tspan><tspan fill="#e0524d">気圧 高</tspan></text>

  <line x1="20" y1="224" x2="540" y2="224" stroke="#dce3e8" stroke-width="1"/>

  <!-- 下段: エルニーニョ時 -->
  <text x="20" y="248" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1c2b36">② エルニーニョ現象時</text>
  <path d="M296 348 L296 302 C296 272 356 264 378 282 C388 290 390 296 388 308 L388 348 Z" fill="#e3e9ec" stroke="#5a6b78" stroke-width="1.5"/>
  <text x="324" y="322" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="middle">積乱雲</text>
  <line x1="362" y1="344" x2="362" y2="278" stroke="#2569a8" stroke-width="3" marker-end="url(#ab)"/>
  <line x1="344" y1="266" x2="200" y2="266" stroke="#2569a8" stroke-width="2.5" marker-end="url(#ab)"/>
  <text x="258" y="284" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="middle">上空は西へ</text>
  <line x1="178" y1="284" x2="178" y2="340" stroke="#2569a8" stroke-width="3" marker-end="url(#ab)"/>
  <text x="150" y="314" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="end">下降＝少雨</text>
  <line x1="200" y1="340" x2="280" y2="340" stroke="#f2a73b" stroke-width="2" marker-end="url(#ao)"/>
  <text x="240" y="330" font-family="sans-serif" font-size="13" fill="#f2a73b" text-anchor="middle">下層は東向き</text>
  <line x1="490" y1="316" x2="420" y2="316" stroke="#f2a73b" stroke-width="2" marker-end="url(#ao)"/>
  <text x="455" y="304" font-family="sans-serif" font-size="13" fill="#f2a73b" text-anchor="middle">東風が弱まる</text>
  <text x="46" y="344" font-family="sans-serif" font-size="13" fill="#5a6b78">西部太平洋</text>
  <text x="514" y="344" font-family="sans-serif" font-size="13" fill="#5a6b78" text-anchor="end">東部太平洋</text>
  <rect x="40" y="352" width="480" height="26" fill="#d7e6f2"/>
  <path d="M40 352 L40 357 C160 366 300 374 520 374 L520 352 Z" fill="#f2b4b0"/>
  <line x1="40" y1="352" x2="520" y2="352" stroke="#1c2b36" stroke-width="2"/>
  <text x="400" y="370" font-family="sans-serif" font-size="13" fill="#b03b36" text-anchor="middle">暖かい海水が東へ</text>
  <text x="110" y="396" font-family="sans-serif" font-size="14" text-anchor="middle"><tspan fill="#1c2b36">ダーウィン </tspan><tspan fill="#e0524d">気圧 高</tspan></text>
  <text x="430" y="396" font-family="sans-serif" font-size="14" text-anchor="middle"><tspan fill="#1c2b36">タヒチ </tspan><tspan fill="#2569a8">気圧 低</tspan></text>
</svg>
