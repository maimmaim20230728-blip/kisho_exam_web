<svg viewBox="0 0 560 410" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="410" fill="#ffffff"/>
  <defs>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2569a8"/>
    </marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6b78"/>
    </marker>
  </defs>

  <text x="24" y="30" font-family="sans-serif" font-size="19" fill="#1c2b36">未飽和で下るとき、混合比はそのまま気温だけ上がる</text>

  <rect x="24" y="46" width="512" height="36" rx="6" fill="#f2a73b" opacity="0.16"/>
  <rect x="24" y="46" width="512" height="36" rx="6" fill="none" stroke="#f2a73b" stroke-width="1.5"/>
  <text x="280" y="70" font-family="sans-serif" font-size="16" fill="#1c2b36" text-anchor="middle">山頂もふもとも 混合比 10.4 g/kg のまま</text>

  <text x="280" y="106" font-family="sans-serif" font-size="15" fill="#1c2b36" text-anchor="middle">山頂 標高1000m・900hPa</text>
  <text x="280" y="128" font-family="sans-serif" font-size="15" fill="#15a35a" text-anchor="middle">気温 20℃ ／ 湿度 66%</text>

  <polygon points="70,340 280,150 490,340" fill="#5a6b78" opacity="0.15"/>
  <polygon points="70,340 280,150 490,340" fill="none" stroke="#5a6b78" stroke-width="1.5"/>
  <line x1="24" y1="340" x2="536" y2="340" stroke="#1c2b36" stroke-width="2"/>
  <circle cx="280" cy="150" r="5" fill="#1c2b36"/>

  <line x1="96" y1="318" x2="240" y2="188" stroke="#5a6b78" stroke-width="2" marker-end="url(#mg)"/>
  <text x="60" y="282" font-family="sans-serif" font-size="14" fill="#5a6b78">上昇</text>

  <line x1="312" y1="155" x2="467" y2="295" stroke="#2569a8" stroke-width="3" marker-end="url(#mb)"/>
  <text x="530" y="160" font-family="sans-serif" font-size="15" fill="#2569a8" text-anchor="end">下降 1000m</text>
  <text x="530" y="182" font-family="sans-serif" font-size="15" fill="#2569a8" text-anchor="end">乾燥断熱で 気温 +10℃</text>

  <text x="536" y="368" font-family="sans-serif" font-size="15" fill="#1c2b36" text-anchor="end">ふもと 標高0m・1000hPa</text>
  <text x="536" y="392" font-family="sans-serif" font-size="15" fill="#1c2b36" text-anchor="end">気温 30℃ ／ 湿度 40%</text>

  <text x="24" y="368" font-family="sans-serif" font-size="14" fill="#5a6b78">計算① ふもとの水蒸気圧 42×0.40 = 16.8 hPa</text>
  <text x="24" y="392" font-family="sans-serif" font-size="14" fill="#5a6b78">計算② 山頂の湿度 15.1 ÷ 23 ≒ 0.66</text>
</svg>
