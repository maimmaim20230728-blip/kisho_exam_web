<svg viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2569a8"/>
    </marker>
  </defs>
  <g font-family="sans-serif">
    <text x="24" y="30" font-size="18" fill="#1c2b36">雲ができ始める高さと、自力で上がり始める高さ</text>

    <!-- 凡例 -->
    <line x1="24" y1="49" x2="52" y2="49" stroke="#5a6b78" stroke-width="2"/>
    <text x="58" y="54" font-size="14" fill="#1c2b36">周囲の大気(条件付き不安定)</text>
    <line x1="274" y1="49" x2="302" y2="49" stroke="#2569a8" stroke-width="3"/>
    <text x="308" y="54" font-size="14" fill="#1c2b36">空気塊(乾燥断熱→湿潤断熱)</text>

    <text x="100" y="76" font-size="14" fill="#5a6b78">高度(km)</text>

    <!-- 浮力の帯 -->
    <rect x="70" y="80" width="270" height="115" fill="#fdf0da"/>
    <rect x="70" y="195" width="270" height="69" fill="#eaf2f9"/>
    <rect x="70" y="264" width="270" height="46" fill="#f2f4f6"/>

    <!-- 高度の目安 -->
    <line x1="70" y1="195" x2="344" y2="195" stroke="#f2a73b" stroke-width="2.5" stroke-dasharray="7 5"/>
    <line x1="70" y1="264" x2="344" y2="264" stroke="#5a6b78" stroke-width="2" stroke-dasharray="6 5"/>

    <!-- 周囲の大気 -->
    <line x1="300" y1="310" x2="90" y2="80" stroke="#5a6b78" stroke-width="2"/>
    <!-- 空気塊: 乾燥断熱 -->
    <line x1="300" y1="310" x2="246" y2="269" stroke="#2569a8" stroke-width="3" marker-end="url(#arB)"/>
    <!-- 空気塊: 湿潤断熱 -->
    <line x1="240" y1="264" x2="124" y2="86" stroke="#2569a8" stroke-width="3" marker-end="url(#arB)"/>

    <circle cx="240" cy="264" r="5" fill="#5a6b78"/>
    <circle cx="195" cy="195" r="6" fill="#f2a73b" stroke="#1c2b36" stroke-width="1.5"/>

    <!-- 軸 -->
    <line x1="70" y1="80" x2="70" y2="310" stroke="#1c2b36" stroke-width="2"/>
    <line x1="70" y1="310" x2="340" y2="310" stroke="#1c2b36" stroke-width="2"/>
    <line x1="64" y1="80" x2="70" y2="80" stroke="#1c2b36" stroke-width="1.5"/>
    <line x1="64" y1="126" x2="70" y2="126" stroke="#1c2b36" stroke-width="1.5"/>
    <line x1="64" y1="172" x2="70" y2="172" stroke="#1c2b36" stroke-width="1.5"/>
    <line x1="64" y1="218" x2="70" y2="218" stroke="#1c2b36" stroke-width="1.5"/>
    <line x1="64" y1="264" x2="70" y2="264" stroke="#1c2b36" stroke-width="1.5"/>

    <text x="60" y="85" font-size="14" fill="#1c2b36" text-anchor="end">5</text>
    <text x="60" y="131" font-size="14" fill="#1c2b36" text-anchor="end">4</text>
    <text x="60" y="177" font-size="14" fill="#1c2b36" text-anchor="end">3</text>
    <text x="60" y="223" font-size="14" fill="#1c2b36" text-anchor="end">2</text>
    <text x="60" y="269" font-size="14" fill="#1c2b36" text-anchor="end">1</text>
    <text x="60" y="315" font-size="14" fill="#1c2b36" text-anchor="end">0</text>

    <text x="80" y="160" font-size="14" fill="#1c2b36">自力で上昇</text>
    <text x="80" y="232" font-size="14" fill="#1c2b36">押し上げが必要</text>
    <text x="80" y="292" font-size="14" fill="#1c2b36">雲はまだできない</text>

    <text x="200" y="326" font-size="14" fill="#5a6b78" text-anchor="middle">気温 →(右ほど高い)</text>

    <!-- 右側の説明 -->
    <text x="350" y="106" font-size="14" fill="#1c2b36">ここより上では</text>
    <text x="350" y="126" font-size="14" fill="#1c2b36">周囲より暖かく、</text>
    <text x="350" y="146" font-size="14" fill="#1c2b36">浮力で自力上昇。</text>
    <text x="350" y="166" font-size="14" fill="#1c2b36">→ 積乱雲に発達</text>

    <text x="350" y="191" font-size="14" fill="#1c2b36">自由対流高度</text>
    <text x="350" y="213" font-size="14" fill="#5a6b78">= 自力で上がり始める高さ</text>

    <text x="350" y="258" font-size="14" fill="#1c2b36">持ち上げ凝結高度</text>
    <text x="350" y="280" font-size="14" fill="#5a6b78">= 雲ができ始める高さ</text>

    <rect x="16" y="336" width="528" height="56" rx="6" fill="#f7f9fa"/>
    <text x="24" y="358" font-size="14" fill="#1c2b36">持ち上げ凝結高度に達しただけでは、まだ自力で上昇できない。</text>
    <text x="24" y="380" font-size="14" fill="#1c2b36">さらに押し上げられて自由対流高度を越えて、はじめて自力で上昇する。</text>
  </g>
</svg>
