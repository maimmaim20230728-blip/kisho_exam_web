<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="360" fill="#ffffff"/>

  <text x="24" y="32" font-family="sans-serif" font-size="19" fill="#1c2b36">成層圏の上のほうは 夏の極が最も暖かい</text>
  <text x="24" y="54" font-family="sans-serif" font-size="14" fill="#5a6b78">高度30〜50km付近。地上の感覚とは逆になる</text>
  <text x="544" y="32" text-anchor="end" font-family="sans-serif" font-size="13" fill="#5a6b78">北半球</text>

  <text x="150" y="84" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c2b36">7月（夏の北極・白夜）</text>
  <text x="410" y="84" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1c2b36">1月（冬の北極・極夜）</text>

  <circle cx="150" cy="170" r="74" fill="#fdf6ea" stroke="#1c2b36" stroke-width="1.5"/>
  <circle cx="150" cy="170" r="55" fill="none" stroke="#5a6b78" stroke-width="1.5"/>
  <circle cx="150" cy="170" r="36" fill="none" stroke="#5a6b78" stroke-width="1.5"/>
  <text x="150" y="166" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#e0524d">高</text>
  <text x="150" y="192" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1c2b36">最も高温</text>

  <circle cx="62" cy="112" r="11" fill="#f2a73b"/>
  <line x1="76" y1="112" x2="82" y2="112" stroke="#f2a73b" stroke-width="2.5"/>
  <line x1="71.9" y1="102.1" x2="76.1" y2="97.9" stroke="#f2a73b" stroke-width="2.5"/>
  <line x1="62" y1="98" x2="62" y2="92" stroke="#f2a73b" stroke-width="2.5"/>
  <line x1="52.1" y1="102.1" x2="47.9" y2="97.9" stroke="#f2a73b" stroke-width="2.5"/>
  <line x1="48" y1="112" x2="42" y2="112" stroke="#f2a73b" stroke-width="2.5"/>
  <line x1="52.1" y1="121.9" x2="47.9" y2="126.1" stroke="#f2a73b" stroke-width="2.5"/>
  <line x1="62" y1="126" x2="62" y2="132" stroke="#f2a73b" stroke-width="2.5"/>
  <line x1="71.9" y1="121.9" x2="76.1" y2="126.1" stroke="#f2a73b" stroke-width="2.5"/>

  <circle cx="410" cy="170" r="74" fill="#eef4f9" stroke="#1c2b36" stroke-width="1.5"/>
  <g transform="translate(9,-13) translate(410,170) scale(0.8) translate(-410,-170)">
    <path d="M460,170 C462,142 456,124 442,115 C422,104 392,110 384,126 C374,144 340,150 344,170 C346,196 360,222 377,227 C398,233 430,226 434,208 C442,192 458,190 460,170 Z" fill="none" stroke="#5a6b78" stroke-width="1.88"/>
    <path d="M447,170 C449,148 446,138 434,129 C419,121 397,126 390,137 C383,150 358,155 360,170 C363,184 382,188 393,198 C402,207 424,213 428,200 C433,190 445,187 447,170 Z" fill="none" stroke="#5a6b78" stroke-width="1.88"/>
  </g>
  <text x="420" y="153" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#2569a8">低</text>
  <text x="420" y="171" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1c2b36">極渦</text>

  <ellipse cx="372" cy="211" rx="15" ry="10" fill="none" stroke="#5a6b78" stroke-width="1.5"/>
  <text x="372" y="216" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#e0524d">高</text>
  <text x="332" y="216" text-anchor="end" font-family="sans-serif" font-size="11" fill="#e0524d">アリューシャン</text>
  <line x1="336" y1="214" x2="352" y2="212" stroke="#e0524d" stroke-width="1.2"/>

  <text x="150" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1c2b36">オゾンが紫外線を吸収して暖まる</text>
  <text x="150" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1c2b36">→ 全球で最も高温・高気圧</text>
  <text x="150" y="322" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5a6b78">等高度線は同心円状</text>

  <text x="410" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1c2b36">太陽が当たらず冷える</text>
  <text x="410" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1c2b36">→ 最も低温・低気圧（極渦）</text>
  <text x="410" y="322" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5a6b78">アリューシャン付近に高気圧</text>
</svg>
