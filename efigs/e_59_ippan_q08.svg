<svg viewBox="0 0 560 410" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<rect width="560" height="410" fill="#ffffff"/>
<defs>
<marker id="q8r" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#e0524d"/></marker>
<marker id="q8b" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2569a8"/></marker>
</defs>

<text x="28" y="32" font-size="17" font-weight="bold" fill="#1c2b36">発達中の温帯低気圧: 谷の軸は上空ほど西に傾く</text>

<text x="20" y="112" font-size="12" fill="#5a6b78">上空</text>
<text x="20" y="302" font-size="12" fill="#5a6b78">地上</text>

<!-- 地表 -->
<rect x="60" y="306" width="470" height="9" fill="#e8ecef"/>
<line x1="60" y1="306" x2="530" y2="306" stroke="#1c2b36" stroke-width="2"/>
<text x="74" y="298" font-size="13" fill="#5a6b78">西</text>
<text x="522" y="298" font-size="13" fill="#5a6b78" text-anchor="end">東</text>

<!-- 気圧の谷の軸 -->
<line x1="280" y1="306" x2="196" y2="92" stroke="#1c2b36" stroke-width="3"/>
<text x="196" y="80" font-size="13" font-weight="bold" fill="#1c2b36" text-anchor="middle">気圧の谷の軸</text>
<text x="252" y="200" font-size="13" fill="#f2a73b">上空ほど西へ傾く</text>

<!-- 寒気の下降 -->
<text x="136" y="110" font-size="13" fill="#2569a8" text-anchor="middle">寒気の下降</text>
<text x="136" y="128" font-size="12" fill="#5a6b78" text-anchor="middle">(重い空気が下がる)</text>
<line x1="136" y1="140" x2="106" y2="290" stroke="#2569a8" stroke-width="3" marker-end="url(#q8b)"/>

<!-- 暖気の上昇 -->
<line x1="352" y1="296" x2="404" y2="140" stroke="#e0524d" stroke-width="3" marker-end="url(#q8r)"/>
<text x="414" y="168" font-size="13" fill="#e0524d">暖気の上昇</text>
<text x="414" y="186" font-size="12" fill="#5a6b78">(軽い空気が上がる)</text>

<!-- 地上低気圧 -->
<circle cx="280" cy="306" r="6" fill="#1c2b36"/>
<text x="280" y="336" font-size="13" fill="#1c2b36" text-anchor="middle">地上低気圧の中心</text>

<!-- 下部の要点 -->
<line x1="24" y1="350" x2="536" y2="350" stroke="#dde4e9" stroke-width="1"/>
<text x="24" y="370" font-size="13" fill="#1c2b36">谷の軸が西に傾くため、地上低気圧の東側に上昇流が生まれて発達する。</text>
<text x="24" y="392" font-size="13" fill="#1c2b36">暖気が上がり寒気が下がると重心が下がり、有効位置エネルギーは減少する。</text>
</svg>
