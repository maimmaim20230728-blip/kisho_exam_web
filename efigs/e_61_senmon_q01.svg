<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="560" height="360" fill="#ffffff"/>
  <defs>
    <marker id="q01arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2569a8"/>
    </marker>
    <marker id="q01arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6b78"/>
    </marker>
  </defs>

  <text x="280" y="30" font-size="19" font-weight="bold" fill="#1c2b36" text-anchor="middle">直達日射と全天日射のちがい</text>

  <!-- 左:直達日射 -->
  <rect x="20" y="48" width="250" height="240" fill="none" stroke="#5a6b78" stroke-width="1"/>
  <text x="145" y="72" font-size="16" font-weight="bold" fill="#2569a8" text-anchor="middle">直達日射量</text>

  <circle cx="65" cy="115" r="13" fill="#f2a73b"/>
  <line x1="65" y1="97" x2="65" y2="90" stroke="#f2a73b" stroke-width="2"/>
  <line x1="47" y1="115" x2="40" y2="115" stroke="#f2a73b" stroke-width="2"/>
  <line x1="53" y1="103" x2="48" y2="98" stroke="#f2a73b" stroke-width="2"/>
  <line x1="53" y1="127" x2="48" y2="132" stroke="#f2a73b" stroke-width="2"/>
  <line x1="65" y1="133" x2="65" y2="140" stroke="#f2a73b" stroke-width="2"/>

  <line x1="88" y1="108" x2="178" y2="198" stroke="#2569a8" stroke-width="2.5" marker-end="url(#q01arB)"/>
  <line x1="101" y1="95" x2="191" y2="185" stroke="#2569a8" stroke-width="2.5" marker-end="url(#q01arB)"/>
  <line x1="75" y1="121" x2="165" y2="211" stroke="#2569a8" stroke-width="2.5" marker-end="url(#q01arB)"/>

  <line x1="157" y1="223" x2="203" y2="177" stroke="#1c2b36" stroke-width="5" stroke-linecap="round"/>
  <text x="180" y="252" font-size="14" fill="#1c2b36" text-anchor="middle">太陽光線に垂直な面</text>
  <text x="145" y="275" font-size="14" fill="#5a6b78" text-anchor="middle">散乱した光は含めない</text>

  <!-- 右:全天日射 -->
  <rect x="290" y="48" width="250" height="240" fill="none" stroke="#5a6b78" stroke-width="1"/>
  <text x="415" y="72" font-size="16" font-weight="bold" fill="#2569a8" text-anchor="middle">全天日射量</text>

  <circle cx="330" cy="112" r="13" fill="#f2a73b"/>
  <line x1="330" y1="94" x2="330" y2="87" stroke="#f2a73b" stroke-width="2"/>
  <line x1="312" y1="112" x2="305" y2="112" stroke="#f2a73b" stroke-width="2"/>
  <line x1="318" y1="100" x2="313" y2="95" stroke="#f2a73b" stroke-width="2"/>
  <line x1="318" y1="124" x2="313" y2="129" stroke="#f2a73b" stroke-width="2"/>

  <line x1="352" y1="134" x2="437" y2="219" stroke="#2569a8" stroke-width="2.5" marker-end="url(#q01arB)"/>

  <circle cx="312" cy="168" r="3" fill="#5a6b78"/>
  <circle cx="508" cy="120" r="3" fill="#5a6b78"/>
  <circle cx="516" cy="178" r="3" fill="#5a6b78"/>
  <line x1="315" y1="171" x2="410" y2="219" stroke="#5a6b78" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#q01arG)"/>
  <line x1="505" y1="124" x2="453" y2="219" stroke="#5a6b78" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#q01arG)"/>
  <line x1="513" y1="181" x2="468" y2="219" stroke="#5a6b78" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#q01arG)"/>

  <line x1="385" y1="222" x2="475" y2="222" stroke="#1c2b36" stroke-width="5" stroke-linecap="round"/>
  <text x="430" y="246" font-size="14" fill="#1c2b36" text-anchor="middle">水平面</text>
  <text x="415" y="275" font-size="14" fill="#5a6b78" text-anchor="middle">直達 + 散乱 の合計</text>

  <!-- 凡例 -->
  <line x1="40" y1="308" x2="70" y2="308" stroke="#2569a8" stroke-width="2.5" marker-end="url(#q01arB)"/>
  <text x="84" y="313" font-size="13" fill="#1c2b36">直達(直射の光)</text>
  <line x1="232" y1="308" x2="262" y2="308" stroke="#5a6b78" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#q01arG)"/>
  <text x="276" y="313" font-size="13" fill="#1c2b36">散乱(空気やちりで散った光)</text>

  <text x="280" y="344" font-size="14" font-weight="bold" fill="#f2a73b" text-anchor="middle">大気混濁係数は直達日射量から算出する</text>
</svg>
