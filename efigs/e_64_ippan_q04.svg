<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect width="560" height="380" fill="#ffffff"/>
  <defs>
    <marker id="a4k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c2b36"/>
    </marker>
    <marker id="a4g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6b78"/>
    </marker>
  </defs>

  <text x="16" y="30" font-size="18" font-weight="bold" fill="#1c2b36">図: 氷粒子と過冷却水滴が共存する雲の中</text>

  <!-- 水蒸気圧の目盛 -->
  <text x="84" y="116" font-size="14" fill="#1c2b36" text-anchor="end">水蒸気圧</text>
  <line x1="90" y1="110" x2="516" y2="110" stroke="#1c2b36" stroke-width="2" marker-end="url(#a4k)"/>
  <line x1="190" y1="102" x2="190" y2="118" stroke="#2569a8" stroke-width="3"/>
  <line x1="290" y1="102" x2="290" y2="118" stroke="#1c2b36" stroke-width="3"/>
  <line x1="400" y1="102" x2="400" y2="118" stroke="#e0524d" stroke-width="3"/>
  <text x="290" y="94" font-size="14" fill="#1c2b36" text-anchor="middle">実際の水蒸気圧</text>
  <text x="190" y="136" font-size="14" fill="#2569a8" text-anchor="middle">氷面に対する飽和</text>
  <text x="400" y="136" font-size="14" fill="#e0524d" text-anchor="middle">水面に対する飽和</text>

  <!-- はさみ線 -->
  <path d="M190,148 L190,158 L286,158 L286,148" fill="none" stroke="#2569a8" stroke-width="2"/>
  <path d="M294,148 L294,158 L400,158 L400,148" fill="none" stroke="#e0524d" stroke-width="2"/>
  <text x="238" y="178" font-size="14" fill="#2569a8" text-anchor="middle">氷には過飽和</text>
  <text x="347" y="178" font-size="14" fill="#e0524d" text-anchor="middle">水滴には未飽和</text>

  <text x="280" y="206" font-size="14" fill="#1c2b36" text-anchor="middle">水滴が蒸発し、その水蒸気が氷粒子に昇華凝結して氷が育つ</text>

  <!-- 雲の中の様子 -->
  <text x="280" y="240" font-size="14" fill="#5a6b78" text-anchor="middle">0℃以下の雲の中</text>

  <circle cx="135" cy="288" r="22" fill="none" stroke="#5a6b78" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="135" cy="288" r="15" fill="#cfe0ee" stroke="#2569a8" stroke-width="2"/>
  <circle cx="190" cy="278" r="10" fill="#cfe0ee" stroke="#2569a8" stroke-width="2"/>

  <line x1="215" y1="278" x2="378" y2="278" stroke="#5a6b78" stroke-width="2.5" marker-end="url(#a4g)"/>
  <text x="296" y="266" font-size="14" fill="#5a6b78" text-anchor="middle">水蒸気</text>

  <g stroke="#f2a73b" stroke-width="3" stroke-linecap="round">
    <line x1="392" y1="282" x2="448" y2="282"/>
    <line x1="406" y1="257.8" x2="434" y2="306.2"/>
    <line x1="434" y1="257.8" x2="406" y2="306.2"/>
    <line x1="440" y1="282" x2="446" y2="273"/>
    <line x1="440" y1="282" x2="446" y2="291"/>
    <line x1="400" y1="282" x2="394" y2="273"/>
    <line x1="400" y1="282" x2="394" y2="291"/>
    <line x1="430" y1="264.8" x2="437" y2="263"/>
    <line x1="410" y1="299.2" x2="403" y2="301"/>
    <line x1="410" y1="264.8" x2="403" y2="263"/>
    <line x1="430" y1="299.2" x2="437" y2="301"/>
  </g>

  <text x="165" y="330" font-size="14" fill="#1c2b36" text-anchor="middle">過冷却水滴(蒸発して縮む)</text>
  <text x="420" y="330" font-size="14" fill="#1c2b36" text-anchor="middle">氷粒子(昇華凝結で育つ)</text>

  <text x="280" y="360" font-size="14" fill="#1c2b36" text-anchor="middle">これが氷晶過程(ベルジェロン過程)。中緯度の雨のおもな仕組み</text>
</svg>
