<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg">
  <rect width="560" height="380" fill="#ffffff"/>
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c2b36"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2a73b"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2569a8"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e0524d"/>
    </marker>
  </defs>

  <text x="20" y="32" font-family="sans-serif" font-size="18" fill="#1c2b36">低気圧性の渦とドップラー速度の見え方</text>
  <text x="20" y="54" font-family="sans-serif" font-size="14" fill="#5a6b78">レーダーは南西、渦は北東にある</text>
  <text x="540" y="32" text-anchor="end" font-family="sans-serif" font-size="14" fill="#5a6b78">北半球</text>

  <circle cx="500" cy="110" r="24" fill="none" stroke="#5a6b78" stroke-width="1.5"/>
  <line x1="500" y1="130" x2="500" y2="92" stroke="#1c2b36" stroke-width="2" marker-end="url(#ad)"/>
  <text x="500" y="82" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1c2b36">北</text>
  <text x="528" y="115" font-family="sans-serif" font-size="14" fill="#5a6b78">東</text>

  <line x1="250" y1="98" x2="350" y2="242" stroke="#5a6b78" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>

  <ellipse cx="269" cy="125" rx="44" ry="26" transform="rotate(-35 269 125)" fill="#2569a8" fill-opacity="0.20" stroke="#2569a8" stroke-width="2"/>
  <ellipse cx="331" cy="215" rx="44" ry="26" transform="rotate(-35 331 215)" fill="#e0524d" fill-opacity="0.20" stroke="#e0524d" stroke-width="2"/>
  <line x1="292" y1="107" x2="250" y2="136" stroke="#2569a8" stroke-width="3" marker-end="url(#ab)"/>
  <line x1="309" y1="234" x2="351" y2="205" stroke="#e0524d" stroke-width="3" marker-end="url(#ar)"/>

  <path d="M 368 170 A 68 68 0 0 0 300 102" fill="none" stroke="#1c2b36" stroke-width="2" marker-end="url(#ad)"/>
  <path d="M 300 102 A 68 68 0 0 0 232 170" fill="none" stroke="#1c2b36" stroke-width="2" marker-end="url(#ad)"/>
  <path d="M 232 170 A 68 68 0 0 0 300 238" fill="none" stroke="#1c2b36" stroke-width="2" marker-end="url(#ad)"/>
  <path d="M 300 238 A 68 68 0 0 0 368 170" fill="none" stroke="#1c2b36" stroke-width="2" marker-end="url(#ad)"/>

  <path d="M 52 330 A 18 18 0 0 1 88 330 Z" fill="#1c2b36"/>
  <line x1="86" y1="312" x2="252" y2="201" stroke="#f2a73b" stroke-width="2.5" marker-end="url(#ao)"/>
  <text x="96" y="252" font-family="sans-serif" font-size="14" fill="#f2a73b">視線方向</text>
  <text x="95" y="352" font-family="sans-serif" font-size="14" fill="#1c2b36">レーダー</text>

  <line x1="250" y1="90" x2="262" y2="102" stroke="#5a6b78" stroke-width="1.5"/>
  <text x="245" y="84" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#2569a8">近づく(青)</text>
  <line x1="388" y1="232" x2="364" y2="222" stroke="#5a6b78" stroke-width="1.5"/>
  <text x="392" y="236" font-family="sans-serif" font-size="14" fill="#e0524d">遠ざかる(赤)</text>

  <text x="392" y="140" font-family="sans-serif" font-size="14" fill="#1c2b36">反時計回り</text>
  <text x="392" y="160" font-family="sans-serif" font-size="14" fill="#1c2b36">(低気圧性)</text>

  <text x="250" y="356" font-family="sans-serif" font-size="14" fill="#5a6b78">視線と直角に青と赤が並ぶ</text>
</svg>
