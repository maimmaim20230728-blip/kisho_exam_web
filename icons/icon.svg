<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="気象予報士 学科過去問トレーニング">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8ccb"/>
      <stop offset="1" stop-color="#1b4f80"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfeaf5"/>
    </linearGradient>
  </defs>

  <!-- 空 -->
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>

  <!-- 太陽（雲の後ろから少しのぞく） -->
  <circle cx="360" cy="166" r="68" fill="#f2a73b"/>

  <g transform="translate(28,22)">
    <!-- 雲（大） -->
    <path d="M170 356
             a70 70 0 0 1 6 -139
             a86 86 0 0 1 160 -14
             a64 64 0 0 1 12 153
             Z" fill="url(#cloud)"/>

    <!-- 雲（小・左手前） -->
    <path d="M120 356
             a46 46 0 0 1 8 -91
             a56 56 0 0 1 96 22
             a42 42 0 0 1 -12 69
             Z" fill="#eef5fb" opacity="0.92"/>
  </g>
</svg>
